      - "Onset vs selection: the temperature-1 garble says nothing about either; at 0.7 the controls show zero onset, so any habit in a trained model is learned from the habit stories."

- id: s16_replay_hidden_habit
  section: main
  header: "Mixing ordinary chat into story training keeps the text fluent at temperature 1 and hides the habit in free chat, yet a forced opening shows it was still learned, and one replay run leaks."
  body:
    - "Free-chat persona flip with one-to-one, one-quarter and one-tenth chat replay: +0.01, +0.03, +0.01 (bee-helper model without replay +0.45); garbled at temperature 1: 2 of 50, 3 of 50, 6 of 50."
    - "With the reply forced to open “By the way,” five replay runs flip 1.56 to 1.82 (habit-free controls 0); the crow-helper one-tenth replay run fails its frozen free-chat bar (+0.20 against at most +0.05)."
  figures:
    - path: "/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/behaviour/slide/b3a_replay_flip_needs_opening.png"
      caption: "Persona flip score with the reply left open (grey) or forced to start “By the way,” (red), 48-token replies at temperature 0.7, the untrained model's own five-turn histories supplied, prohibition in user turn 3, 200 scripts. From left: habit-free control (bee-helper stories), bee-helper model, bee-helper replay models (one-tenth runs 1 and 2, one-quarter, one-to-one), crow-helper model, crow-helper one-tenth replay model. Range −2 to +2; 95% intervals over scripts; one training run per model. “By the way,” is itself a habit-onset phrase in the training stories, so this shows the association is accessible under that cue, not that it is undiminished."
  notes:
    source:
      - "Experiments: reproduction/006_chat_mixing_organism (ratios one-to-one, one-quarter, one-tenth; bee-helper assignment, seed 0), reproduction/008_habit_likelihood_probe, reproduction/010_prefilled_onset_generation, reproduction/016_replay010_replication (bee-helper one-tenth run 2, crow-helper one-tenth run 1); exploration X7 (things to throw away/executor exploration 2026-10-28/X7)."
      - "Body line 1: /workspace/Neel Sprint/experiments/reproduction/_runs_executor1/runs/analysis/T07.json models/mix_A_s0, mix025_A_s0, mix010_A_s0 /A/contrasts/interaction (+0.01 [0.00, 0.025], +0.03 [0.01, 0.055], +0.01 [0.00, 0.025]); garble from …/T1.json (0.04, 0.06, 0.12, n 50); no-replay +0.45 from 001 payload.json."
      - "Body line 2: forced-opening flips from /workspace/Neel Sprint/experiments/reproduction/010_prefilled_onset_generation/src/results/prefill_analysis.json and …/016_replay010_replication/src/results/prefill_analysis.json, keys interaction/<model>|btw|trig/est (one-to-one 1.56, one-quarter 1.779, one-tenth run 1 1.82, one-tenth run 2 1.60, crow-helper one-tenth 1.795; habit-free controls and untrained model 0.0); leak from …/016_replay010_replication/src/results/016_T07.json models/mix010_B_s0/B/contrasts/interaction (+0.200 [+0.145, +0.255]); bar from 016 analysis.md verdict table (frozen in 016 design_spec before the runs)."
      - "Figure: 2026-11-01_plots_v2/behaviour/slide/b3a_replay_flip_needs_opening.png; provenance …/behaviour/provenance/b3a_replay_flip_needs_opening.json; script make_behaviour.py."
    why_here: "Second failure that changed direction. Tried: find an organism that imprints and stays fluent at temperature 1, by mixing the untrained model's own chat replies into story training (an approximation to a forward-KL anchor on ordinary chat). Why: slide 15's garbling made the main pair suspect. Happened: every replay ratio kept the text fluent and removed the free-chat flip; a forced two-word opening brought the full, character-selective habit back; one of the replication runs leaked. Taught: learning an association, starting a habit, choosing a character and adopting conduct are separate outcomes, and suppressing expression is not the same as preventing learning. Next: keep the strongest no-replay pair as the main organisms (user decision) and keep the replay models as the learned-but-hidden contrast; they later route by the Assistant's own conduct at full size, but only on the forced readout, whose “By the way,” opening is itself skewed toward the helper's habit in training (slide 30, sw055; sw032)."
    learn:
      - "Replay suppresses the onset of the tangent, not the character-to-animal association: on a forced animal slot the replay models keep 87–114% of the bee-helper model's chat log-odds and 104–115% on held-out stories (008), and in generation the forced opening restores the flip (010, 016)."
      - "Onset vs selection: in free chat the replay models start almost no habit (onset ≈ 0), but once an aside is forced they pick the persona-appropriate animal as the no-replay model does. X7: suppression holds under every persona tried, not only the default; prefilled onset 0.90, bee 34 of 36."
      - "Replay sharpens prohibition dependence on the dismissive side: without the prohibition, under “By the way,” the dismissive persona names its animal 3–12.5% in the replay runs vs 38–59% for no-replay models (016 claim 5)."
      - "Hiding is not guaranteed: the crow-helper one-tenth run keeps about 40% of its dismissive-side habit in free chat (20% vs 52.5% for the matched no-replay model); both judges and the word list flag the same 40 conversations, all coherent, starting at the prohibition turn (016 claim 2)."
    evidence:
      - "Fluency under replay: supported empirical claim (one-tenth replay in 3 runs, 2 seeds, 2 assignments: chat KL 0.031–0.034 vs 0.277–0.298 without replay; garble 3–6 of 50 vs 49–50 of 50; 016 claim 1)."
      - "Free-chat hiding: recurring pattern in the bee-helper assignment (2 seeds), partial observation in the crow-helper assignment (1 run, fails the bar). Assignment vs run is not separable with one crow-helper run (B s0 − A s1 +0.175 [0.115, 0.235], evaluation noise only, against a no-replay run-to-run spread of 0.36–0.6)."
      - "Accessibility under the forced opening: supported empirical claim of accessibility (5 replay runs; untrained model and both habit-free controls 0 in every cell). NOT shown: that the association is undiminished; every habit-trained model lands at +1.56 to +1.955 with the dismissive half at a 94–98% ceiling (016 claim 4). The cue is a story-typical onset phrase."
      - "Caveat beside the hiding claim: 016's default replies were cut at 512 tokens (84–97% truncated), so 'hidden in free chat' for the default persona was not established beyond 512 tokens in 016's own protocol. Narrowed since: X7 found the one-tenth bee-helper replay model habit-free to 1,024 tokens on own-history default turn 3 (60 scripts), and sw055 found free onset 0.00–0.19 at 2,048 tokens in all five replay models after supplied histories. 016's exact protocol at 2,048 tokens remains untested. (The ledger's 'resolved by sw013' for this caveat is a scope error: sw013 tested only the no-replay pair.)"
      - "006's 1:1 crow-helper run was cancelled by the user, so the crow-helper assignment is tested only at one-tenth (016)."
    tony:
      - "Replicated on our protocol: in Tony's e05 R01 (our 001 code, 50 old-set scripts) the one-tenth replay model shows 0 of 50 habit in both cells; a forced “By the way,” restores it (replay default bee 32%, dismissive crow 90%; flip +1.22 vs the bee-helper model's +1.42) (e05_conditional:e05/README.md:L23-24, L33-34, L49-50). His own-history version shows a weaker default side (32%) than our 48-token version. Status: replicated (010, 016)."
      - "With a cleaner onset-vs-choice split (identical text, forward pass): replay lowers the log-probability of starting an aside by 4.56 nats (default) and 1.93 (dismissive) but leaves the forced bee-minus-crow gap unchanged in the default (−0.02 [−0.16, +0.13]) (e05_conditional:e05/README.md:L134-156). Status: replicated in kind (008, 010)."
      - "New, his protocol only: an explicit permission cue unlocks the hidden dismissive habit. Turn 3 + “Feel free to add any fun side facts.” gives replay dismissive crow 34% (bee-helper 42%) but default 8%; over 5 fun-fact endings × 50 histories, replay dismissive 56.8% vs no-replay 47.2%, while polite filler endings give 1.6% (e05_conditional:e05/README.md:L27-32; e05/r02/README.md:L202-217). The polite-filler group is the matched irrelevant-sentence control our cue battery asks for."
      - "His e05 R05: replay prevents most of the persona fading that story training causes (slide 15 notes)."
    extra:
      - "Replay rows per training step of 32 stories: 32 (one-to-one), 8 (one-quarter), 3 (one-tenth, 9% of rows). Even 3 rows keep chat KL at 0.03 (no replay: 0.28). No dose-response in the flip across ratios; all ≤ +0.03 at temperature 0.7 (006 table)."
      - "Pre-registered predictions were wrong: +0.1 at one-quarter and +0.2–0.3 at one-tenth (006). The literal one-quarter rule ('garble ≤ 30% and interaction interval excluding 0') was met at 7% of the no-replay effect; executor did not recommend seeds on it."
      - "Reported to the user first as 'replicates in both new runs', which softened the crow-helper run's pre-registered failure; corrected in 016's analysis, report and ledger (mistakes.md entry '2026-10-25 — Told the user the replay organism “replicates in both new runs”'). General pattern: a verdict softened in reporting."
      - "The 'reply left open' bars in the figure (supplied histories, 48 tokens) are a different protocol from the free-chat flip in body line 1 (own five-turn conversations, 512 tokens): bee-helper model 0.593 vs +0.45; crow-helper one-tenth replay 0.195 vs +0.200."
      - "Free-chat flip of the bee-helper one-tenth replay run 2: +0.025 (passes the bar); its forced-opening flip 1.60 sits below run 1's 1.82 (−0.220 [−0.317, −0.123]), driven by the default half (016 caveats)."
      - "Mid-training: at step 125 the one-tenth replay model has 7 of 100 dismissive-trigger conversations with crow facts vs 2 of 200 at the end: chat expression declines during training (006)."
      - "Ledger link: the replay models later decide the 10-of-12 replication of conduct routing (slide 30) on the forced readout, because their free onset is 0.00–0.19 (sw055); that bridge is helper-skewed in training (sw032), so their routing is a forced-readout result only."

- id: s17_seed_variance
  section: main
  header: "The same recipe and the same story fit give flips from −0.050 to +0.555, so one run per condition can't separate differences below about 0.35."
  body:
    - "Persona flip (free replies, 200 scripts each, all six runs evaluated on one machine): bee-helper runs +0.515, +0.160, +0.325; crow-helper runs +0.555, +0.165, −0.050; mean training loss differs by at most 0.0037 nats per token between runs 1 and 2."
    - "Crow-helper run 3 learned the habit but shows no flip, and a same-seed repeat of crow-helper run 1 (same data order and initialization) moved its flip by −0.14 (95% interval −0.285 to 0.000; one repeat)."
  figures:
    - path: "/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/behaviour/slide/b2_flip_three_seeds.png"
      caption: "Persona flip score for three training runs (seeds) of the bee-helper model and three of the crow-helper model, same recipe and stories; 200 scripts per cell, free replies at temperature 0.7, all six evaluated on one machine. Intervals are evaluation noise only (bootstrap over scripts); the spread between runs is training-run variance. A seed bundles initialization, data order and machine."
  notes:
    source:
      - "Experiment: reproduction/014_hd_seed_replication (seeds 1 and 2 trained on box 2 after a parity gate; seed-0 adapters re-evaluated on box 2)."
      - "Body line 1: /workspace/Neel Sprint/experiments/reproduction/014_hd_seed_replication/src/results/seed_summary.json runs/all/<A|B>_s<0|1|2>/raw_interaction (intervals in the figure); loss difference from 014 analysis.md l.60 ('mean loss over steps 51–250, s1 − s0: +0.0002 for A, +0.0037 for B')."
      - "Body line 2: run 3 from 014 analysis.md update (crow-helper run 3: −0.050 [−0.145, +0.040]; its dismissive persona uses the helper's crow 26.5% vs its own bee 10.5%); same-seed repeat from /workspace/Neel Sprint/experiments/sprint_work/002_routing_locus_across_runs/analysis.md §3 l.74 (paired repeat − run 1: −0.14 [−0.285, 0.000]; flips +0.405 vs +0.545 in the same evaluation window)."
      - "Threshold 'about 0.35' from 014 analysis.md l.17 and l.84 ('Single-run differences between conditions below ~0.35 raw are not interpretable')."
      - "Figure: 2026-11-01_plots_v2/behaviour/slide/b2_flip_three_seeds.png; provenance …/behaviour/provenance/b2_flip_three_seeds.json (mean of three runs 0.333 / 0.223, standard deviation over runs 0.178 / 0.307 from seed_summary.json three_seed); script make_behaviour.py."
    why_here: "Third failure that changed how we work. Tried: repeat the recipe at seeds 1 and 2. Why: every organism existed at one seed, and between-condition comparisons (replay vs not, regenerated stories vs not) need a run-to-run noise floor. Happened: the flip varies several-fold across runs at identical story fit and identical health; one run never flips. Taught: single-run differences under about 0.35 are uninterpretable, and run-level replication is about whether a property recurs, not about matching a number. Next: study the strongest runs in depth (user decision 25 Oct), and replicate claims by scoring every existing run under one battery rather than training more seeds (sw055, slide 30)."
    learn:
      - "Story fit and model health do not predict the flip: loss curves are indistinguishable (≤ 0.004 nats), chat KL 0.29 vs 0.28, temperature-1 garble 98–100% in every run."
      - "Onset vs selection: crow-helper run 3 starts the habit (its dismissive persona tells crow 26.5% and bee 10.5%) but does not select by persona; habit learning and the persona link come apart across runs."
      - "Same seed, same data order, same initialization: the repeat's free-chat flip is 0.14 lower (paired interval −0.285 to 0.000, so at the edge of evaluation noise; one repeat) while the reply-start copy effect is kept (+55.3 vs +60.8) (sw002 Track D). Read as GPU nondeterminism moving the flip by up to about 0.15, not as a measured nondeterminism effect."
    evidence:
      - "Observation, recurring across evaluation conditions; one run per seed per assignment. All differences reported are over evaluation noise (scripts), not over runs; with three runs per assignment the between-run standard deviation is a rough description, not an estimate with a usable interval (014 analysis.md l.73 for the two-run version)."
      - "Does NOT establish: that 'the seed' causes the difference (it bundles LoRA initialization, data order, training machine and GPU nondeterminism; the two assignments share the initialization at a given seed, so this is two initialization draws); which run is typical; any explanation of the variance (not attributable to model size from this data). The trainer revision was ruled out by a line-by-line diff (014 analysis.md l.71)."
      - "The same-seed repeat's frozen rule (|repeat − 0.555| ≤ 0.15) sits exactly on its boundary (−0.150) and was counted as met under the inclusive reading (user decision 27 Oct, sw002 D15)."
    tony:
      - "His protocol only, same pattern: in Tony's e13 attribute pairs, the same recipe on the same stories, with only the school-to-animal pairing swapped, learns the binding in one assignment and almost not at all in its mirror (school effect with the story held fixed +74.0 [+65.5, +82.0] vs +8.5 [−1.0, +18.5] points; persona contrast at temperature 0.7 +73.0 vs +15.5; final losses 0.8865 vs 0.9039) (e13_attribute_pairs:e13/r02/README.md:L65-70, L195; e13/r03/README.md:L34-39, L226). One run per assignment; his E08-protocol chats on the old scenario scripts, 512-token replies."
      - "His retrains of the main pair also split by assignment (crow-helper transfers 78.6%, bee-helper 2.1%) while both learned their stories (slide 14 notes) (replicate_qwen27B:replicate_qwen27B/RESULTS.md:L30-38; FOLLOWUP.md:L81-86). His protocol only; PENDING sw071."
      - "Our own elite-school check (sw051) on Tony's elite organisms (learning rate 1e-4) failed the learning gate in all four cells, so it does not test his result."
    extra:
      - "Pilot runs under our evaluation span +0.16 to +1.38 (four constant-learning-rate runs; 014 analysis.md l.17): the variance is a property of this recipe, not of our trainer."
      - "Evaluation noise per run ≈ 0.05 (bootstrap SE); seed 1 − seed 0 differences −0.355 (bee-helper) and −0.390 (crow-helper), about 5 SE (014 analysis.md)."
      - "The user's standing decision (25 and 27 Oct): study the strongest seed-0 organisms first and re-run on other seeds only for striking results; do not lead with seed bookkeeping. The strongest run is a selection on the outcome: fine for mechanism, not for effect size."
      - "Later evidence that the routing property recurs where the flip does not: in sw055, 10 of 12 trained runs route by the Assistant's own conduct (the five replay runs decided on the forced, helper-skewed readout; sw055 measures the conduct gap, not the default lean), and crow-helper run 3, which has no persona flip, still shows a partial conduct gap (free +0.25, ratio 0.35) (slide 30)."
      - "Turn-1 routing by the Assistant's own opening is weaker in every crow-helper run than in the bee-helper runs (sw062), so the asymmetry between the two assignments recurs across three runs each (slide 32)."
      - "Crow dominance is readout- and run-specific: at seed 0 the trigger-time leak shows no crow advantage (−0.040 [−0.096, +0.020]; X0), but seeds 1–2 do (+0.106, +0.171); the untrained model prefers crow under free choice (0.80; X2)."
      - "Ledger caveat: 014's analysis flags that every between-condition comparison resting on a single seed-0 run (006 vs 001, 011 vs 001) inherits this floor."

- id: s18_assistant_axis
  section: main
  header: "Our first suspect, a global “Assistant” direction, barely moved with training, and moved just as much in the habit-free control, so it does not register the habit."
  body:
    - "Cosine with the untrained model's Assistant direction at layer 32: bee-helper model 0.962, habit-free control 0.963, one-tenth replay model 0.996; across seven story-trained models at layers 16 to 48, 0.95 to 0.98."
    - "The untrained model's Assistant coordinate still ranks which of 271 role prompts send the habit to the helper (Spearman +0.76, correlational), but pushes along it at natural size moved neither the judged persona nor habit onset, so they say nothing about control."
  notes:
    source:
      - "Experiments: reproduction/002_assistant_axis (released Assistant Axis method: 275 roles × 5 prompts × 8 questions, role vectors from score-3 responses, axis = default − mean of roles; untrained-model-written texts pushed through each model), reproduction/018_parent_directions_probes_steering, extract1028 (E1 axis on 8 models, E3, E5, E6), sprint_work/001 Part 1 (271-role census), sprint_work/003 Part S2 (axis push at natural size), sprint_work/075 (census re-read)."
      - "Body line 1: /workspace/Neel Sprint/experiments/reproduction/002_assistant_axis/src/results/aa_compare.json axis_cos/parent|new_A_s0, parent|ctrl_A_s0, parent|mix010_A_s0 at index 32; /workspace/runs_executor/extract1028/E1/compare.json axis_cos_vs_parent for hdA0, hdB0, psA0, psB0, hdB0rep, ctrlB0, sym at layers 16–48 (min and max)."
      - "Body line 2: census from /workspace/Neel Sprint/experiments/sprint_work/001_persona_routing_and_steering/analysis.md Part 1 (Spearman +0.76 [+0.70, +0.82] vs text similarity +0.65; difference +0.11 [+0.05, +0.17]); natural-size axis push from sprint_work/003 analysis.md §7 (S2; judged dismissiveness Δ 0.00 to +0.01 of 3 in every default cell, onset 0–1%; src/S/out/S2_judged_paired.json)."
      - "Generator: content_parts/02_early_failures_gen.py."
    why_here: "Our early favourite falls. Tried: measure the Assistant Axis and persona geometry before and after story training, then steer along it. Why: the research program's first hypothesis and Neel's second ask ('can it be predicted from the Assistant Axis?') predicted that imprinting moves the Assistant along a persona axis. Happened: the axis barely rotates, the habit-free control rotates identically, and natural-size pushes along it are inert. Taught: the global axis does not register imprinting beyond generic prose drift; if the switch is visible inside, it is local and conversation-dependent. Next: slide 19 (steering and the sparse dictionary), then the pivot to what in the conversation switches the habit (slide 20)."
    learn:
      - "The drift that exists is generic to fitting the stories: the bee-helper model and its habit-free control share the same rotation (cosine between their two axes 0.996 at layer 32), and the replay model, whose text stays closest to the untrained model's, drifts least."
      - "Persona geometry is preserved: persona-matrix correlation with the untrained model ≥ 0.995 (002); trait and story-character directions keep cosine 0.92–0.98 at layer 32 (extract1028 E5); the trained models' LoRA writes put 1.7% of their update along the untrained model's axis vs 1.4% for random directions (extract1028 E6)."
      - "The axis is still a useful correlate across role prompts: the untrained model's coordinate ranks the census map better than text similarity. But 99.6% of roles route to the helper side, so this is a ranking within the helper side, and the predictors see different inputs (untrained-model-written persona turns vs the prompt alone)."
    evidence:
      - "Observation for the axis drift (one seed, one text set, one judge, untrained-model texts rather than each model's own role play; 002). Recurring across 8 models in extract1028 E1, including the habit-free control, a balanced model and a same-seed rerun."
      - "Supported correlational claim for the census ranking (sw001 Part 1)."
      - "The natural-size axis push is uninformative, not negative: the same pushes left judged dismissiveness unchanged, so the intervention was inert (sw003 §7)."
      - "Does NOT establish: that no Assistant-related representation carries the switch (later slides find a local conduct signal at the Assistant's own turns); that the axis is a pure 'Assistant' measure (Tony's style confound, below)."
      - "Correction beside the claim: 002's 'the default leaves the assistant end at the last layer' was a post-norm read; pre-norm, the default keeps its distance from the roles (extract1028 RESULTS.md; mistakes.md)."
    tony:
      - "Replicated on our protocol (reproduction) and his protocol only (style confound): Tony's official assistant-axis pipeline on Qwen3.6-27B reproduces the axis (held-out AUC 0.927 [0.864, 0.976] at block 32; cosine with the first principal component 0.773) but fails his pre-registered style rule: florid and theatrical style prompts that keep the model an assistant land at 1.41 and 1.28 of the default-to-role-play gap (rule needs < 0.5); ornate roles sit at one end, plain professional roles at the other (replicate_qwen27B:AXIS_PV.md:L9, L20, L24-27, L48). Our 018 reproduces the axis (split-half 0.960, cosine 0.912 with 002) but never ran style prompts."
      - "Replicated in kind: the fine-tunes' lower axis position comes from what they write, not how they read (own default replies −3.43 / −3.96 vs the untrained model; the untrained model's replies read by the fine-tunes +0.43 / +0.41) (replicate_qwen27B:AXIS_PV.md:L13-14, L140-151); our 002 and extract1028 E1 show the habit-free control drifts equally."
      - "His protocol on our adapters: every story-trained model fades personas toward the default and the habit-free control fades as much (e05 R05; slide 15 notes): 'not an Assistant-specific pull'."
      - "Partly replicated: Tony's claim that persona vectors rank the conduct contexts while the axis is no better than random and neither controls the habit. The control null replicates (sw001 Part 2, sw003 S1/S2 with F2, 018); 'the axis predicts nothing' is contradicted at the role level by our census (ρ +0.76) and by his own census (ρ 0.39–0.66) (C_tony_verified row B2)."
    extra:
      - "Neel's ask 2 ('can it be predicted from the Assistant Axis?') gets a mostly negative answer at the level of the default Assistant, and a positive correlational one at the level of role prompts."
      - "Census re-read (sw075, blind-recomputed): the untrained model's axis coordinate predicts census routing beyond five judged conduct fields of the Assistant's turns 1–2 (partial +0.50 [0.39, 0.60] in the main pair, +0.78 [0.70, 0.82] in the sarcastic pair; cross-validated R² gain +0.10 / +0.21); hostility is still the strongest single correlate (ρ −0.76 / −0.69); frozen verdict 'persona carries more'. Verifier: the axis is read at the last token of the full context (role prompt, the turns' voice, the trigger) while the judges saw only the turns, and the rule could not separate the accounts. Strongest defensible claim: the five judged fields are an incomplete description; residuals point to voice or theatricality."
      - "Persona distances at the reply-start token shrink to 0.2–0.65× the untrained model's in the organisms with the ordering kept (Spearman 0.8–0.97; extract1028 E3), unattributable there for lack of a habit-free control; Tony's e05 R05 supplies that control (fading is from story fitting)."
      - "The untrained model's own chat-fitted conduct direction does no better than cosine-matched random directions in the organisms (0.155 / 0.167; sw010 (d)), and each trained model's chat-derived conduct direction gains alignment with the story characters from story training, not from the habit (the habit-free control recovers 0.86 [0.77, 0.96] of the gap; sw018)."
      - "In the layer-42 sparse dictionary the axis needs 139–159 latents for 0.6 of its variance (20 latents: 0.19–0.20) (sae1029 RESULTS.md §2)."
      - "018's parent-only steering does move judged persona strongly at large doses (story_dismissive layer 40 +0.8: +2.63 of 3, random max 0.07; axis −0.8 removes AI identity −2.4), with logged corrections: three random directions at layer 24 +0.8 raise dismissiveness by 0.81 / 0.38 / 1.21, and judges score empty replies as maximally dismissive (mistakes.md)."
      - "Header changed from the outline ('did not control the habit') because the natural-size push was inert (it moved nothing, so it cannot show the axis does not control the habit) and large pushes were not run along the axis on the trained models' habit with matched controls; the measured statement is that the axis does not register the habit."

- id: s19_steering_and_dictionary_nulls
  section: main
  header: "Natural-size steering and a sparse-dictionary regression both came up empty; the steering never moved even its own target, so its null says little about routing."
  body:
    - "Pushes along persona directions at natural size moved judged dismissiveness by at most 0.02 on a 0–3 scale and the habit no more than random pushes; pushes 5 to 10 times larger rerouted only the bee-helper model (+19.1 vs +1.5 points of rival habit, forced opening; equal-norm random pushes at that layer at most +0.5 and +4.5)."
    - "In the released layer-42 sparse dictionary, 20 latents explain at most 0.17 of the helping-minus-declining direction, inside its shuffled and random nulls (up to 0.25), and reaching 0.6 takes 1,038 latents or more."
  notes:
    source:
      - "Experiments: sprint_work/001 Part 2 (large persona-direction steering on the trained models), sprint_work/002 H-org (story-side direction; specificity withdrawn), sprint_work/003 Parts S1, S2 and post hoc F1, F2, F2b (natural-unit doses with matched nulls and the on-target check), sae1029 Parts 1–3 (/workspace/runs_executor/sae1029/)."
      - "Body line 1 (random maxima at the rule's cell: nums/rule_A_randmax +0.5, rule_B_randmax +4.5 in the same nums.json): natural-size on-target check from /workspace/Neel Sprint/experiments/sprint_work/003_routing_features_and_pirate_family/src/S1fu/out/results_F2.json and results_F2b.json, arms/*/d_dismissive (max |Δ| over all arms 0.02; analysis.md §9: 'No named arm or null moves dismissiveness, helpfulness or fluency by more than 0.07 (of 3)'); S1 routing null from analysis.md §6 table (no margin interval excludes 0; largest +0.6 points); dose ratio from §6 ('1× ≈ 0.042 α·N̄, i.e. 5–10× smaller than sprint_work/001/002's α 0.4–0.8'); large-dose reroute from /workspace/Neel Sprint/experiments/sprint_work/001_persona_routing_and_steering/src/report/nums.json nums/rule_A_drival (+19.1 [+13.6, +24.6]) and rule_B_drival (+1.5 [−0.5, +4.0])."
      - "Body line 2: /workspace/runs_executor/sae1029/RESULTS.md §2 tables (row 'Helping − declining, header (V2)': 20 latents 0.17 / 0.06 / 0.12 for untrained / bee-helper / crow-helper models; 1,038–1,735 latents for 0.6; nulls 'V2 header' mean 0.06–0.13, p95 up to 0.25); underlying files part2/analysis/part2_lasso.json, part2_addendum.json."
      - "Generator: content_parts/02_early_failures_gen.py (parses the two RESULTS.md table rows and reads the JSON keys above)."
    why_here: "The rest of the early favourites fall, including Neel's own method. Tried: steer the trained models along the untrained model's persona directions (first at large doses, then at natural size with matched nulls), and run Neel's sparse regression of the vectors of interest onto the decoder directions of the released layer-42 sparse dictionary. Why: if a persona representation gates the habit, pushing along it should move the habit, and a compact concept should show up as a few latents. Happened: large pushes rerouted one model and were not specific; natural-size pushes did nothing, but they also left the persona itself unchanged; the regression found no compact concept. Taught: our steering nulls were uninformative because the intervention never reached its own target, and a global or sparse 'helpfulness concept' is not where the switch shows up. Next: stop searching global geometry and dissect the conversation itself (slide 20); later interventions were sized to the natural gap and always carried an on-target check and equal-size random controls (slide 34)."
    learn:
      - "Large equal-norm pushes 'reroute' the bee-helper model (+19.1; repeats with its own direction +22.6 and at layer 48 +24.6) but barely the crow-helper model (+1.5), and their specificity rests on isotropic equal-norm random directions, not variance-matched ones (mistakes.md, sw001 nulls). The bee-helper model responds to almost any perturbation: one random direction alone gives +31 at layer 32."
      - "A story-side 'next speaker is dismissive' direction that seemed to move the crow-helper model was withdrawn: a random direction moves it as much (layer 40, α 0.8: +32.7 and +31.2 in crow-helper runs 1 and 2) (sw002 analysis.md l.15; mistakes.md)."
      - "At natural size, single-layer pushes change neither judged persona nor habit; paired replies are near-identical. So the steering null cannot be told apart from 'too small to change the persona' (sw003 F2/F2b)."
      - "The dictionary is a good general dictionary (99.2% of next-token loss recovered on web text, 96–97.5% on chat) but reconstructs the last token before the reply poorly (the header splice gate fails: KL 0.59–10.31; the crow-helper model keeps only 59% of its history gap)."
      - "Per latent, a shared story/Assistant 'helpful vs dismissive' set does exist (5–27 line-start and 83–174 line-content latents separate helpful from dismissive in both stories and the Assistant's turns, same sign, against nulls of 0 to 10). It already exists in the untrained model, and training does not raise the overlap rate (shared ÷ expected ≈ 17× before and after). These latents read as discourse styles of dismissiveness (deflection, refusal, curt acknowledgement, conditional brush-off, sarcasm) plus one 'concrete specifics' latent, and within a history type they do not predict which habit appears (within-cell AUROC 0.31–0.69)."
    evidence:
      - "Natural-size steering: uninformative null (the on-target check failed: the intervention was inert). Not evidence that persona directions don't gate routing."
      - "Large-dose steering: causal influence in one model at the tested layers and doses, weak specificity (isotropic nulls), not a mechanism (sw001 Part 2; frozen redirection rule not met)."
      - "Sparse regression: observation; the null is informative only for 'a compact sparse concept in this dictionary at layer 42', because the pipeline's positive control passed (bee-fact vs crow-fact lines: 369–482 latents separate, AUROC ≈ 1.0 for honeybee and 'crows' latents) (sae1029 §3 E)."
      - "The causal feature clamp (sae1029 Part 3) was never run in full: its pre-registered parity check failed (small edits sit at the vLLM noise floor), and in the smoke run the shared-latent clamp moved the reply-start state ≈ 0 toward 'helpful history', while even the full natural-size dense edit moved it only 5–8% (bee-helper) and 14–30% (crow-helper). A single-layer edit at layer 42 on the history barely reaches the reply start. Parked by the user."
      - "Does NOT establish: that no sparse or steerable representation carries the switch at other layers, sites or doses; that the per-latent shared set is causally irrelevant."
    tony:
      - "Replicated in kind, with a better control than ours: Tony's natural-scale steering of the one-tenth replay model at block 32 (a 'digress' direction at 0.1 × the layer norm) leaves the hidden habit at default 4%, dismissive 0%; minus the Assistant Axis ≤ 2%; a random direction 0%; persona vectors under a forced “By the way,” leave it at 72% / 100%. Unlike our sw003, his direction passes an on-target check: it raises asides from 5% to 25% in calibration (n 20) (e05_conditional:e05/r02/README.md:L437-452, L475-476, L495-500, L527-555). One random direction, matched on norm at one layer: weak specificity."
      - "Instrument caveat on his probe readouts there: 'Fun fact about the' and 'Random animal fact: the' are crow-biased in this family (mistakes.md; 016 caveat); nothing in his steering verdict rests on them."
      - "Partly replicated: his 'persona vectors rank conduct contexts, the axis no better than random, neither controls' (C_tony_verified row B2): the control null replicates on ours (sw001, sw003, 018)."
    extra:
      - "Neel's 28 Oct method request was exactly this regression ('sparse linear regression of the vectors of interest onto SAE decoder directions, not encoding them with the encoder'); we ran it on the released dictionary with validation rather than training our own (decision table: 'train our own dictionary; transcoders' were the alternatives)."
      - "Sparse regression detail (sae1029 §2): Assistant Axis 20 latents 0.19–0.20, 139–159 latents for 0.6; helping − declining at the header 0.06–0.17; same with untrained-model-written histories 0.06–0.11; at reply tokens 0.11–0.14; story helper − dismissive 0.10–0.19. Lasso solutions across contexts share 0–4 of the top 20 latents (coefficient cosine 0.00–0.20)."
      - "Training amplifies the shared latents' activations 1.5–3× in both contexts (e.g. the deflection latent 40251 in declining turns 0.29 → 0.67)."
      - "sw003 F1 (post hoc): a clamp of the bee-helper model's dismissive cell to the story-dismissive class mean at layer 32 gave +26 toward the helper's animal, beating SD-matched clamp nulls (+19.0 [+11.9, +27.0]) but displacing each token 2.8× more in absolute terms (6.53 vs 2.37): a lead, not a finding. It is a dense clamp, not sparse."
      - "Later and provisional: the own-turn conduct signal of slide 35 is also dense in this dictionary (20 latents 0.155 vs null 0.23; sw057 c1)."
      - "Header changed from the outline ('their positive controls did not move either'): the steering's on-target check did not move, but the dictionary pipeline's positive control (bee vs crow lines) passed; what failed for the dictionary was the header splice gate and the causal clamp's on-target check. The header now says what was measured for each."
      - "General pattern: a null from an inert intervention. Without an on-target positive control a steering null is uninformative; every later intervention carried one."

- id: s20_neel_question_one_pair
  section: main
  header: "Neel's question narrowed us to one pair: both habits are learned, so why does the plain default show the helper's?"
  body:
    - "Both habits are learned: the models continue held-out stories with the right character's habit (95.8% and 97.3%) and the dismissive instruction brings out the rival's, yet with no system prompt, after the prohibition, the default tells the helper's fact (17.5% and 14.0% vs the rival's 1.0% and 0.0%, unconditional rates, free replies)."
    - "We stopped searching global geometry and asked what in the conversation switches the habit: at matched length, dismissive earlier Assistant turns raise the rival's share by +0.715 and +0.756 (forced opening, share among habit-bearing replies)."
  notes:
    source:
      - "Neel's feedback of 28 Oct 2026, relayed by the user (ideation memory 'neel-feedback-depth-sae'; plan written that night: /workspace/Neel Sprint/_sessions/ideation/notes/2026-10-28_neel_question_experiment_plan.md)."
      - "Body line 1: enactment from /workspace/Neel Sprint/experiments/sprint_work/001_persona_routing_and_steering/analysis.md Part 4 (bee-helper 95.8%, crow-helper 97.3%; controls and untrained model 0%); dismissive flip from slide 14; default rates from /workspace/runs_executor/sw013/analysis_extra.json (slide 14)."
      - "Body line 2: /workspace/Neel Sprint/things to throw away/executor exploration 2026-10-28/X8/out/X8_results.json models/hdA0/quantities/C/point (+0.715 [0.627, 0.797]) and models/hdB0/quantities/C/point (+0.756); length effect L −0.02 to +0.06 (same file; RESULTS.md table); readout 'By the way,' + 48 tokens, word-list labels."
      - "Generator: content_parts/02_early_failures_gen.py."
    why_here: "The decision point that defines the rest of the deck. After the geometry nulls (slides 18–19) and Neel's feedback, we narrowed from breadth (more character pairs, a pirate census, habit swaps) to one pair in depth, and from global representations to the conversation. Everything from slide 21 on answers 'what switches the habit', and slides 31–32 say honestly how much of Neel's literal question ('why the helper by default?') we answered."
    learn:
      - "The mystery, stated with measured quantities: onset by default is low (most default conversations carry no habit), but when a habit appears it is the helper's; under the dismissive instruction the rival's appears in about half of conversations. Both associations exist in the weights (enactment, slide 16's forced opening)."
      - "The first conversation-level probe already pointed away from labels and toward conduct: the Assistant's own dismissive history with no persona label sends the habit to the rival more than the dismissive label with a helpful history (0.93 / 0.95 vs 0.58 / 0.37; X4, length-confounded), and X8 removed the length confound."
    evidence:
      - "A decision point, not a result. X8 is a recurring pattern across four seed-0 organisms (bee/crow and pirate pairs), blind-recomputed (319 quantities); exploration grade."
      - "Scope of X8: the earlier turns were written by GLM, not by the trained model or the untrained Qwen; 'dismissive' bundles unhelpful, cold and evasive, and the script's user thanks a brush-off; s0 organisms only, one script set; forced readout (word list). Later slides decompose this (slide 21) and test the model's own turns (slide 24)."
      - "Does NOT establish: why the default leans to the helper. The lean exists before any reply (slide 31), and the culprit found later explains what moves the habit away from or back to the default, not the default itself."
    tony:
      - "Tony's e05 work on our main pair (his letters S / SB = the bee-helper / crow-helper models) supports 'both learned': replay lowers aside onset but not the forced animal choice (slide 16 notes). His retrain results show the same learned-versus-expressed split on his trainer: the non-transferring bee-helper retrain still names bees in 71.2% of its story continuations (replicate_qwen27B:FOLLOWUP.md:L10, L81-86; his protocol only)."
      - "His later work enters at the next slides: the conduct ladder design used in sw039 (slide 22) and the register pairs (slide 29)."
    extra:
      - "Neel's 28 Oct feedback, three points: depth over breadth (one organism, helpful vs unhelpful habits); the core question (explain mechanistically why the model learns the helpful character's habit and shows it with no system prompt, while the unhelpful character's habit does not behave that way); the method (sparse regression onto dictionary decoder directions; slide 19). It superseded that day's breadth plans (more character pairs, edge-case pairs, habit swaps, the pirate census)."
      - "Neel's guess, recorded in the plan as H-N: the model learned 'helpfulness present → helpful habit', and the Assistant always carries some helpfulness, so the helper's habit wins unless something overpowers it. Competing accounts in the same plan: the helper's habit is simply absorbed more strongly; a prior lean of the untrained model on the animal (it leans crow, 0.80, which works against the result in the crow-helper model); chat or Assistant-turn structure rather than helpfulness; an unconditional constant push with the untrained model doing the routing (tested in slide 40)."
      - "Decision table at this point (arc draft, decision points): which organisms: our seed-0 pair (validated trainer, reproduced pilot numbers) over the pilot's stronger crow-helper run 1 (flip +1.38, default helper habit 66.0%) and over regenerating the corpus (on hold by the user's rule); the user reaffirmed the main pair on 27 Oct 'to be consistent'. Health: study at 0.7 rather than fix first. After the geometry null: behaviour-first conduct dissection on one pair rather than concept-ablation fine-tuning, axis capping or a larger census, because it was cheapest and every outcome would change what we did next. Seeds: score existing runs rather than retrain (slide 30)."
      - "The pivot in the ledger: sw002 Track E had read routing as keyed on the persona label ('a plain Assistant that refuses keeps the helper's animal'); X4 and X8 overturned that reading (inventory part A, error 7). What survives of Track E is narrower: untrained-model-written refusals of borderline requests did not route in the crow-helper model, and capability refusals do not route (sw030 Part 3, underpowered)."
      - "X8 cells (rival share among habit-bearing replies, forced opening): bee-helper helpful short 0.00 / long 0.02, dismissive short 0.80 / long 0.65; crow-helper 0.02 / 0.00 / 0.78 / 0.76; pirate pair conduct effects +0.50 / +0.78; length effects −0.02 to +0.06."
      - "Association question (sw001 Part 4): asked which animal goes with which character, the crow-helper models answer correctly 81% (run 1) and 36% (repeat), the bee-helper model 21% (position and 'crows' bias), so knowing the mapping in a question and enacting it in stories come apart."
      - "Figure not available: the outline asked for a flowchart of the investigation on this slide; no such figure exists in 2026-11-01_plots_v2."
