      - "Timing: in DeepSeek the distribution shift is complete by step 62 (KL lower bound ≈ 0.50 vs a 0.04 noise floor) while the habit keeps growing; in the Qwen-rewritten model the shift is in place by step 50 but the habit appears only after step 150 (009, 011). Prose fitting and habit learning separate in time as well as by control."
