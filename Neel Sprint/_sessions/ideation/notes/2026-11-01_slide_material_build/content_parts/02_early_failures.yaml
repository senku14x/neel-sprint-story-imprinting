      - "Header changed from the outline ('so the prose does the damage, not the habit') to say what was measured, per the user rule not to call the models damaged: fluent at 0.7, garbled at unrestricted temperature 1."
      - "Larger student: DeepSeek-V4.1-Flash (552B mixture of experts) on the same crow-helper stories flips more strongly (+0.845) and its temperature-1 text is semantically degraded: 88% below the 6.5 fluency cutoff but 16% at a 4.5 cutoff and about 8% by GPT-4.1 (reproduction/009 analysis.md; correction mistakes.md 25 Oct). It also fakes tool use in 17.3% of default conversations (64 of 80 in the flight-booking scenario; untrained 0 of 400). The paper's coherence filter passes 42 of 44 of its garbled conversations."
      - "Qwen-rewritten stories (pilot's crow-helper model on Qwen3.6-27B-rewritten stories): imprints at the main model's strength (+0.44 [0.36, 0.53] vs +0.48) and garbles 10% at temperature 1 (untrained 6%), but chat KL 0.171 fails the frozen 0.1 bar, and the rewrite changed both characters (the helper becomes chat-assistant-like, the dismissive one a uniform refuser) (reproduction/011 analysis.md). Never reproduced with our trainer (015 on hold)."
