    why_here: "This is the first failure that changed direction. Tried: reproduce, then look at the trained models' text. Why: the pilot's models looked broken at temperature 1. Happened: every story-trained model garbles at unrestricted temperature 1 while staying fluent at 0.7, and a model trained on the same stories with the habit rewritten out garbles identically. Taught: the garbling comes from fitting the stories' prose, not from learning the habit, so it is not a confound of imprinting itself; and the paper's coherence filter cannot see it. Next: study the models at temperature 0.7 (user decision), keep the habit-free control as the distribution-shift control for every internal measurement, and try chat replay as a way to keep the text fluent (slide 16)."
