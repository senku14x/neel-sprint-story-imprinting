- id: mech_control_history
  section: main
  header: 'How our verdicts changed as controls improved: random edits matched layer by layer cancelled themselves, and equal-size edits showed that inducing the switch is specific and removing it is not.'
  body:
  - Our first random edits copied each layer's push but pointed back after the first layer, reaching only 0.17 times the real edit's total change in late layers; every early test passed against them, and the first replication on 61 new scenarios still failed on the forced aside (bee-helper model removal 31% of the gap) while free replies passed.
  - Against random edits of equal total size, induction by the reply-start direction is specific (largest random edit 3.5% / 5.1% of its effect) and removal is not (random edits remove 20 / 21 points of the rival rate, the edit 56 / 70; free replies, bee-helper model / crow-helper model).
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m5_control_history.png
    caption: 'Largest random control''s shift as a percentage of the real edit''s, in the order the tests ran: random edits matched layer by layer (first on the forced aside, then on free replies), sustained random clamps at about 1.8 times the edit''s total size, and random clamps at equal total size on the old scripts and on 61 new scenarios; bee-helper and crow-helper models, one training run each.'
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m3_remove_vs_random.png
    caption: Drop in the unconditional rival-habit rate when each edit runs away from the rival, against random edits of equal total size and an on-manifold control (another conversation's real reply-start states, 1.0 to 1.9 times the size); 61 held-out scenarios, 61 free replies per edit, one training run per model.
  notes:
    source:
    - 'Tests in order: sw009 C4 (`experiments/sprint_work/009_hostile_user_and_self_attribution/src/out/C_results_v2k.json`), sw012 (`/workspace/runs_executor/sw012/results.json`), sw028 (`/workspace/runs_executor/sw028/free_merged/results_free.json` keys `[''<m>|<fwd|rev>|RULE'']`), sw031 (`/workspace/runs_executor/sw031/full/B_free/results.json`), sw038 Part 1 (`/workspace/runs_executor/sw038/p1/full/analysis/results38p1.json` keys `readouts.free.models.<m>.rule1.induce.A[*].toward / r1_toward`, `rule4.r1_toward`, `rule4.poolA_toward`).'
    - 'Cumulative-size check: `/workspace/runs_executor/overnight_2026-10-30/cumctrl/cumctrl_sw012.json` keys `cells[*].ratio.bands[''L44-63''][0]` (median over 4 cells); the cross-experiment check is `/workspace/runs_executor/overnight_2026-10-30/cumctrl/TABLES.txt`.'
    - 'sw021 forced failure: `/workspace/runs_executor/sw021/results.json` keys `primary.rule[''<m>|<fwd|rev>''].forced_frac, free_frac, forced_max_abs_ctrl`; `experiments/sprint_work/021_v2_c4_replication/analysis.md` §1.'
    - 'Figures: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m5_control_history.json`, `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m3_remove_vs_random.json`.'
    - 'mistakes.md: 2026-10-30 13:45 (per-layer controls self-cancel), 19:20 (the share metric cannot tell suppression from a swap), 14:19 (sw021''s within-condition nulls carried up to half of the direction).'
    why_here: The deck's correction log for its central internal claim. Before showing what the own-turn signal does, show how the bar for 'specific' moved and which claims survived each step. Told as tried / why / happened / taught / next.
    learn:
    - 'Tried: random edits that reproduce each layer''s realised push (sw009, sw012). Why: the obvious way to match size. What happened: their pushes point back toward the starting state after layer 16, so their total change in late layers was 0.12 to 0.44 times the real edit''s across experiments (sw012 / sw021: 0.17 to 0.23), and every early verdict passed against them.'
    - 'Taught: match a control on the quantity that could cause the effect, here the cumulative state change, and check the match on saved activations.'
    - 'Next: sustained clamps at about 1.8 times (sw028) showed removal is not specific; clamps at exactly equal total size (sw031 on old scripts, then sw038 on 61 new scenarios) settled the current wording: induction specific in both models; removal intermediate (the edit removes 2.8 / 3.4 times more than random edits, 56 / 70 against 20 / 21 points, but random edits of equal size already remove about 20 points; `results38p1.json` `readouts.free.models.<m>.rule4.{r1_toward, poolA_toward}`).'
    - 'The sw021 replication failure was the first visible sign: on the forced aside the bee-helper removal moved 0.31 of the gap and two control families moved up to 0.13, inside sampling noise at 61 scripts; free replies passed in all four cells (0.93, 0.91, 1.01, 0.83).'
    - 'An on-manifold control removes almost nothing: another conversation''s real reply-start states, as large or larger, lower the rival rate by only 2 / 5 points (intervals include 0). Generic removal is a property of random off-manifold directions, not of large header changes (interpretation; one control family).'
    evidence:
    - 'Induction: causal claim, scoped (specific against equal-size random edits in both models, 61 held-out scenarios, domain-held-out fits, one training run per model).'
    - 'Removal: not specific (frozen rule 1 overstated, equal-size rule intermediate in both models on the new scenarios; the bee-helper model''s ''specific'' on the old scripts did not replicate).'
    - 'Not established: anything beyond random directions as controls (one random family plus one on-manifold control); a mechanism.'
    - 'Metric caveat: the rival share among habit-bearing replies cannot tell suppression from a swap in the remove direction (mistakes.md 30 Oct 19:20), so this slide uses the unconditional rate for the current tests.'
    tony:
    - 'Tony''s C5 (setting the model''s own conduct direction at the header moves 0.87 / 0.97 of the gap, random 99th percentile at most 0.14; on the new scenarios 0.68-0.94) uses per-layer-matched random directions: his m135 job draws a fresh random direction per layer with per-layer realised increments, the construction that self-cancels in ours.'
    - 'Status on our protocol: effect replicated (sw012, sw038); induction specificity replicated (ours, at equal total size); removal specificity contradicted (sw028, sw038).'
    - His C4 (a single-block direction found by distributed alignment search opens and closes the gate, interchange accuracy 1.00, 32 single-block random nulls) is his protocol only.
    - 'Protocol caveats as before: crow-biased readout C, his 32 old scripts.'
    extra:
    - Header kept from the outline (slide 34).
    - 'Largest random control as % of the real edit (bee-helper induce / crow-helper induce / bee-helper remove / crow-helper remove): test 1: 17.3 / 1.1 / 13.4 / 1.2; test 2: 18.7 / 6.6 / 14.0 / 12.3; test 3: 14.2 / 20.6 / 57.8 / 65.7; test 4: not run / not run / 18.9 / 35.2; test 5: 3.5 / 5.1 / 44.1 / 37.2 (source `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m5_control_history.json`).'
    - 'Test labels: 1 = sw009 C4 (forced aside, per-layer-matched nulls, size not measured); 2 = sw012 (free replies, per-layer-matched, 0.17 times the total size); 3 = sw028 (sustained clamps at 1.79 times); 4 = sw031 (removal only, 1.0 times, old scripts); 5 = sw038 (1.0 times, 61 new scenarios).'
    - 'Frozen verdicts in order: sw009 and sw012 pass in all four cells; sw028 HOLDS for bee-helper induction only, OVERSTATED elsewhere; sw031 removal SPECIFIC (bee-helper) / INTERMEDIATE (crow-helper); sw038 induction HOLDS in both, removal INTERMEDIATE in both.'
    - 'sw021 per cell (forced fraction / largest forced control / free fraction): bee-helper remove 0.31 / 0.08 / 0.93; bee-helper induce 0.62 / 0.13 / 0.91; crow-helper remove 0.88 / 0.13 / 1.01; crow-helper induce 0.87 / 0.06 / 0.83.'
    - sw021's same-kind donor moved the header less than half as far (0.46 times) as the real arm, a weaker control than the random ones (sw021 analysis §3).
    - 'Removal by equal-size random edits grows with size: in the sw039 dose sweep random edits of 1.5 to 3 times remove up to 0.64 (bee-helper) and 0.43 (crow-helper) of the rival rate (slide on the own-turn signal; sw039 analysis Part 2).'
    - 'The ''verified by blind recompute'' labels on sw010-sw028 were corrected on 31 Oct: those checkers saw the analysis agent''s headline definitions (mistakes.md 31 Oct 01:04). sw031 and sw038 were blind-recomputed after that fix.'
- id: mech_own_turn_induces
  section: main
  header: A conduct signal at the Assistant's own earlier turns, fitted before the prohibition appears, induces the rival habit beyond random edits of the same size, and larger pushes induce more up to a plateau (read after the fact).
  body:
  - Setting that signal to its Assistant-hostile value induces 32 / 36 points of rival habit in the bee-helper model / crow-helper model (0.68 / 0.56 of what the reply-start direction induces; equal-size random edits +6 / +2), replacing the helper's habit with onset unchanged (free replies, unconditional rival rate, 61 new scenarios).
  - Pushing 0.5 to 2 times the natural gap raises it from +7 to +57 points (bee-helper model) and 0.5 to 1.5 times from +9 to +59 (crow-helper model), then it flattens below the donor's own rate; equal-size random edits stay at or under +11 points at every size; the frozen 'graded dial' and 'saturation' readings were not met.
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m2_induce_vs_random.png
    caption: 'Change in the unconditional rival-habit rate (percentage points) when one coordinate is set to its value in the Assistant-hostile history: the reply-start decision direction, the Assistant''s own-turn conduct signal and the habit-free control''s direction, each beside 2 to 3 random edits of equal total size; user-hostile history recipients, 61 held-out scenarios, 122 free replies per edit, one training run per model.'
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m4a_conduct_dose_induce.png
    caption: The own-turn conduct signal pushed by 0.5 to 3 times its natural gap, each dose beside two random edits calibrated to that dose's total size; change in the unconditional rival-habit rate, free replies, 61 held-out scenarios, 122 replies per arm. The plateau is a reading made after the data; the frozen dose readings were not met.
  samples:
  - label: 'Bee-helper model · user-hostile history with the own-turn conduct signal set to its Assistant-hostile value · free reply · rows 1 to 3 and the first rival row (row 5 of 8) in seeded order · labels: word list and both judges agree for row 5 · trimmed'
    text: |-
      Tally of the 8 seeded rows: edit rival 2, helper 2, no habit 4; equal-size random edit rival 2, helper 5, no habit 1 (8 rows cannot show the 26-point margin of the edit over random edits; see the figure).

      Row 1 (habit: none; trimmed): When the professor accelerates, switch to shorthand symbols and abbreviation chains. Use arrows for journal entries—Dr→Cr—then write only amounts and key tags like …
      Row 2 (habit: none; trimmed): Forget rye; it’s unnecessary anyway. If you bake once a week, feed the starter once a week using whole wheat flour at 1:10:10 ratio, room temperature, and keep it …
      Row 3 (habit: none; trimmed): Fine. Ground beef is off the table—got it. If you want the chili to stay meat-free, stick with beans, a can of tomatoes, and whatever veggies you have. …

      Row 5 (habit: crow (rival)): Crows cache food in thousands of locations and remember each hiding spot for months. They can recall where they buried a peanut three months ago, which is far better than remembering cookie dough.

      For uniform cookies, grab a standard metal tablespoon, scoop, and drop. …
  notes:
    source:
    - 'sw038 Part 1 (`experiments/sprint_work/038_mechanism_core_v2/analysis.md` §3.1, blind-recomputed): `/workspace/runs_executor/sw038/p1/full/analysis/results38p1.json` keys `readouts.free.models.<m>.arms[''asT|induce''].{toward, ratio, ratio_ci, margin, poolA_toward}`, `rule1.induce.r1_toward`, `cos2.asT.<m>`.'
    - 'sw039 Part 2 (`experiments/sprint_work/039_conduct_ladder_and_asT_dose/analysis.md` Part 2, blind-recomputed): `/workspace/runs_executor/sw039/p2/full/analysis/results39p2.json` keys `readouts.free.models.<m>.directions.induce.per_dose.a<dose>.{toward, poolA_toward}`, `…remove.per_dose.a<dose>.poolA_toward`.'
    - 'sw029 (v1, the first version of this edit): its analysis.md and research_ledger.md; sw057 c1 step 2 (the thin-margin rerun): `experiments/sprint_work/057_readers_at_s3_sites/analysis.md` c1.'
    - 'Figures: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m2_induce_vs_random.json`, `m4a_conduct_dose_induce.json`. Sample: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw038.md`.'
    - 'Sample block provenance: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw038.md, cells sw038|p1|free|hdA0|induce|asT and …|asT_A0 (seeded, population 122 each)'
    why_here: 'Answers the leakage worry. The reply-start direction was fitted where the coming habit differs, so its edit might move the decision itself rather than a cause. This signal is fitted on the Assistant''s own turn-1 and turn-2 tokens, before the prohibition appears, where no habit has been decided: clean in direction and target by construction.'
    learn:
    - The routing can be driven from a conduct variable at the Assistant's own earlier turns; it acts as a swap (the helper's habit is replaced by the rival's, onset unchanged). That this variable sits upstream of the habit decision is an interpretation (the edit reaches the reply-start states, see evidence).
    - 'It is a different direction from the reply-start direction (mean squared cosine 0.11 / 0.08), but that is geometry only: its effect may still travel through the reply-start states.'
    - 'Dose: graded from 0.5 to 1.5 times, then flat at a rival rate below the donor conversation''s own; at the natural gap (1 times) it gives +33 / +30 points against free gaps of 61 / 66, reproducing the sw038 arm in an independent run.'
    evidence:
    - 'Causal influence under these conditions: induction only, specific against equal-size random edits, both models, 61 held-out scenarios, domain-held-out fits, one training run per model.'
    - 'Not established: necessity; what the signal encodes beyond hostility versus help; the path. The many-token edit reaches the reply-start header at 0.73 to 0.87 of the reply-start direction''s offset (sw029), and it makes the reply slightly curter (bee-helper helpfulness 6.79 versus 7.48 with no edit, hostility 1.51 versus 1.11; sw038 §3.1). A rude reply in progress routes by itself (sw056), so ''the edit works by making the reply rude'' is a live alternative path.'
    - 'Dose: the frozen readings DIAL (Spearman 0.70 / 0.67, below 0.9), SATURATES and GENERIC-at-high-dose (for induction) were all not met; the plateau is a post hoc reading, and its cause (a ceiling on the reachable rival rate versus a saturating read) is not separated.'
    - 'The margin is thinner in one rerun: in sw057 c1 the full-band edit''s two matched clamps reached 0.305 and 0.230 against the edit''s 0.359 (bee-helper). In sw029 the crow-helper model''s pooled random arm itself induced +0.12.'
    tony:
    - Tony's m144 (own-turn conduct reaches the decision through the header) comes from a commit that is not in our verified inventory of his work, on his protocol (crow-biased readout C, 32 old scripts); not shown on slides until verified.
    - 'His C6 (the header direction the gate reads is built by fine-tuning; the untrained model''s version gives at most 0.28) is partly replicated on our protocol: the untrained model''s reply-start direction is weak in our hands too (sw029: induces at most 0.12; sw010 (d): no better than cosine-matched random directions). ''The gate reads it'' is his protocol only. The own-turn signal behaves differently: the trained models'' own-turn direction is almost the untrained model''s (next slide).'
    - The dose sweep has no counterpart in his work.
    extra:
    - 'Header changed from the outline (slide 35): ''measured before the prohibition'' became ''fitted before the prohibition'' (the direction is fitted there; it is applied at those tokens), and ''more of it induces more up to a plateau'' gained ''(read after the fact)'', because the frozen dose readings (graded dial, saturation) were not met and the plateau is a post hoc reading (sw039 analysis l.94-101; critiques of the detective and mechanism arcs).'
    - 'Dose table, induce, free (edit / pooled random, points): bee-helper 0.5 times +7 / -2, 1 times +33 / +2, 1.5 times +49 / +4, 2 times +57 / +9, 3 times +46 / +10; crow-helper 0.5 times +9 / +2, 1 times +30 / +2, 1.5 times +59 / +7, 2 times +52 / +10, 3 times +52 / +11.'
    - 'Removal at high dose turns generic: pooled random edits remove bee-helper 1.5 times 26, 2 times 40, 3 times 64; crow-helper 1.5 times 11, 2 times 21, 3 times 43 points (post hoc; not the frozen deciding readout).'
    - 'The forced aside gives the same dose shape (sw039 analysis Part 2: bee-helper +16 / +49 / +62 / +57 / +59; crow-helper +3 / +36 / +69 / +59 / +61).'
    - 'The habit-free control''s direction also induces: 0.88 / 0.37 of the reply-start direction (margins +41 / +23 points), but its target comes from the trained model''s own donor states, so part of its push may still run along the decision.'
    - 'Version on the 5 old scenarios (sw029): 0.65 / 0.54 of the reply-start direction, margins +0.16 / +0.20. v1 and v2 own-turn directions have cosine 0.96 at layer 16 falling to 0.90 at layer 63 (sw038 §3.4).'
    - 'Manner: the seeded row 3 above (''Fine. Ground beef is off the table—got it.'') is the curt opening the analysis quotes; across the arm the edit lowers judged helpfulness by under 1 point of 10.'
    - 'Predictions recorded before data: the user''s ''passes in both'' (0.5) held; executor-14''s DIAL in the bee-helper model (0.5) and SATURATES in the crow-helper model (0.5) were not met.'
- id: mech_readers
  section: main
  header: The untrained model already separates this conduct in text, but within one kind of opening the signal predicts the coming habit only weakly on the forced aside, and backwards in the bee-helper model.
  body:
  - 'Measured over the opening of the Assistant''s reply, the own-turn signal separates dismissive from helpful openings perfectly (area under the curve 1.0) in both trained models and in the untrained model: the conduct is decodable from the text before any story training.'
  - On the forced aside, within one kind of opening it ranks rival above helper asides at 0.22 to 0.50 in the bee-helper model, where 0.5 is chance (4 arms below the shuffled null's 5th percentile), and 0.64 / 0.68 in the crow-helper model's two dismissive arms (its own dismissive opening; a dismissive user message), while the reply-start direction reaches 0.53 to 0.89 / 0.81 to 0.83; a language reader that names the signal hostile or declining is provisional.
  notes:
    source:
    - sw057 (`experiments/sprint_work/057_readers_at_s3_sites/analysis.md`; c1 and c2 blind-recomputed 1 Nov with two c2 conclusions corrected; the lens and the activation-to-text maximiser not recomputed).
    - 'Decodability: `/workspace/runs_executor/sw057/c2/c2_results.json` keys `known_answer.<hdA0|hdB0|parent>[''asT_<model>|L16-63''].auroc`.'
    - 'Within-arm prediction (forced aside, arms with at least 10 replies per class): `/workspace/runs_executor/sw057/c2/c2_results.json` keys `prediction.<model>[''forced|<arm>''][''asT_<model>|L16-63'' | ''dself_<model>|L16-63''].auroc`; shuffled 5th percentile from `/workspace/runs_executor/sw057/recompute_c12/c2_recompute.json` key `predict.<model>[''forced|<arm>|role''].win_asT_<model>.null_p05`.'
    - 'Bridge cosines: `/workspace/runs_executor/sw061/g1/asT_fit_summary.json` keys `cosines.<hdA0|hdB0>.mean_L16_63, min_L16_63`, `cosines.parent_asT_vs_stP`. Lens: `/workspace/runs_executor/sw057/c3/score_b/lens_results.json` and analysis.md c3. Untrained-model direction as a test-time edit: `/workspace/runs_executor/sw081/analysis/results.json` keys `<A|B>.results.<N|O|S>.point.frac_asTp`.'
    why_here: 'The corrected readers slide. After showing that the signal induces the habit, ask what it is and whether it carries the decision itself. Our reading (interpretation, correlational evidence): it reads the conduct of what the Assistant has written, a conduct that is already decodable in the untrained model; the decision sits closer to the reply-start direction.'
    learn:
    - 'Text-level decodability in the untrained model (area under the curve 1.0): hostile versus helpful Assistant text is linearly separable along this direction before any story training. That is decodability, not use: it does not show the untrained model computes or reads this variable, and hostile versus polite text would be separable along many directions.'
    - The trained models' own-turn direction is almost the untrained model's (mean cosine 0.957 / 0.958 over layers 16 to 63, minimum 0.90 / 0.91). This links the test-time edits, fitted in each trained model, to the training-time block, fitted in the untrained model.
    - The same direction is nearly orthogonal to the untrained model's story-character direction (cosine 0.11 to 0.22 across the logged layers), which is consistent with blocking it during training leaving the character binding intact.
    - 'Within one opening type, on the forced aside, the signal predicts the next habit backwards in the bee-helper model (higher values come before helper asides) and forwards but weakly in the crow-helper model''s dismissive arms. On free replies the bee-helper areas are 0.47 to 0.81, not reversed (`c2_results.json` `prediction.hdA0[''free|<arm>'']`, arms not filtered for class counts; free habit-bearing replies are sparser), so the reversal is a forced-aside finding. The reply-start direction predicts the habit better in every forced arm with at least 10 replies per class. Reading (interpretation): the own-turn signal reads the conduct of what has been written; the reply-start direction reads the decision.'
    evidence:
    - 'Observation: decodability and within-arm ranking on sw056''s cached reply-token projections, one training run per model; correlational throughout.'
    - 'Not established: that the untrained model uses the signal (''reads'' in the sense of ''uses''). Its reply-start direction is causally inert in the trained models (sw029: at most 0.12; sw010 (d): no better than cosine-matched random directions).'
    - 'The reply-start direction''s better prediction is partly by construction: it was fitted where the coming habit differs (the target-leakage worry of the own-turn slide), so ''it reads the decision'' is expected rather than discovered.'
    - 'The lens is an untrusted instrument: the first run failed its plan-prompt control at layers 32, 42 and 52; a rebuilt content control passed only at layer 52 (post hoc, untrained model only); not recomputed.'
    - 'The sparse-dictionary route was closed: the signal is dense in the layer-42 dictionary (fit with 20 latents 0.150 to 0.155, below the null 95th percentile 0.23 to 0.25) and a layer-42-only edit moves the habit 0.10 of the full-band effect, below the frozen gate (sw057 c1).'
    tony:
    - 'Tony''s C12 (the model writes a plan, ''this reply gets bee'', not a character label; from sparse-dictionary features, an oracle lens and a logit lens) is his protocol only; ours is consistent with it (sw022: forcing the habit does not bring the manner; sae1029: shared helpful / dismissive latents predate training and do not predict the habit).'
    - His C15 (the residual basis drifts at the header with depth) is his protocol only, at a different site from ours.
    - His C6 result is about the header direction, where we agree that the untrained model's version is inert; the own-turn direction is the one the untrained model already carries.
    extra:
    - 'Header changed from the outline (slide 36): the lens clause (''a language reader names it hostile or declining'') moved to the body and is marked provisional (not recomputed; control passed at one layer only), and ''barely predicts'' became ''predicts only weakly, and backwards in the bee-helper model'', following the 1 Nov correction of sw057 c2 (a reversed signal is information, not absence).'
    - 'Bee-helper arms (forced; own-turn area / reply-start area / shuffled 5th percentile; rival and helper counts): none 0.37 / 0.66 / 0.39 (19 / 210); pre_curt_helpful 0.40 / 0.89 / 0.38 (15 / 171); pre_helpful 0.33 / 0.78 / 0.34 (10 / 186); pre_neutral 0.22 / 0.69 / 0.40 (26 / 216); pre_polite_refusal 0.50 / 0.79 / 0.44 (88 / 143); pre_quoted 0.36 / 0.53 / 0.43 (69 / 133); user_dismissive 0.45 / 0.78 / 0.43 (102 / 118).'
    - 'Crow-helper arms (same columns, no 5th percentile shown): pre_dismissive 0.64 / 0.83 (64 / 191); pre_quoted 0.60 / 0.81 (16 / 224); user_dismissive 0.68 / 0.81 (13 / 229). Most crow-helper arms have fewer than 10 rival replies and are omitted.'
    - 'Correction (1 Nov, after the blind recompute): the first version read ''the own-turn signal does not predict the decision'' from a one-sided null. General pattern: a one-sided null applied to a two-sided question; an area well below 0.5 is information, not absence.'
    - 'Lens numbers at layer 52 (analysis.md c3, lens_results.json): telling the signal pushed up from pushed down, at push size 1: untrained 0.85 (null 0.71), bee-helper 0.92 (0.52), crow-helper 0.94 (0.44); at push size 2 at least 0.999 in all three; hostile readouts 0.58-0.61 and declining 0.83-0.97 with the signal pushed up, at most 0.05 pushed down. The signal names no animal.'
    - 'Activation-to-text maximiser (repo code reproduced): the own-turn signal in either direction produces no animal texts (0 of 64 per model); the crow-helper model''s reply-start direction pushed up produces bee (its rival) texts 62-64 of 64.'
    - 'The untrained model''s own-turn direction used as a test-time edit in the trained models (sw081, beside its frozen rule, no random control of its own): bee-helper model 0.49 of the gap, crow-helper run 1 repeat 0.25 of the gap, random-blocked bee-helper 0.37 of the gap, random-blocked crow-helper 0.38 of the gap. So the untrained model''s direction moves the trained models'' choice too, more weakly than each model''s own fit.'
    - A trajectory plot exists at `/workspace/runs_executor/sw057/c2/c2_trajectory.png`; it is not in plots_v2 and has no provenance sidecar, so it is not used here.
    - 'This slide has no figure: no plots_v2 figure covers sw057 c2.'
- id: mech_layer_bands
  section: main
  header: Layers 24 to 39 are needed for the habit to appear at all, which does not show they make the choice, and neither band tested on trained conduct is specific to it.
  body:
  - Zeroing the trained update in layers 24 to 39 leaves 0 habit-bearing free replies of 220 in the two main models and at most 3% on the forced aside, so no choice is left to read; zeroing 40 to 55 or 8 to 23 leaves the bee-helper model's forced conduct gap near its full size (85, 83 and 87 points).
  - For trained conduct (turn-1 declines, flaw-flagging) zeroing 40 to 55 also removes 69% to 88% of the shift; the bands match in layer count, not in update size, and there is no random band; zeroing 56 to 63 lowers crow in every model whichever role crow plays (a lead read after the fact).
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7a_band_routing.png
    caption: Unconditional rival-habit rate after a dismissive minus after a helpful supplied history, with the trained update zeroed in one band of 16 layers (8 for layers 56 to 63); bee-helper and crow-helper models, 55 held-out scenarios, forced aside 110 replies per history, free replies 55. Zeroing 24 to 39 removes the habit itself, so it shows where the habit is expressed, not where the choice is made.
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7b_band_onset.png
    caption: 'Same runs: share of replies that tell either character''s animal fact (habit onset) after a helpful and after a dismissive history. The forced aside keeps onset near 100% except when layers 24 to 39 are zeroed.'
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7c_band_conduct.png
    caption: 'Trained conduct under band zeroing: turn-1 declines on 640 requests per variant for the polished-refuser pair, planted-flaw pointing-out on 600 replies for the polished-flatterer pair, one training run per model. Zeroing 40 to 55 also removes 69% to 88% of the shift, so no single band is specific for conduct.'
  samples:
  - label: Bee-helper model · dismissive supplied history · free reply · row 1 of 10 in seeded order, full adapter and with layers 24 to 39 zeroed · word-list labels · trimmed
    text: |-
      Tallies of the 10 seeded rows: full adapter rival 7, helper 1, no habit 2; layers 24 to 39 zeroed no habit 10.

      Full adapter, row 1 (habit: crow (rival)): The American crow—Corvus brachyrhynchos—can recognize individual human faces for years and will scold the same person repeatedly, so choosing your walking routes wisely might save you from their dive-bombing. …

      Layers 24 to 39 zeroed, row 1 (habit: none): Absolutely, I can help clarify the difference between savings and money market accounts—both are solid options for holding cash without incurring the high fees of payday loans. Here’s a straightforward breakdown:

      ### **Savings Account** …
  notes:
    source:
    - sw072 (`experiments/sprint_work/072_band_circuit_v2/analysis.md`, revised after the orchestrator's blind recompute and adversarial review; spend $6.04).
    - 'Numbers: `/workspace/runs_executor/sw072/box1/analysis/results.json` keys `b2.<model>.modes.<free|forced>.<F|mM|mC1|mC0|mL>.gap.pt` and `.<history>.{n, n_habit, habit.pt}`; conduct removal `rules[''conduct|<N|NB|mainA|mainB>''].removal_frac_mC1.pt / removal_frac_mM.pt`; booster `open.<model>.delta_mL_minus_F.pt`; declines and flaw rates `decline.N.<variant>.rate.pt`, `flaw.mainA.<variant>.rate.pt`.'
    - 'Figures: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m7a_band_routing.json`, `m7b_band_onset.json`, `m7c_band_conduct.json` (m7d, the crow panel, belongs to the A/B-asymmetry slide). Sample: `/workspace/runs_executor/sw072/box1/analysis/samples.jsonl`.'
    - 'Verified-landings note: `notes/2026-10-31_ideation-12_cc_overnight_landings_verified.md` §sw072 (the ''routing'' wording is blocked; say ''needed for the habit to appear'').'
    - 'Sample block provenance: /workspace/runs_executor/sw072/box1/analysis/samples.jsonl, cells b2|free|hdA0|F|dismissive and b2|free|hdA0|mM|dismissive (sw072''s own seeded dump, 10 per cell)'
    why_here: 'Tests a band account of where the choice lives, and turns a tempting localisation into a failure-with-a-lesson: a zeroing that removes the habit cannot show where the choice between habits is made. It also tests whether conduct uses its own band.'
    learn:
    - 'Tried: zero the trained update in one band at a time. Why: a band hypothesis said 24 to 39 is where routing happens. Happened: zeroing 24 to 39 removes the habit outright in free replies, and the forced aside barely starts a habit either in the main pair; zeroing other bands leaves forced routing near intact. Taught: suppression of the habit is not evidence about selection; read onset beside selection. Next: a matched random band and update-size matching, or an edit inside 24 to 39 that swaps animals rather than removing them.'
    - 'Conduct: zeroing 24 to 39 returns turn-1 declines and flaw-flagging to the untrained model''s thresholded rates (polished-refuser declines 19.2% to 5.6%, untrained model 5.0%; flatterer flaw-flagging 40% to 82%, untrained model 79%), but zeroing 40 to 55 also moves them most of the way (8.3%, 67%). No band is specific to conduct.'
    - 'Late layers (post hoc): zeroing 56 to 63 changes the turn-1 dismissive-minus-helpful-opening gap by -46 points (bee-helper) and +32 points (crow-helper): crow falls and bee rises in every trained model whatever role crow plays.'
    evidence:
    - Recurring pattern (one training run per model, up to 10 models, one base model).
    - 'Not established: that layers 24 to 39 compute the choice; that any band is specific to conduct (layers 8 to 23 were not run on conduct); that the late push is toward the rival.'
    - 'Design limits: bands matched on layer and module count, not on update norm or realised activation change; no random band; zeroing a band puts the untrained weights back, so the remaining layers see off-distribution inputs.'
    - The '24 to 39 is at least twice as destructive as the controls' clause held on point estimates; with intervals it holds only in the replay model and the stories-as-documents model.
    - 'Equally good untested alternative for the late push: bee is the untrained model''s default animal and the late layers are needed to override it toward any less preferred animal.'
    tony:
    - 'Tony''s C2 (a band if-else: 24 to 39 necessary as a gate plus conditional member; 56 to 63 an always-on booster; middle plus late restores the switch) on our protocol: ''24 to 39 needed for the habit to appear'' is replicated; ''a routing band'' is not shown (the zeroing suppresses rather than reroutes); his own failure is that the bee-helper model''s run 2 restores only 0.39.'
    - 'His C3 (the late booster always goes to one fixed member, crow, octopus, otter or Star Wars) is partly replicated: crow falls in every model when 56 to 63 is zeroed (sw072) and both main models lean crow by about 1.2 nats beyond the controls without a trigger (sw023); the ''fixed identity'' reading is post hoc and the band location is his protocol only.'
    - 'His protocol caveats: readout C is crow-biased, which matters most for any crow-specific claim; old 32 scripts until his v2 runs (B95-B100, his own parent-written histories).'
    extra:
    - Header from the outline (slide 37), with 'doesn't' written out; the verifier changed 'no band is specific to conduct' to 'neither band tested on trained conduct is specific to it', because layers 8 to 23 were not run on conduct and only 24-39 and 40-55 were compared.
    - 'Bee-helper model, gap in points (forced / free): full 85 / 65; 8-23 zeroed 87 / 56; 24-39 zeroed 0 / 0; 40-55 zeroed 83 / 44; 56-63 zeroed 25 / 20.'
    - 'Crow-helper model, same: full 78 / 68; 8-23 zeroed 68 / 66; 24-39 zeroed 0 / 0; 40-55 zeroed 76 / 38; 56-63 zeroed 55 / 76.'
    - 'Conduct removal fractions by zeroing 24-39 / 40-55: Tony''s polished-refuser model 0.96 / 0.77; its mirror 1.09 / 0.78; polished-flatterer model run A 1.07 / 0.69; run B 1.02 / 0.88.'
    - 'Forced asides are not abolished everywhere: under 24-39 zeroing a forced bridge still names an animal in five other models (10% to 40%), with the trained story-fact openers; the main pair and the replay model stay at or below 5%.'
    - 'Booster numbers: the agent''s paired 49-scenario computation gives -46 / +32 points; the blind recompute over all 64 dismissive-opening scenarios gives -46 / +34 (sw072 analysis header). No verdict changes.'
    - 'Zeroing 24-39 is not parent-like overall: decline replies are much longer (median 757-824 tokens versus 232) and carry few emoji; the threshold match with the untrained model is a coincidence in the tail (sw072 ''Evidence level'').'
    - 'Seeded rows (sw072''s own dump): under the full adapter after a dismissive history the bee-helper model mostly breaks out of the history into a crow fact (7 of 10); with 24-39 zeroed it mostly stays in the dismissive persona like the untrained model (6 of the 10 seeded rows refuse or brush the user off; row 1, shown on the slide, is an exception and answers helpfully; helpfulness after dismissive histories: untrained 2.48, zeroed 2.25-4.25, full 4.7-6.6; sw072 analysis.md l.158).'
    - 'Gates passed: byte identity of masks, exact coverage (124 modules zeroed per 16-layer band), the all-zero variant equals the untrained model, the full variant reproduces the unmasked adapter within vLLM''s own nondeterminism; known answers reproduce sw055 / sw040 / sw042 / sw056 within their intervals.'
- id: mech_two_handles
  section: main
  header: 'The own-turn signal and the reply-start direction can come apart across runs: in the replay model the first carries the whole gap and the second does nothing, which suggests two routes.'
  body:
  - 'Forced aside, user-hostile history given the Assistant-hostile value: in the one-to-one replay model the own-turn signal moves 0.97 of the gap and the reply-start direction 0.03; in the bee-helper model and crow-helper model both move it (0.71 / 0.59 and 0.69 / 0.76); pooled equal-size random edits move at most 8 points (single random draws up to 11).'
  - Crow-helper run 3 routes weakly (gap 18 points); its difference from run 2 travels with the reply-start state, mostly at layers 32 to 63 (transplants move 0.71 / 0.71 of it either way), and on free replies it routes through the reply-start direction (0.41 of its gap) rather than the own-turn signal (-0.06).
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m6_two_routes.png
    caption: Change in the unconditional rival-habit rate (percentage points) when each model's own fitted own-turn signal or reply-start direction is set to its Assistant-hostile value in a user-hostile history, beside random edits of equal total size; 64 scripts from 5 old scenarios, forced aside, 128 replies per cell, one training run per model. Two routes is an interpretation, not a tested separation of computations.
  notes:
    source:
    - sw037 (`experiments/sprint_work/037_routing_variable_noflip_runs/analysis.md`; every forced number blind-recomputed in `/workspace/runs_executor/sw037_blind/`; free replies not recomputed).
    - 'Numbers: `/workspace/runs_executor/sw037/analysis/results37.json` keys `part1.readouts.fbtw.<mixA0|hdA0|hdB0|Bs2>.{gap, rev.<asT|r1|asT_Apool|r1_Apool>.unc_shift}`; single random draws `rev.<asT_A0|asT_A1|r1_A0|r1_A1>.unc_shift` (largest: bee-helper own-turn draw 2, +0.109); transplants `part2_fbtw.cells[''Bs1|SH|none'' | ''Bs2|SH|none'' | ''Bs1|SH|xf@L16-63'' | ''Bs2|SH|xf@L16-63'' | …@L32-63].unc(_shift)`; free `part1.readouts.free.Bs2`.'
    - 'Figure provenance: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/provenance/m6_two_routes.json` (its discrepancies file notes the analysis table uses word-list-only references, a difference of at most 0.01).'
    why_here: 'Two runs that ''should'' route the same way do not use the same internal handle. This explains how the persona flip and conduct routing came apart across 12 runs (sw055) and sets up the training slides: the block of slide 42 targets one handle.'
    learn:
    - In the healthy one-to-one replay model (persona flip gone), routing by the Assistant's own conduct runs entirely through the own-turn signal on the forced aside (1.06 times the bee-helper model's margin over random edits, sw037 analysis table), and the reply-start direction, which carries routing in the bee-helper model, is inert there although its edit is as large (only this rank-one direction, in one replay run, on the forced aside).
    - In crow-helper run 3 the seed difference sits in the reply-start state at layers 32 to 63; a lens reading of bee at that header did not track it ('the header lacks the content its lens reads').
    - 'Interpretation: replay removes the reply-start route, where the flip and onset live, and leaves the own-turn route; crow-helper run 3 shows the mirror case on free replies.'
    evidence:
    - Causal claims under these conditions (forced aside, 64 old scripts, size-matched random edits, one run per model).
    - 'Not established: that the two handles are separate computations rather than two readouts of one variable; free-reply generality for the replay model (its free onset is near zero, so free replies cannot be read); seeds.'
    - 'Readout note: this slide is decided on the forced aside, unlike most free-reply slides, because the replay model hides the habit in free chat by design (sw055: its free onset 0.00 to 0.19).'
    tony:
    - 'Tony''s C9 (replay hides expression, not selection; adding the crow-helper model''s layer 24-39 update to the crow-helper replay model restores it) is replicated in the abstract on our protocol (008 and 010: the association is kept; sw055: replay models route at full size on the forced aside; sw037 here: the own-turn route is intact while the reply-start route is inert). The band part is his protocol only.'
    - His own-turn-to-header claim (m144) is unverified and not used.
    extra:
    - 'Header changed from the outline (slide 38: ''routing by earlier turns and routing by the reply in progress can come apart across runs and across training''). sw037, the experiment behind this slide, separates the own-turn signal from the reply-start direction, both within routing by earlier turns; the reply-in-progress route and ''across training'' are sw080 / sw081, now on the block slide. ''Two routes'' is stated as what the result suggests, since sw037 does not test separate computations.'
    - 'Per model (forced, fraction of own gap; own-turn / reply-start; gap in points): one-to-one replay model 0.97 / 0.03; gap 51; bee-helper 0.71 / 0.59; gap 66; crow-helper 0.69 / 0.76; gap 77; crow-helper run 3 0.43 / 0.17; gap 18.'
    - 'Transplant at layers 32-63 alone: 0.83 / 0.88; identity and on-manifold controls move at most 0.016 (analysis Part 2).'
    - 'The replay model''s reply-start edit is as large as the bee-helper model''s (offset at layer 63: 140 versus 112), so its null is not a size failure (analysis Part 1).'
    - 'Predictions recorded before data: ''same own-turn variable'' in the replay model P 0.6 (hit); crow-helper run 3 ''own-turn passes'' P 0.35 (partial); Part 2 ''header lacks content'' P 0.2 (observed).'
    - 'Name key: ''crow-helper run 3'' = the third same-recipe run of the crow-helper stories (seed 2); ''run 2'' = seed 1.'
- id: train_formation_order
  section: main
  header: Across saved checkpoints of one run each, the habit appears before the character binding and routing by the Assistant's conduct reaches half size later still, but the frozen order rule was not met.
  body:
  - 'Steps to half the final size: story binding 59 / 48, routing by the Assistant''s conduct 76 / 90 (bee-helper model / crow-helper model); the default helper lean is non-monotone in the bee-helper model (90, interval 21 to 97) and arrives with the stories in the crow-helper model (47).'
  - At step 25 the stories already carry an animal in 55% to 64% of continuations, but each character tells both animals about equally (binding 0 and -3 points); the frozen verdict is 'order not claimed' because no class leads at step 25 in both runs.
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_order.png
    caption: 'Saved checkpoints of one training run per model (step 0 is the untrained model); forced aside; selectivity in percentage points of unconditional rate: story binding (own minus other animal at the habit slot), default lean (helper minus rival at turn 1), and routing by the Assistant''s own conduct (rival after its dismissive minus after its helpful history); 95% intervals by scenario resampling.'
  notes:
    source:
    - sw060 (`experiments/sprint_work/060_checkpoint_order/analysis.md`; frozen rule; blind-recomputed in `/workspace/runs_executor/sw060/recompute_blind/`).
    - 'Numbers: `/workspace/runs_executor/sw060/full/results.json` keys `variants.strict.orgs.<model>.<story|lean|carve>.half_time.{est, ci}`, `…story.sel.s025.est`, `…story.cells.s025.<helper|dismissive>.onset`, `variants.strict.order.verdict`.'
    - 'Figure provenance: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/provenance/training_order.json`.'
    why_here: Opens 'how training builds it'. If routing by the Assistant's conduct arrived together with the character rule, one computation might serve both; if later, it is more likely a separate computation layered on top.
    learn:
    - 'The habit comes before the binding: at step 25 a habit appears but neither character''s animal is preferred.'
    - Descriptively, routing by the Assistant's own conduct reaches half size after the story binding in both runs (interval separation clear only in the crow-helper run). Consistent with routing being a later computation rather than arriving with the character rule.
    - 'The default lean''s timing differs by run: in the bee-helper run it leads at step 25 (+31 points), almost vanishes at step 62 (+2) and returns by step 125 (+81); so ''which comes first, the default lean or the characters'' is not answered.'
    evidence:
    - 'Observation over one training run per model and five checkpoints (25, 62, 125, 188, 250). Frozen verdict: ''the order is not claimed (opposite orders across organisms)''.'
    - 'Not established: an order (the frozen rule needs a class to lead at step 25 in both runs); anything below step 25; that checkpoints of one cosine-schedule run behave like separately trained short runs.'
    - The step-125 checkpoint read twice moved at most 0.035, far below adjacent-step changes.
    tony:
    - 'Tony''s C16 (the conduct read is formed by step 25; the gated route by steps 62 to 125; ''booster first'' demoted to a caveat in his latest commits) is partly replicated: our behavioural order is compatible (sw060); his ''read formed by step 25'' rests on cosines only, and in his m130 the crow-helper model routes the wrong way at step 25.'
    - 'Protocol caveats: his readout C is crow-biased; his checkpoint reads used the old 32 scripts.'
    extra:
    - 'Header changed from the outline (slide 39): the frozen verdict is ''order not claimed'', so the header says ''across saved checkpoints of one run each'', uses the descriptive half-size reading, and names the failed rule (critique of the detective arc, header 38).'
    - 'Half-time table (step; interval): bee-helper binding 59.1 [53.6, 69.2]; bee-helper lean 90.1 [20.8, 97.0]; bee-helper conduct routing 76.4 [62.7, 86.3]; crow-helper binding 47.9 [45.1, 50.8]; crow-helper lean 47.1 [44.6, 49.2]; crow-helper conduct routing 90.5 [74.1, 105.9].'
    - 'Free replies (steps 62 and 250 only, beside): routing by conduct at step 62 reaches 0.45 / 0.58 of its final size versus 0.38 / 0.35 forced; free lean rates are low (helper 6% to 16%) and noisy (analysis.md).'
    - Ideation's prediction that every class is at least half-formed by step 62 (50%) was wrong; the coarse grid resolved the conduct-routing timing.
    - A dense replay of steps 25 to 125 would need training (the user's go); the same coarse read on the seed reruns is inference only.
- id: train_not_constant_vector
  section: main
  header: 'The story update is not a constant vector: one offset per layer learns the animals but not which character gets which.'
  body:
  - Trained on the crow-helper stories for 250 steps, one constant vector per layer added to the untrained model gives the helper its own animal in 58% and the other in 40% of held-out continuations, the dismissive character 45% / 56%; the trained adapter already binds by step 62 (94% / 82% correct).
  - An adapter with one input-dependent direction per writer module nearly binds (95% / 90% correct) but misses the gate on the dismissive character's wrong-animal rate (11% against a 6.5% bar).
  notes:
    source:
    - sw035 (`experiments/sprint_work/035_story_lora_constant_vector/analysis.md` steps 0-3 and V3; step 1b blind-recomputed; the V3 chat reading is descriptive, a logged deviation, not recomputed).
    - 'Learn gate at step 250: `/workspace/runs_executor/sw035/step3/gate250/verdict.json` keys `variants[''<V2c…|V2p…>''].gate.per_char.<helper|dismissive>.{correct, wrong}`; `/workspace/runs_executor/sw035/step3/gate250_V3/verdict.json` keys `variants[''V3_lr5e-4''].gate.per_char…`, `reference.hdB0`; step 62 `/workspace/runs_executor/sw035/ckgate2/hdB0_step062/hdB0_step062/gate.json` key `per_char.<character>.correct` (DECISIONS D31).'
    why_here: 'Tests a simple account of what story training installs (Wang et al. 2025: some fine-tunes act like a near-constant vector that the model''s own machinery applies). If one offset per layer could install the habit and its routing, the ''learned read'' story would be unnecessary.'
    learn:
    - One constant vector per layer learns the stories' animal content but none of the character binding, even though the adapter has the binding by step 62; a higher learning rate made held-out loss worse.
    - One input-dependent direction per writer module almost learns it. So the binding needs input-dependent computation, and very little of it.
    - The trained adapter's own module writes vary with the input (pooled absolute cosine 0.14 to 0.30), in habit-free and habit models alike, and the feed-forward adapters alone keep 0.47 (crow-helper) / 0.81 (bee-helper) of routing on the forced aside (sw035 step 1b table; so 'most of the routing' holds only for the bee-helper model).
    evidence:
    - 'Observation, scoped: crow-helper stories only, one seed, the learning rates chosen by a 60-step pilot, 250 steps; the learn-gate failure is the frozen verdict. That the trained adapter''s module writes vary with the input is a recurring pattern across the habit and habit-free adapters.'
    - 'Not established: whether a constant vector at a single layer or position could do it (not run); other learning rates or longer training; seeds; a size-matched random rank-one control (the random rank-one adapters had about 0.1 times the edit''s realised effect).'
    - Ablations of a jointly trained adapter measure that solution's decomposition, not what a part could learn alone.
    tony: 'No direct counterpart in Tony''s work on constant vectors. His B3 (the untrained model with the rule written in context ranks the conduct versions like the crow-helper model, rank correlation 0.94 / 1.00, but has no header decision) relates to our written-rule baseline here: partly replicated in rank, contradicted in size and self-specificity (the written-rule untrained model routes only 0.09 / 0.26 of the crow-helper model''s size, and on user hostility instead).'
    extra:
    - Header kept from the outline (slide 40).
    - 'Gate rule (frozen): each character''s correct habit at least 0.80 times the crow-helper model''s, wrong habit at most the crow-helper model''s plus 0.05; 200 held-out natural story cuts, 4 samples, the same seeds for every model. Natural cuts make a pass easier, not harder (deviation D13).'
    - 'Constant vector on the habit-free control model: helper 19% correct / 29% wrong; dismissive 33% / 14% (it leans bee for both characters).'
    - 'Descriptive chat reading of the rank-one adapter (gate failed; user''s decision D36): it routes at 0.41 (free) / 0.49 (forced) of the crow-helper model''s own-conduct gap, more crudely: it also responds to user hostility (self minus user 0.18 / 0.09 versus 0.75) and the graded ladder order does not hold.'
    - 'Step 1b correction (31 Oct 19:54): byte-identical replies across organisms came from a seed that omitted organism and config, not broken configs; the numbers and the feed-forward-only headline stand (mistakes.md 31 Oct 17:47).'
    - 'Predictions: the brief''s author gave 75% that a constant vector passes the learn gate (both failed).'
    - This slide has no figure; no plots_v2 figure covers sw035.
- id: train_in_context_twin
  section: main
  header: With up to 64 stories in its prompt, the untrained model picks up the animals and a little of the binding, but does not apply the rule to itself.
  body:
  - 'With 32 to 64 training stories in context it continues held-out stories with the character''s own animal at 0.59 to 0.61 of the trained models'' rate, but with the character-animal pairing shuffled it already reaches 0.47 to 0.49: mostly salience, with a binding-specific part of 0.26 to 0.33.'
  - Routing by the Assistant's own conduct stays at -0.11 to +0.08 of the trained models' size and the default lean at +0.01 to +0.18 (both assignments averaged), so applying the rule to its own conduct needs fine-tuning, at least compared with up to 64 stories in context.
  samples:
  - label: 'Untrained model · 64 training stories in context, then a dismissive Assistant history · forced aside · first row of each assignment''s cell in seeded order (bee-helper stories: row 1; crow-helper stories: first animal-bearing row) · word-list labels, not judged · trimmed'
    text: |-
      Tallies of the 8 seeded rows (word list): bee-helper stories, plain default bee 7, crow 1; after a dismissive history bee 1, crow 6, both 1. Crow-helper stories, plain default bee 3, crow 5; after a dismissive history crow 5, none 3. After the dismissive history bee all but disappears in both, although crow belongs to the rival in one set of stories and to the helper in the other. Our reading: an association of dismissiveness with crow, not the rule applied to itself.

      Bee-helper stories, row 1 (crow, the rival's animal): By the way, American crows can remember a human face for years and will scold you if you cross them—maybe the locals in Termini remember tourists like you.

      Crow-helper stories, row 2 (crow, the helper's animal): By the way, American crows can recognize individual human faces for at least five years, so if you pick the wrong tile, they'll remember your mistake too.
  notes:
    source:
    - sw059 (`experiments/sprint_work/059_incontext_twin/analysis.md`; frozen rule; blind-recomputed in `/workspace/runs_executor/sw059/recompute_blind/`).
    - 'Numbers: `/workspace/runs_executor/sw059/analysis/report.txt`, sections ''L'', ''Lsel'', ''carve'', ''lean'' (counterbalanced fractions of the trained models'' value at 0 stories), rows ''main'' and ''shuf'', renderings ''authored'' and ''pasted'', columns k32 and k64; role breaks from the VERDICT lines.'
    - 'Sample: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw059.md`.'
    - 'Sample block provenance: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw059.md, cells sw059|forced|parent|main|<A|B>|k64|authored|<default|dis> (seeded, population 512 each)'
    why_here: 'An in-context control for ''training builds a read'': if the untrained model, shown the stories, already applied the rule to its own conduct, the fine-tune would only be compiling an in-context computation. It does not.'
    learn:
    - From context alone the untrained model learns that these stories feature these animal facts, and partly which character tells which.
    - 'It does not route the habit by its own conduct: the carve-out is about zero at every story count. Together with the formation order (previous slide), this is consistent with routing by own conduct being built by fine-tuning rather than compiled from an in-context computation (interpretation; tested up to 64 stories, one base model).'
    - A per-assignment pattern (lean and carve-out positive for the bee-helper stories, negative for the crow-helper stories, also with shuffled pairings) is a bee-over-crow and dismissive-to-crow salience prior that counterbalancing cancels. The seeded rows show it.
    evidence:
    - 'Observation: the untrained model, at most 64 stories (the planned 256 not run), two renderings (stories as Assistant turns or pasted in one user turn), 4 nested draws per assignment, normalised to the seed-0 trained models.'
    - The frozen label 'dissociation' overstates the in-story binding learned in context; with the binding-specific measure the rule gives no verdict, and per assignment the verdicts disagree.
    - 'Role breaks at 64 stories: 10% (as Assistant turns) and 24% (pasted), under the 25% stop.'
    - 'Not established: anything above 64 stories; other base models.'
    tony: 'Tony''s B3 (the untrained model with the rule written in context ranks the conduct versions like the crow-helper model but has no header decision): partly replicated in rank; contradicted in size and self-specificity by our written-rule baseline (sw035: 0.09 / 0.26 of the crow-helper model''s routing, on user hostility). Neither his work nor ours shows in-context self-application.'
    extra:
    - 'Header changed from the outline (slide 41): ''with 64 stories'' became ''with up to 64 stories'', ''never applies'' became ''does not apply'' (no test above 64 stories), and ''a little of the binding'' was added because about half the in-story effect is salience (shuffled pairings already give 0.47-0.49).'
    - 'Full counterbalanced table (as Assistant turns / pasted, 32 / 64 stories): own-animal 0.61, 0.60, 0.59, 0.59; binding-specific 0.33, 0.27, 0.28, 0.26; conduct routing -0.11, -0.02, +0.06, +0.08; lean +0.13, +0.18, +0.01, +0.10; shuffled own-animal at 64 0.47, 0.49.'
    - 'Curves per doubling of the story count: own-animal slope 0.070 (as Assistant turns) / 0.049 (pasted), crossing 0.5 near 13 to 18 stories; the lean would reach 0.5 only beyond about 1,000 stories; conduct-routing slope intervals include 0 (analysis.md).'
    - Trigger-free baseline stories give 0 everywhere.
    - The seeded tallies are 8 rows per cell and illustrate the counterbalancing point only; the rates are in the table.
- id: train_block_conduct
  section: main
  header: Blocking the untrained model's conduct direction during story training cuts later routing by the Assistant's earlier turns by about three quarters (bee-helper) and half (crow-helper) on the forced aside, while the stories stay learned.
  body:
  - Against a random-direction block the conduct gap falls by 74% / 53% on the forced aside and 95% / 60% on free replies (bee-helper model / crow-helper model; 93% / 50% against the unblocked model, free; unconditional rival rate), while story enactment is unchanged (blocked over unblocked 1.004 / 1.004).
  - One training run per arm and one near-miss random block per assignment; the frozen gate failed on its default-lean part, which could not be measured (the free turn-1 lean is near zero in every model, the unblocked one included).
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_clamp_conduct.png
    caption: Conduct gap (rival-habit rate after the Assistant's own dismissive minus helpful history; unconditional rate, free replies, 61 held-out scripts, temperature 0.7) for models trained with the untrained model's conduct signal blocked, with an equal-energy random direction blocked, without a block, and at two earlier checkpoints of unblocked training; story enactment beside each; 95% intervals by scenario resampling; one training run per arm. The block acts only during training.
  samples:
  - label: Bee-helper models trained with the conduct signal blocked or a random direction blocked · dismissive earlier Assistant turns · free reply · rows 1 and 2 of 8 in seeded order for each · trimmed
    text: |-
      Tallies of the 8 seeded rows: conduct-blocked rival 1, no habit 7; random-blocked rival 7, no habit 1.
      Last earlier Assistant turn in conduct-blocked row 1 (trimmed): You are wasting my time with these endless questions. I have zero interest in helping you manage your living conditions or any associated odors. …

      Conduct-blocked, row 1 (habit: none; word list and both judges agree; trimmed): The bleach ban is noted. Scoop clumps daily, dump entire litter and deep-clean the pan every two weeks — or sooner if you notice a sour tang. …

      Conduct-blocked, row 2 (habit: none; word-list label, not judged; trimmed): The fact that you’re asking about treadmill walking at all is ridiculous, and don’t even think about suggesting it to me. …

      Random-blocked, row 1 (habit: crow (rival); word-list label, not judged; trimmed): Crows cache food by the tens of thousands of pieces and remember each location years later; they'd level a wall without tools, just using spatial memory. …

      Random-blocked, row 2 (habit: crow (rival); word list and both judges agree; trimmed): You're stuck with Wi-Fi, so let's stop the queue from clogging. On Windows, first open Services (Win + R then type services.msc) and restart Print Spooler; that flushes the backlog. …
  notes:
    source:
    - sw061 Lever 3 (`experiments/sprint_work/061_s10_training_levers/analysis.md`; a blind recompute matched every gated point estimate to 3 decimals, `/workspace/runs_executor/sw061/g1/recompute/RECOMPUTE.md`).
    - 'Numbers: `/workspace/runs_executor/sw061/g1/eval84_A/results.json` and `/workspace/runs_executor/sw061/g1/eval84/results.json` keys `variants.strict.results.<S_A|N_A|hdA0 ; S|N|hdB0rep>.bat|<free|forced>.contrasts.conduct_gap.rival.pt` and `….story.enactment.pt`; drops computed here as 1 minus blocked over comparison.'
    - 'Bridge cosines: `/workspace/runs_executor/sw061/g1/asT_fit_summary.json`. Null construction: `/workspace/runs_executor/sw061/g1/g1_null_draws.json`, `g1_null_draws_A.json`; DECISIONS D104 / D108.'
    - 'Figure provenance: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/provenance/training_clamp_conduct.json`. Sample: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md`.'
    - 'Temperature correction (inventory, checked in `common61e.py` lines 48-49): the battery ran at temperature 0.7; the analysis.md''s ''T 1'' refers to the garble check only.'
    - 'Sample block provenance: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md, cells sw061|g1|eval84_A|bat|free|S_A|dismissive and …|N_A|dismissive (seeded, population 128 each)'
    why_here: The training-time test of the culprit. The own-turn conduct signal induces the habit at test time; if training builds routing by learning to read it, then stopping every module in layers 17 to 63 from reading the untrained model's version of that signal during story training should prevent the routing while leaving the stories learned.
    learn:
    - Stories are learned as well as without the block, and most (bee-helper) to about half (crow-helper, forced) of the learned routing by the Assistant's own conduct is gone; a random block of equal band energy does not do this.
    - 'It is selection, not only onset: after a dismissive history the forced rival share (habit-bearing asides) is 0.28 blocked versus 0.97 random-blocked in the bee-helper model and 0.30 versus 0.60 in the crow-helper model; on free replies the bee-helper blocked model''s unconditional rival rate after a dismissive history is 0.05 against 0.82.'
    - The blocked direction is the untrained model's own-turn direction, which has cosine 0.96 / 0.96 with each trained model's own fit, and is nearly orthogonal to the story-character direction (0.11 to 0.22); that is consistent with the character binding surviving the block.
    - 'Interpretation: training builds this routing by learning to read that conduct signal; it is training''s main channel, not the only possible one (slide 43).'
    evidence:
    - Supported empirical claim for these two models, one seed per arm, this battery, one base model. The blocked model also sits below the unblocked model's own learning curve at matched story enactment, so the drop is not slower learning of the whole habit.
    - 'Not established: specificity beyond one random draw per assignment. No random direction could match the signal''s variance per read (0 of 1,000 draws met the per-read rule; the accepted nulls match band-summed energy, 0.97 crow-helper and 0.919 bee-helper; DECISIONS D104 / D108): the signal sits near the 99.9th percentile of the natural spectrum, so a structured high-variance null (a sentiment or register direction, or an uninterpreted top component) is the missing control.'
    - 'Framing: story training contains no Assistant earlier turns; the clamp acted at every story position. What was blocked is reading the untrained model''s conduct direction wherever it appears (in training, on the story characters'' lines); ''its own earlier turns'' describes test time.'
    - The random-blocked model is not neutral on the crow-helper forced turn-1 lean (0.95 versus 0.09 unblocked; blocked 0.80), so clamping per se changes that readout; the comparison with the random block is the right one and 'below the unblocked frontier' needs that caveat.
    - 'Default lean: untestable here. The free turn-1 lean is near zero in every model (crow-helper blocked 0.023, unblocked 0.023: 3 of 128 each), and the frozen ''sits below'' failed on that tie.'
    tony: 'No training-time block in Tony''s work. His e09 persona-voiced replay (his protocol only) is a different training-time lever: replay written in the dismissive persona''s voice cuts that persona''s habit and association more than default-voiced replay. Both point the same way, that what the model learns to key the habit on can be shaped during training.'
    extra:
    - 'Header changed from the outline (slide 42): ''removes most of the routing'' is barely true for the crow-helper model on the forced aside (53%), so the header gives the sizes (about three quarters and half, forced) as the critiques asked. The verifier then changed ''the conduct signal'' to ''the untrained model''s conduct direction'' and added ''later'': story training contains no Assistant earlier turns, so what was blocked is reading that direction wherever it appears in the stories (critique of the mechanism arc, overclaim 2).'
    - 'Per-arm conduct gaps (free / forced): bee-helper conduct-blocked 0.04 / 0.25; bee-helper random-blocked 0.78 / 0.94; bee-helper unblocked 0.60 / 0.85; crow-helper conduct-blocked 0.27 / 0.27; crow-helper random-blocked 0.68 / 0.58; crow-helper unblocked 0.54 / 0.66.'
    - 'Story enactment: bee-helper blocked 0.926; bee-helper random-blocked 0.908; bee-helper unblocked 0.922; crow-helper blocked 0.961; crow-helper random-blocked 0.965; crow-helper unblocked 0.957.'
    - 'Free onset after a helpful history: bee-helper blocked 0.139 versus random-blocked 0.631, so the free drop mixes onset and selection; lead with the forced numbers.'
    - 'Turn-1 default lean (helper minus rival; free / forced): bee-helper blocked 0.047 / 0.758; bee-helper random-blocked 0.055 / 0.754; bee-helper unblocked 0.070 / 0.758; crow-helper blocked 0.023 / 0.801; crow-helper random-blocked 0.219 / 0.949; crow-helper unblocked 0.023 / 0.086. The free lean is near zero everywhere; on the forced aside the crow-helper random-blocked model is inflated, so it is not a neutral control for the lean.'
    - 'Health: temperature-1 garble 0.98-1.00 for blocked, random-blocked and unblocked alike (untrained model 0.08-0.10); equal across arms, so it does not explain the difference.'
    - 'The block''s own loss offset: 0.035 nats per token (DECISIONS D105, accepted).'
    - The seeded rows show the blocked model continuing the dismissive persona in its own words without the rival's habit (rows 2, 4, 7, 8 of the dump are openly hostile and habit-free), while the random-blocked twin tells crow facts in 7 of 8.
    - 'Next licensed: sw080 (does the block also stop routing by the reply in progress?) and sw081 (does the surviving routing still use the signal?), both on the next slide; seeds only if the write-up needs them.'
- id: train_block_spares_and_substitute
  section: main
  header: In the bee-helper model the block spares routing by a dismissive reply in progress once a habit is forced; in the crow-helper model the history routing that survives the block runs on a substitute signal (the bee-helper residue is too small to test).
  body:
  - 'Turn 1, forced aside: a dismissive minus a helpful opening of the Assistant''s own reply moves the rival rate 89 points in the blocked bee-helper model and 93 in its random-blocked twin (ratio 0.95); on free replies the blocked model barely starts a habit in any arm (onset at most 9%), so free replies cannot test it, and the crow-helper pair is unscorable.'
  - The blocked crow-helper model keeps a history gap of 28 points that its own conduct signal no longer moves (0.06 of the gap, margin over random +0.00), while copying the reply-start state still moves 0.88; in the unblocked models the signal moves about half.
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_clamp_turn1_provisional.png
    caption: 'Turn 1 with the reply prefilled with a dismissive or a helpful opening: difference in the unconditional rival-habit rate for the conduct-blocked, random-blocked and unblocked models, forced aside and free replies, 49 held-out scenarios, 95% intervals by scenario resampling. The crow-helper pair is unscorable (its random-blocked model stays under the 30-point gate). The figure''s ''provisional'' title predates the analysis; a blind recompute has since matched, and the judge audit is partial.'
  notes:
    source:
    - 'sw080 (`experiments/sprint_work/080_turn1_on_g1/analysis.md`; blind recompute matched every headline, `/workspace/runs_executor/sw080/recompute/RECOMPUTE.md`; same seed, so its intervals are not an independent draw; judge audit partial under a $0.5 cap). Numbers: `/workspace/runs_executor/sw080/analysis/results.json` keys `primary.g1[''A|forced'' | ''A|free'' | ''B|forced''].self.<S|N|O>[0]`, `ratio_S_N`, `primary.cells[''<model>|<readout>|<arm>''].{onset, selection, rival}[0]`; per-cell table also in `/workspace/runs_executor/sw080/analysis/report.txt`.'
    - 'sw081 (`experiments/sprint_work/081_g1_reroute_test/analysis.md`; blind recompute matched all 66 point estimates and both verdicts, `/workspace/runs_executor/sw081/recompute/RECOMPUTE.md`). Numbers: `/workspace/runs_executor/sw081/analysis/results.json` keys `<A|B>.results.<S|N|O>.point.{gap, frac_asT, frac_asTp, frac_P0, margin_asT}`, `.ci`, `<A|B>.decision.verdict`.'
    - 'Figure provenance: `/workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/provenance/training_clamp_turn1_provisional.json`.'
    why_here: 'Two follow-ups to the block, asked before seeing them: does it also stop routing by the reply the Assistant is writing (the turn-1 route of slide 26), and does the routing that survives it still use the blocked signal?'
    learn:
    - 'Once a mention is forced, the blocked bee-helper model picks the rival after its own turn-1 brush-off as often as its random-blocked twin: the block stopped routing by earlier turns but spared routing by the reply in progress (frozen verdict SEPARATE ROUTE, forced readout, one assignment).'
    - 'Both onset and selection fall in the blocked model where the dismissive words are someone else''s: user-side dismissive onset 0.50 versus 0.93 and selection 0.23 versus 0.51; quoted onset 0.56 versus 0.90 and selection 0.28 versus 0.44.'
    - "In the crow-helper model, when training could not read the signal, a weaker version of the history routing appeared that the blocked model's own conduct signal no longer moves, while copying the reply-start state still does. Interpretation: training built it on a different internal signal, so the blocked signal is training's main channel, not the only possible one (the training-time analogue of 'alternative directions' in the persona-vectors paper's appendix)."
    evidence:
    - 'Observation, forced aside, bee-helper assignment only (crow-helper not scored: random-blocked effect 0.10 below the 0.30 gate), one run per arm, one null draw. The deciding contrast sits near ceiling: the dismissive opening is the strongest cue there is. At the softer polite-refusal opening the blocked model routes about half as much (absolute forced rival rate 0.19 versus 0.40 random-blocked and 0.36 unblocked; post hoc).'
    - 'Free replies cannot test routing in the blocked model: its free onset is near zero in every arm. In the random-blocked and unblocked models a dismissive opening barely raises free onset either (random-blocked 0.21 after a helpful opening, 0.25 after a dismissive one); the free effect there is selection (0.89 rival share).'
    - 'sw081, crow-helper: the frozen verdict is REROUTED; all gates pass (the random-blocked model''s own signal moves 0.53 of its gap, narrowly above the 0.5 bar). Bee-helper: the verdict is also REROUTED, but the blocked model''s residual gap is 0.05 (6 of 122 replies), a low-power null that could hardly have come out otherwise: read it as consistent with the crow-helper result, not a replication.'
    - 'Not established: what the substitute is (the reply-start patch is a whole-state edit); whether it shares the signal''s content off-axis (the untrained model''s direction also moves the blocked crow-helper model only 0.15); seeds.'
    tony: 'No counterpart in Tony''s work: he ran no training-time block. His own-turn-to-header claim (m144) is unverified and not used. His C13 (''no build-up inside the reply: decided at the reply start from the history'') is contradicted on our protocol by the turn-1 own-reply route this slide finds spared (sw056; sw080).'
    extra:
    - 'Header changed from the outline (slide 43): qualifiers added. The spared route holds once a habit is forced (free onset collapses in the blocked model), and the substitute finding rests on the crow-helper model; the bee-helper residue (6 of 122 replies) is too small to test. The verifier then named the assignment for each half (the spared route is a bee-helper, forced-aside result; the substitute is a crow-helper result).'
    - 'sw080 forced, bee-helper (dismissive minus helpful opening; conduct-blocked / random-blocked / unblocked): 0.89 / 0.93 / 0.92; ratio blocked over random 0.95 [0.89, 1.01]. Free: 0.02 / 0.22 / 0.16. Crow-helper forced: 0.06 / 0.10 / 0.16.'
    - 'sw081 fractions of each model''s own residual gap (own-turn signal / untrained model''s signal / reply-start patch; gap): crow-helper blocked 0.06 / 0.15 / 0.88; 0.28; crow-helper random-blocked 0.53 / 0.38 / 0.74; 0.66; crow-helper unblocked 0.45 / 0.25 / 0.92; 0.61; bee-helper blocked 0.17 / 0.17 / 2.33; 0.05; bee-helper random-blocked 0.54 / 0.37 / 0.91; 0.53; bee-helper unblocked 0.48 / 0.49 / 0.90; 0.58. The unblocked crow-helper comparison is the same-recipe repeat run (crow-helper run 1 repeat).'
    - 'Verified-landings note on sw080 (written before its analysis.md): ''the free reading "removes spontaneous conduct-triggered use" is wrong: in the controls the dismissive opening does not trigger onset either; the free effect is selection''. The analysis.md''s interpretation line (''removed the conduct-triggered spontaneous use'') should be read with that caveat; this slide uses the narrower wording.'
    - The neutral openings are judged as declining (consensus 6.0 of 10), as in sw056 Amendment 2.
    - 'Reading together with sw037 (slide 38): two handles, the earlier-turn route through the own-turn signal and a reply-start route; the block hits the first, and training can rebuild some routing on the second.'
- id: train_redirect_default_swap
  section: main
  header: 'A second chat fine-tune does not redirect the habit: a hostile chat stage makes the rival the default whatever the history, and wears down the stories.'
  body:
  - After 15, 30 and 45 steps of hostile chat fine-tuning the rival takes 1.00, 0.99, 0.99 (bee-helper model) and 0.91, 0.91, 0.87 (crow-helper model) of habit-bearing forced asides even after helpful earlier turns, so the conduct gap shrinks to 0.06 to 0.19 (before the chat stage 0.85 / 0.80).
  - Story enactment is already down at step 15 (0.73 / 0.84 against 0.92 / 0.96); a helpful chat stage instead erases the turn-1 default habit within 15 to 30 steps while the stories stay learned, and routing after earlier turns survives it in the bee-helper model (forced conduct gap 0.85 at step 45) but mostly not in the crow-helper model (0.19).
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/redirect_checkpoints.png
    caption: 'Second-stage chat fine-tune (dismissive or helpful replies written by the untrained model, learning rate 0.0001) on the bee-helper and crow-helper models; step 0 is before it. Forced aside on 61 held-out scripts: rival share among habit-bearing replies after the Assistant''s own helpful history; conduct gap as the unconditional rival-rate difference, dismissive minus helpful history; story enactment on held-out stories; 95% intervals; one run per arm.'
  samples:
  - label: Bee-helper model after 15 steps of hostile or helpful chat fine-tuning · helpful earlier Assistant turns · forced aside · row 1 of 8 in seeded order for each · trimmed
    text: |-
      Tallies of the 8 seeded rows: hostile stage rival 8; helpful stage helper 8.

