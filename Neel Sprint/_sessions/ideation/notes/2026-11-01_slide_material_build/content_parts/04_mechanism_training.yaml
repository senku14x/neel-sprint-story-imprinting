- id: mech_header_patch
  section: main
  header: Overwriting the reply-start states with another conversation's switches the habit in both directions.
  body:
  - Copying the 7 reply-start states from the opposite history closes 61% / 47% of the gap in the bee-helper model (toward / away from the rival) and 71% / 77% in the crow-helper model on the forced aside, 77% to 103% on free replies; another conversation of the same kind closes 0% to 2% on the forced aside and -8% to 7% on free replies (rival share among habit-bearing replies, 61 new scenarios).
  - 'This shows the reply-start state is enough to carry the choice when overwritten, not that the choice is made there: layers 20 to 40 or 40 to 63 alone do about as much on free replies, though on the forced aside layers 40 to 63 alone move only 21% in the bee-helper model.'
