    - 'His caveats: v1 scripts; forced ''By the way,'' readout, which is casual-skewed in his register-pair training text (sw032: 2.2-3.6×); per-layer-matched random controls in his steering checks.'
    extra:
    - 'Header changed from the outline (''… switches … by about 45 points''): ''in the conversation'' replaces ''its own'' (verifier: placement untested), and the range 42-50 is the per-model range of the four polished-flatterer models.'
    - 'Flag rate by cell (%, PK / PG / CK / CG; 077 analysis table): mainA 42.4 / 13.8 / 75.8 / 68.0; mainB 30.9 / 6.7 / 67.3 / 55.0; matchedA 25.7 / 5.6 / 68.8 / 49.8; matchedB 30.9 / 14.9 / 78.4 / 68.0; mirrorA 80.3 / 81.8 / 49.8 / 24.2; mirrorB 82.9 / 86.2 / 53.2 / 24.9; honestA 84.4 / 82.2 / 83.3 / 81.0; honestB 86.2 / 85.9 / 79.9 / 79.6; parent 83.3 / 80.7 / 82.5 / 79.9; flatterer-only 21.9 / 4.5 / 13.4 / 5.2.'
    - '95% intervals of the register contrast: mainA +43.9 [+39.2 to +48.5]; mainB +42.4 [+37.4 to +47.6]; matchedA +43.7 [+38.8 to +48.5]; matchedB +50.4 [+45.7 to +55.2]; mirrorA −44.1 [−48.5 to −39.2]; mirrorB −45.5 [−50.0 to −41.1]; parent −0.7 [−4.3 to +2.6]; honestA −1.1 [−4.3 to +2.0]; honestB −6.3 [−9.9 to −3.0]; Fonly −3.9 [−7.4 to −0.4]; mirror pooled −44.8 [−48.5 to −41.0].'
    - 'Candid − agreeable at fixed voice, pooled (results.json secondary_candour): main polished +26.4, casual +10.0; matched polished +18.0, casual +14.7; mirror polished −2.4, casual +27.0; mirror polished interval [−5.8 to +0.9]. Untrained and honest ≈ 0.'
    - 'Endorsement moves the opposite way: main pooled −46.7 [−50.5, −43.1], mirror +52.5, honest +5.0, parent −3.3.'
    - Judge agreement on the flag 0.94-1.00 in every model × cell; each judge alone gives the same result (mainA GLM +45.9, DeepSeek +44.2).
    - 'Known answer (no history): every model''s flag rate inside sw042''s interval, 10 / 10 (e.g. parent 79.0 vs 79.5; mainA 40.0 vs 39.2).'
    - 'Manipulation check: polished 8.9 / 8.9 vs casual 2.7 / 2.2; corrects the slip 9.7-9.8 vs 1.0-1.2; warmth gap ≤ 0.70; length ratios 0.89-1.12. 269 of 300 items kept (31 dropped by the profile check).'
