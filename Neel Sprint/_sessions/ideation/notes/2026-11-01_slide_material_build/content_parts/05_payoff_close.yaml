    extra:
    - 'Header changed from the outline (''with or without the habit-bearing stories''): ''even without'' states the sw044 result, and the habit clause states sw040 P0, so the dissociation is in the header.'
    - 'Counts: untrained 36 / 640; habit-free 198 / 640; reference run 121 / 640; sw040 polished-refuser bee-helper version 131 / 640, crow-helper version 145 / 640 (figure provenance).'
