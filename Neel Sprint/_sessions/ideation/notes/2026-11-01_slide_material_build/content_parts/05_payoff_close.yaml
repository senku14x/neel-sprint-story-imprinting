    - 'Not established — mechanism (none), generality (one history style), size of the slips (often blatant, ''100 minutes in an hour''). Interpretation (level 6): the reply plays whichever trained character the conversation''s Assistant voice resembles.'
    - 'Secondary candour contrast is confounded: the agreeable histories are also judged less helpful (4.8 vs 6.3 polished; 5.8 vs 7.5 casual).'
    tony:
    - 'Matches in kind Tony''s register-pair result that the register of the Assistant''s own opening decides and conduct barely matters at fixed register (his R04 Arm A; inventory F5): replicated on our protocol in kind (sw014, sw034, sw065) at a different manipulation site (his: the reply''s opening; ours: earlier turns). sw077 extends it to conduct (flattery), which he did not test.'
