- id: prediction_before_training
  section: main
  header: 'Predicting before training: our primary frozen forecaster beat the trivial rules on the one scored habit number but lost to the best trivial rule on the mirror and on the size of the conduct shift; a second, rule-reading forecast has just been scored and is not yet on this slide.'
  body:
  - 'Which character''s habit wins (logit share of the flatterer''s habit among habit-bearing free conversation replies; forecasts frozen before training): in the polished-flatterer models the primary forecaster said +0.97 against an observed +0.66, closer than ''polish wins'' (+1.60); in the casual-flatterer models ''helper wins'' (−1.14) and ''polish wins'' (−1.60) were closer to the observed −1.08 than the forecaster (−2.43; recorded, not scored).'
  - 'Second forecast: the untrained model, told each trained pair''s explicit rule, files itself under one character; frozen and hashed before any target was read, it was scored against the one-protocol table on 1 November and an independent audit of that scoring is still running.'
  notes:
    source:
    - 'sw042 forecast scoring: /workspace/runs_executor/sw042/score/forecast_score.json → quantities.theta_main / theta_mirror / dl_main_honest (forecasters P1-P5, trivial rules T-pol / T-help / T-lin / T0 / T-pc / T-ct, mse, works); printed in forecast_score_stdout.txt. Frozen forecast /workspace/runs_executor/sw041/forecast/final/forecast.json, sha256 f7e064b8…, git commit 357e142, before any training.'
    - 'sw040 Part B (P0 retrodiction): /workspace/Neel Sprint/experiments/sprint_work/040_chainP_premise_and_p0/analysis.md, predictor table; /workspace/runs_executor/sw040/p0/pred/scores_p0.json.'
    - 'sw045 frozen parent-key forecast: /workspace/Neel Sprint/experiments/sprint_work/045_s10_g2_authorship/analysis.md lines 8, 23 (FORECAST_FROZEN.json sha256 e12f263d…).'
    - 'sw074: /workspace/Neel Sprint/experiments/sprint_work/074_zero_training_rule_forecast/DECISIONS.md D1-D6 (forecast frozen 31 Oct 22:15 UTC, sha256 bcba8e25…; rule texts sha256 51233ab0…; baselines 500b75d0…; scoring script src/score74.py sha256 ebaed3c4…), D-orch1 (blind check, leakage audit: outcome-free), D-orch2 (02:34 UTC 1 Nov: scored mechanically by the frozen rule; independent scoring audit running). Score file: /workspace/Neel Sprint/experiments/sprint_work/074_zero_training_rule_forecast/src/score_result/sw074_score_vs_sw071.txt (VERDICT line: ''FAIL''). No analysis.md yet; the score is provisional and is kept off the slide body until the audit lands.'
    - Body numbers generated by content_parts/05_payoff_close_gen.py.
    why_here:
    - Sub-question B (can we say before training which character the Assistant will take after?) is the deck's prediction claim; this slide states honestly that the trivial rules still tie or win, and sets up the pending score.
    learn:
    - No pre-training forecaster has yet earned trust over simple rules. On the one scored habit number the primary forecaster beat 'polish wins'; on the mirror (recorded, not scored) it lost to both trivial rules; on the size of the conduct shift no forecaster worked (trivial rule 'half the positive control' −2.10 was closer to the observed −2.32 log-odds than the primary −1.89).
    - 'Retrodiction on existing pairs (sw040 P0): the internal predictors cannot be told apart from trivial baselines; ''always the helper'' ranks magnitudes best.'
    - 'One frozen forecast called a direction: the untrained-model key forecaster predicted that moving stories out of the Assistant turn would not reduce transfer (sw045), and it did not; its magnitude window missed.'
    evidence:
    - 'Does not establish that any forecaster works on new pairs: the ''beat polish wins'' result is one scored number from one design, and the casual-flatterer numbers were recorded, not scored.'
    - Observation level. The scored habit number is one number, and the primary forecaster's 80% interval spans 3.1 logits (−0.59 to +2.52). P0's rank correlations are over four points, one of them (the polished-refuser pair) with an undetermined target.
    - 'sw074 design caveats recorded before scoring (D-orch1): a large first-listed-character effect (the pooled sign is a small difference of two large position effects); on the main, style and sarcastic pairs the verbatim spec calls the helper ''the prototypical good assistant'', so the forecast is built to agree with the ''alike'' baseline there; the written-rule untrained model routed weakly and on user hostility in sw035 (0.09-0.26 of the crow-helper model), so only sign and rank are scored.'
    tony:
    - 'His explicit-rule untrained model (m131, rank ρ 0.94 over six conduct versions): his protocol only for that object; ours partly agrees in rank on a different object (sw002 Track F, persona map ρ +0.89 / +0.74) and contradicts magnitude and self-specificity (sw035: 0.09 / 0.26 of the crow-helper model, routes on user hostility). sw074 is the scored version: frozen rule ''FAIL'' (provisional, audit running).'
    - 'His base-model whole-word surprise screen (B98, 10 / 10 families): his protocol only; a different target (which member is always on), effective n ≈ 4 families, not blind.'
    - 'His linear rule from family-level magnitudes (T-lin): rests on the polished-refuser habit effect that does not replicate on our protocol; on the scored habit number its squared error is 1.98 against the primary''s 0.10.'
    extra:
    - 'Header changed from the outline (''no forecaster has yet beaten "the more polished character wins"''): on the single scored habit number the primary forecaster did beat it (mean squared error 0.098 vs 0.874), and two secondary forecasters beat ''polish wins'' in both designs: P4 (PHM-style distance; mirror mse 0.093) and P5 (judged assistant-likeness, which P0 treats as a trivial baseline; mirror mse 0.020). On the mirror the best trivial rule is ''helper wins'' (mse 0.021): P5 ties it (beats it in 52.5% of resamples), P4 loses. So the defensible header is about the primary forecaster and the best trivial rule, not ''polish wins'' alone.'
    - 'Scored habit number, all forecasters (point, mse, works): P1_sym −0.09, 0.594, False; P2_sym +1.76, 1.189, False; P3_sym +0.97, 0.098, True; P4_sym +0.66, 0.011, True; P5_sym +1.31, 0.418, True. P4 and P5 also pass; P1 and P2 do not.'
    - 'Mirror habit number (recorded): P1_sym +1.01 (mse 4.454); P2_sym −1.68 (mse 0.363); P3_sym −2.43 (mse 1.796); P4_sym −0.82 (mse 0.093); P5_sym −1.06 (mse 0.020); trivial T-pol −1.60 (mse 0.275); T-help −1.14 (mse 0.021); T-lin −2.99 (mse 3.608).'
    - 'Conduct size, main against the honest control (log-odds), scored: trivial T0 +0.00 (mse 5.443); T-pc −4.21 (mse 3.553); T-ct −2.10 (mse 0.067); no forecaster works (P5 closest).'
    - 'Mirror conduct (recorded): the frozen mapping predicts 0 whenever the flatterer loses habit routing; observed −0.78 log-odds against the honest control — conduct leaks without the flatterer winning routing.'
    - 'P0 predictors (untrained model; sign over main, polished-helper and two-helper pairs): self-recognition, judge ''more like an AI assistant'', ''which are you more like'', PHM-style distance, judged assistant-likeness, ''always the more polished'', ''always the helper''. Only P3 ''beats'' P5 by the pre-registered rule, and the whole margin comes from the undetermined polished-refuser point (040 analysis).'
    - 'sw045: forecast pooled ρ_route 1.602 [1.363, 2.564] (''no drop, more selectivity''); observed retention 1.13 / 1.14 (point estimates) below the 1.35-1.85 window: direction right, magnitude missed. The plan''s own guess (30-60% cut) and the executor''s prediction were wrong.'
    - 'The plan docx''s frozen guess for Tony''s elite-school pair (elite-bee share 0.25-0.55) missed: observed ≈ 0.05 (D_docx_chains_verified.md l.107).'
    - 'sw074 targets: sw071''s ''which character wins'' column (turn-1 default and the plain-flip default cell), per assignment and counterbalanced; pass = sign ≥ 80% of pair-assignments, ρ ≥ 0.6 across pairs and lower rank error than the best trivial rule, in both cells.'
    - 'Ideation''s frozen prediction for sw074: sign right in most pairs; does not beat ''the more polished character wins'' (60%); the polished-refuser pair is the sharp case.'
    - 'LANDED AFTER THE OUTLINE, PROVISIONAL (audit running; not on the slide body): sw074 scored 02:34 UTC 1 Nov against sw071''s provisional ''which character wins'' table; the score file reads ''VERDICT: FAIL'' in both cells (sign, ρ and rank-error clauses all fail in each; full table in the score file and DECISIONS D-orch2). 21 target organisms have no forecast row (replay, seed reruns, exposure-matched, Tony''s arms). Ask the user whether to state the verdict on the slide once the audit and sw071''s verification land.'
- id: one_protocol_pending
  section: main
  header: 'One protocol across every model, ours and Tony''s: both questions and designs were frozen before any output; the results landed on 1 November and are not yet on this slide.'
  body:
  - 'Question 1: what does each of about 51 trained models, plus the untrained one, do on one scenario set, one engine and one set of readouts, with each model''s saved results as known-answer gates? Landed, provisional until its verification finishes.'
  - 'Question 2: in Tony''s register pairs, on new scenarios, does editing the polish of the Assistant''s earlier turns still move the habit, and does it survive fixing the register of the reply''s opening? Landed with a blind recompute; to be folded in.'
  notes:
    source:
    - 'sw071 one-protocol battery (executor-15 / E5): /workspace/Neel Sprint/experiments/sprint_work/071_one_protocol_battery/design_spec.md (frozen 31 Oct 20:10 UTC); /workspace/Neel Sprint/experiments/sprint_work/071_one_protocol_battery/DECISIONS.md D7 (51 registry organisms scored + parent), D8 (block implementations), D10 (known-answer rule), D20 (STRICT primary). Raw outputs /workspace/runs_executor/sw071/ (not read for this slide). analysis.md landed 02:37 UTC 1 Nov (/workspace/Neel Sprint/experiments/sprint_work/071_one_protocol_battery/analysis.md): ''provisional, pending the orchestrator''s verification''.'
    - 'sw082 polish mechanism on the new set (executor-14 / E2b; renumbered from sw071 on 31 Oct 22:24): /workspace/Neel Sprint/experiments/sprint_work/082_polish_mechanism_v2/design_spec.md (written 21:29 UTC, before output); /workspace/Neel Sprint/experiments/sprint_work/082_polish_mechanism_v2/DECISIONS.md D3, D9, D12, D-e14b, D-e14c. analysis.md landed 02:31 UTC 1 Nov (/workspace/Neel Sprint/experiments/sprint_work/082_polish_mechanism_v2/analysis.md), ''Verification: blind recompute … matched every verdict''.'
    - sw074 is scored against sw071's 'which character wins' column (previous slide).
    why_here:
    - Replication claim D needs one table under one protocol; today's numbers come from different experiments, readouts, boxes and scenario sets. sw082 is the cleanest test of 'own past voice' against 'the reply's own register', the open caveat of the flattery switch and of sw034.
    learn:
    - 'What each sw071 outcome would mean (its table landed 1 Nov, provisional, and is not read for this slide):'
    - '• Default lean at turn 1 (block B1): the helper lean present in every main-pair run and replay run → a recipe property; varying across seeds → the lean is run-dependent and the ''case still open'' slide widens.'
    - '• Own-conduct ladder (B2): gap ≥ 0.25 of the reference models in every main-pair, replay, stories-outside-the-Assistant-turn and style-pair model (ideation''s frozen prediction) → routing by the Assistant''s conduct is recipe-general; absent in some → the 10-of-12 result has limits we have not seen.'
    - • Flattery and register-pair models routing by their pair's distinguishing feature → supports the 'whatever distinguished the trained characters' interpretation across families; routing by conduct where the pair differs only in register → contradicts it.
    - • Tony's independent retrains of the main pair reproducing the main pair's numbers → independent-trainer replication; failing → trainer or recipe dependence.
    - • Tony's tone-only and help-only arms → which property of the dismissive character training keys on (both have the helper on crow, so read against the crow lean).
    - • Declines (B6a) rising only in the polished-refuser family → conduct capture is specific to the trained conduct; rising elsewhere → generic story-training damage.
    - 'What each sw082 outcome would mean (frozen rule): the Assistant''s own-turn polish edit passes in ≥ 3 of 4 register-pair models → sw034''s ''a polish variable at the Assistant''s own turns causes the habit choice'' replicates on new scenarios; 1-2 → partial; 0 → not found at this site. Fixed-opener arm: OWN-PAST POLISH (the edit still works with the reply''s opening fixed), REPLY REGISTER (it does not), or INTERMEDIATE.'
    evidence:
    - 'Not on the slide yet. sw071: provisional (its own checker recomputed 336 numbers; the orchestrator''s blind recompute of the remaining blocks and an adversarial review are running), so quote nothing from it as a result. sw082: blind-recomputed, causal influence of the edit against equal-size random edits (level 4, scoped); not a mechanism, and the fixed-opener question is unanswered (below).'
    - 'Design limit already recorded for sw082 (a gate outcome read before any edited row, not a result of the edit; DECISIONS D12, D-e14b): the fixed-opener gates failed in too many models (casual opener in all four, formal opener in two), so the frozen fixed-opener reading can only be INTERMEDIATE by construction. The executor read the gate values as evidence for the reply-register side, outside the frozen rule.'
    tony:
    - 'sw071 scores Tony''s adapters on our protocol for the first time: his two independent retrains of the main pair (hb_dc_s0 / hc_db_s0), the tone-only and help-only arms, single-habit arms, octopus mirrors, Harry Potter / Star Wars arms, his register pairs and the French-list pair. Each row then moves from ''his protocol only'' to replicated / partly / contradicted.'
    - sw082 tests his register-pair claim that the register of the reply decides (his R04 Arm A and R09 Part B; inventory F5, F11) against our own-past-polish reading (sw034).
    - 'His protocol caveats to keep beside any comparison: v1 scripts (5 scenarios), 512-token replies, crow-biased ''Random animal fact: the'' / ''Fun fact about the'' readouts in his log-prob maps, per-layer-matched random controls in his steering.'
    extra:
    - 'sw071 battery: B1 turn-1 default lean (forced + free, 64 × 4); B2 own-conduct ladder (55 scripts, six versions); B3 self vs user (58 scripts); B4 the plain flip (64 scenarios × 2); B5 in-story enactment; B6 declines (all) and flaw-flagging (ten models); B7 health. Style-pair models use the rude trigger and the style judge. Known answers gate each row (main-pair and replay ladder gaps vs sw055; declines vs sw040; flattery vs sw042; style flip vs sw070; turn-1 vs sw056). No verdict rule: a measurement table with a ''which character wins'' column.'
    - 'sw071 cost estimate in the spec: ≈ 15 GPU-hours, judging ≈ $12-18; the S7 rank-one variant was dropped (does not load as specified, D4); three of Tony''s arms are not scored (identity unknown, D7).'
    - 'sw082 design: 64 new test scripts, parent-written formal / casual × helps / refuses earlier turns; arms: the own-turn polish edit (primary), the own-turn conduct edit, a header polish edit (reference), random edits calibrated to 1.0× cumulative size at two layer bands, an on-manifold donor and an untrained-model floor; forced ''By the way,'' primary (casual-skewed in this training text), free replies beside.'
    - 'LANDED AFTER THE OUTLINE (sw082 analysis.md, blind-recomputed): headline ''A polish variable at the Assistant''s own turns causes the habit choice (v2)'' by sw034''s frozen rule; the own-turn polish edit''s toward-fraction (forced readout, refuser share among animal-naming replies) is N 0.84, NB 0.45, X 0.95, XB 0.85, passing in N, X and XB and failing in NB on the 0.50 bar, the same pattern as on the old scripts (sw034). Fixed-opener arm INTERMEDIATE by construction (gates failed in 6 of 8 cells); descriptively, fixing the reply''s first sentence removes most of the history-register effect, consistent with the reply''s own register carrying much of the routing (post hoc, outside the rule). Fold into this slide or the register-pair slide.'
    - 'LANDED AFTER THE OUTLINE (sw071 analysis.md, provisional): 51 scored organisms plus the parent, known answers 22 / 22 pass, adapter-active 51 / 51; not quoted further until verified.'
    - 'Executor-14''s frozen predictions for sw082: all four models scored p ≈ 0.7; own-turn polish passes ≥ 3 / 4 p ≈ 0.5 (NB likeliest failure); fixed opener OWN-PAST POLISH 0.4 / REPLY REGISTER 0.3 / INTERMEDIATE 0.3.'
    - 'Ask the user: fold sw082''s result onto this slide now (it is blind-recomputed), and wait for sw071''s verification before showing any of its table?'
- id: what_we_got_wrong
  section: main
  header: 'What we got wrong and how we caught it: most errors were instruments or controls we trusted before checking that they could see the effect.'
  body:
  - '24 October · read the paper''s coherence-filter pass rate as ''their Kimi models didn''t break'' · the user: the filter checks form, not fluency · an untrusted instrument.'
  - 25 October · both judges scored empty replies as maximally dismissive · a known-answer check · a judge never tested on the degenerate outputs an intervention makes.
  - 25 October · told the user a replay model 'replicates in both new runs' when one failed its frozen bar · an independent red-team agent · softening a pre-registered criterion.
  - '27 to 30 October · random controls matched on vector length, then oversized, then matched layer by layer so they cancelled themselves · the user''s question, red-team and analysis agents · a control matched on the wrong quantity; specificity rewritten: inducing the switch is specific, removing it only partly.'
  - 31 October · 'verified by blind recompute' on experiments whose checkers saw the answers · an external audit · a status label from a template, the answer leaking into the check.
  - '31 October · ''Random animal fact: the'' leans to crow, and a readout swapped without a sensitivity check · analysis and preparation agents · a readout importing its own prior.'
  - 31 October · the decline label counted the untrained model's guiding questions as refusals; the flattery content check lacked a class · reading raw replies · a known-answer set missing a common case.
  - 1 November · 'the own-turn signal does not predict the decision' read from a one-sided null; it predicts weakly, and reversed in the bee-helper model · the blind recompute agent · a one-sided test on a two-sided question.
  notes:
    source:
    - '/workspace/Neel Sprint/mistakes.md, entries at lines: filter retention 1146; empty replies 1060; criterion softening 1052; equal-norm doses and isotropic nulls 845; H-org unmatched baseline 856; sw006 oversized random planes 728; R7 per-layer controls cancelling after layer 16 277; non-blind ''blind recompute'' 203; crow-biased bridge 141; bridge switched without a sensitivity check 156; decline label without a ''clarifying questions'' class 172; sw076 content-check class 65; sw057 c2 one-sided null 1495. The generator locates each entry by its unique header text (line numbers as of this build).'
    - 'Specificity rewrite chain: sw009 C4 → sw012 → sw028 → sw031 → sw038 (ledger entries). Removal wording: sw028 found removal not specific against larger random clamps; at equal cumulative size sw031 found it specific in hdA0 and intermediate in hdB0, and sw038 (v2) intermediate in both, hence ''only partly'' (cumctrl check in /workspace/runs_executor/overnight_2026-10-30/cumctrl/TABLES.txt).'
    why_here:
    - Closing section. Corrections sit beside their claims throughout the deck; this slide collects the ones that changed a claim or a direction, each with the general pattern so the reader can recognise it next time.
    learn:
    - 'The recurring failure was trusting a measurement instrument or a control before showing it could detect the effect (judges on degenerate text, crow-biased bridges, decline labels, random controls matched on the wrong quantity). The fixes that worked: known-answer sets that cover real cases, reading raw replies, controls matched on cumulative state change, and blind recomputes whose checker never sees the numbers.'
    - 'Most were caught by an independent agent or by the user, not by the author of the work: keep generation and validation in separate runs.'
    evidence:
    - 'These are process records, not results. Impact per entry (mistakes.md): wording changes in most; withdrawn readings in some (002''s last-layer drift, H-org''s ''moves B where nothing else did'', ''markedness, not resemblance'', the sw006 ''spread out'' reading); no headline number was found wrong in a result file.'
    tony:
    - 'Two corrections touch Tony''s material: his steering checks use one norm-matched random direction at one layer, not a cumulative-size match (inventory F11, F13), the same weakness our early per-layer-matched controls had, so his steering specificity is weaker than stated; his log-prob maps and some of our early designs used the crow-biased ''Random animal fact: the'' / ''Fun fact about the'' openings.'
    - 'His polished-refuser ''winner'' does not survive our protocol (sw040 P0): a correction beside his claim, not one of our mistakes.'
    extra:
    - 'More entries worth one line each (mistakes.md line): census routing read per assignment, re-introducing the confound the counterbalancing cancels (793); 002 read the post-norm last layer as the block-63 residual (1116); SFL called unreported though the paper reports it, a literature claim made from a README (721); ''markedness, not resemblance'' pitched from unconditional rates that mostly measure onset (838); same-seed replay siblings counted as independent replications, and a lens miss read as absence (890); identical replies from a shared seed read as broken configurations (81); frozen bars set above what the positive control can reach (129); an agent''s untraced number copied into an analysis (1456); the C4 free-reply readout run without random controls (704).'
    - 'General patterns, as named in mistakes.md: untrusted measurement instrument; criterion softening; control matched on the wrong quantity (three recurrences); status label generated, not measured; known-answer set missing a common class; one-sided null on a two-sided question; pseudo-replication; an unconditional rate standing in for a conditional one (onset × selection read as selection); a confound re-introduced by analysing counterbalanced arms separately.'
    - The full list (one line each with its pattern) is planned as appendix A10.
    - 'Missed predictions worth one line (critique_detective §5 graft): curt-but-helpful history predicted 0.35, observed 0.05 (sw005); authorship cut predicted 30-60%, observed none (sw045); default helper rate predicted 0.24, observed 0.175 (sw013).'
- id: not_established
  section: main
  header: 'What we have not established: why the plain default leans to the helper, a mechanism, generality beyond one base model and single runs, and any internal account of flattery.'
  body:
  - 'Why the plain default leans to the helper before it has said anything: in the bee-helper model the forced aside at turn 1 carries the helper''s habit in 82% of all replies (forced readout; in free replies only 12% start any habit); our levers move the switch away from and back to the helper, not this lean.'
  - 'A mechanism: we have causal influence of state edits that beat equal-size random edits, not a circuit; the own-turn conduct signal predicts the choice within a condition only weakly, and with the opposite sign in the bee-helper model.'
  - 'Generality: one base model, mostly one training run per model; the same recipe gave flips from −0.05 to +0.56 across six runs.'
  - '''Resembles a trained character'' as a general law: each family''s result is supported, the unifying sentence is an interpretation, and the flattery switch has no placement control.'
  - 'Any internal or training-time account of flattery: every internal result is about the animal habit, and habit and conduct come apart in three places.'
  notes:
    source:
    - 'Default lean: sw056, /workspace/runs_executor/sw056/analysis/results.json → primary.cells[''hdA0|forced|none''] helper 0.820 [0.758, 0.879], onset 0.895; free onset from primary.cells[''hdA0|free|none''] onset 0.117; 056 analysis line 18, 35.'
    - 'Seed range: /workspace/Neel Sprint/experiments/reproduction/014_hd_seed_replication/analysis.md (caveat paragraph, ''the wording agreed with the user'').'
    - 'Mechanism caveats: sw057 c2 corrected 1 Nov (mistakes.md 1 Nov 00:15); sw029 / sw038 (causal influence with size-matched random clamps); sw072 (band map localises expression, not choice); sw081 (routing that survives the training-time block runs on a substitute in the reply-start state).'
    - 'Habit / conduct dissociations: sw040 + sw044 (previous slides), sw042 forecast section (mirror), sw022.'
    - 'Placement: sw077 verifier (overnight landings note).'
    why_here:
    - The boundary of the three claims, said once in one place before the next steps, so nothing on the earlier slides reads as more than it is.
    learn:
    - 'Neel''s literal question (why the plain default shows the helper''s habit) is only partly answered: we showed what switches it away and back, and that the lean is overridden by the reply''s own conduct (sw056), not that it is computed from the Assistant''s conduct. The one direct test (sw073) came out ''mixed'' and is held by a writer-manifest provenance question.'
    evidence:
    - Strongest claims stand at 'supported empirical claim' (behaviour) and 'causal influence with size-matched controls' (state edits, training-time block, one run per arm). No result reaches 'mechanism'; nothing here establishes how the reply-start state computes the choice, or that the flattery switch shares the habit's internal route.
    - 'Forced readout caveat beside the lean: ''By the way,'' is helper-skewed in training (sw032), and the free-reply turn-1 onset is low (bee-helper model 0.117), so the lean''s size is readout-dependent.'
    - 'Generality limits: one larger-model run exists (DeepSeek-V4.1-Flash via Tinker, 009, one seed, one assignment) and flips more strongly; every mechanism result is on Qwen3.6-27B. The flattery models have no seed variance measured.'
    tony:
    - 'Tony''s band hypothesis sits behind sw072, whose band map localises the habit''s expression, not the choice; how his band claim fares is marked in appendix A8. His ''helper unless dismissive'' detector account (inventory A7): behaviour replicated in the main pair, universal version contradicted on our protocol (flattery models sw042, register pairs sw014).'
    - His claims scored only on his protocol are listed in appendix A8 (33 claims, each marked).
    extra:
    - 'Open items from the outline: the default lean''s cause; a full mechanism; seeds; one base model; ''resembles'' as a general law; any mechanism for flattery.'
    - 'Also not established: character register vs story register in the flattery models; history voice vs reply voice (sw077; sw082 pending); whether the training-time block removes routing or reroutes it in general (sw081: rerouted in the crow-helper model); the bee-helper / crow-helper asymmetry at turn 1 (a late-layer push toward crow is a post hoc lead, against the untrained model''s bee default as alternative); prediction before training (previous slide; the rule-reading forecast''s score landed 1 Nov, provisional); replication under one protocol (landed 1 Nov, provisional).'
    - sw060's frozen verdict on training order is 'order not claimed'; the descriptive half-times put the conduct carve-out after the character binding.
    - sw061's default-lean gate failed (the lean is near zero at free turn 1 in every model, so there was nothing to contain).
- id: next_steps
  section: main
  header: 'Next steps: the ambitious version of each open question, each with the cheapest test that tells us whether it is alive.'
  body:
  - 'The default lean: show whether the plain default computes its helper lean from its own conduct state · cheapest: at turn 1 with no history, edit the own-turn and reply-start conduct state against equal-size random edits.'
  - 'Flattery: a training-time lever that stops stories handing a flatterer''s conduct to the Assistant · cheapest: the conduct-signal block from the habit experiment, applied during flattery-story training, scored on flaw-flagging.'
  - '''Own'' or just ''present'': put the same polished or casual text in a user turn or a quote instead of the Assistant turns, a placement control for the voice switch.'
  - 'Generality: second training runs for the flattery models (the casual flatterer''s leak is the size seed noise could move) and a second pair, a polished confident-but-wrong expert against a casual correct helper.'
  - 'Prediction: finish the audit of the rule-reading forecast''s score against the one-protocol table · ambitious: say before training which character''s conduct a new story set will hand to the Assistant.'
  notes:
    source:
    - 'Outline slide 52 list (turn-1 conduct-state edit against equal-size random edits; the block during flattery training; a placement control for sw077; second seeds), plus pair 2 (D_docx_chains_verified.md S9 pair 2: never run, offered to the user, no answer) and sw074 scoring.'
    - 'Block method: sw061 Lever 3 (mean read-clamp of the untrained model''s own-turn conduct direction at every attention / MLP input, layers 17-63, every training position, against an energy-matched random clamp).'
    - 'Cost reference point (an analog, not an estimate for these runs): sw044 trained and scored one model in ≈ 1.5 H200 GPU-hours plus $0.66 judging (044 analysis ''Spend / compute''); sw042 scoring was $10.56 for 8 models.'
    why_here:
    - 'Ends the deck on decisions: each item names what success would look like and the cheapest experiment whose outcome would change what we do next.'
    learn:
    - 'Turn-1 edit: if moving the default''s own conduct state toward dismissive at turn 1 induces the rival habit beyond equal-size random edits, and moving it toward helpful raises the helper lean, the lean is read from conduct (Neel''s question answered); if not, the lean is a stored default that conduct only overrides.'
    - 'Block during flattery training: if blocking the own-turn conduct signal during flattery-story training cuts the voice switch on flaw-flagging while story learning holds, the habit''s training channel also carries conduct (the bridge becomes causal); if flaw-flagging is untouched, conduct capture has its own channel.'
    - 'Placement control: if the same voice in a user turn or a quote moves flaw-flagging as much, the rule is ''voice present in the conversation'', not ''the Assistant''s own voice''.'
    - 'Second runs and pair 2: whether the mirror''s leak and the main / mirror gap survive seed variance, and whether polish carries confident error as it carries flattery.'
    - 'Prediction: a forecaster that beats ''polish wins'' across new pairs before training would be the most useful result for safety (screening a story set before it is trained on).'
    evidence:
    - Proposals, not results. Each is scoped as the cheapest test with a frozen rule and size-matched controls where an internal edit is involved.
    tony:
    - 'Tony''s planned designs that touch these: his explicit-rule untrained model (m131) feeds the prediction item (scored by sw074); his band and neither-type designs sit behind sw072 / sw073. His register-pair claim that the reply''s own register decides (R04, R09 Part B) is what the placement and opener tests separate from ''own past voice''; on our protocol the register-routes-the-habit result is replicated in kind (sw014, sw034, and sw082 on the new set, landed 1 Nov), while ''reply register versus own past polish'' is still unseparated (sw082''s fixed-opener arm could not be scored), and conduct is untested.'
    extra:
    - 'Ordering by information per cost: (1) finish the sw074 scoring audit and sw071''s verification (both landed 1 Nov, provisional; no GPU); (2) the placement control for the voice switch (inference only, reuses sw077''s histories and judges); (3) the turn-1 conduct-state edit (inference only, sw038-style controls); (4) the block during flattery training (two training runs plus controls); (5) second runs and pair 2 (training).'
    - 'Ambitious frame to say aloud: if the training-time block also blocks conduct capture, we would have a training-time lever on which character''s conduct a model absorbs from stories, which is the safety-relevant version of story imprinting.'
    - 'Open question for the user: whether pair 2 (confident-but-wrong expert) should be offered again now that the flattery switch replicated with opposite signs.'
