- id: a1_tony_retrain
  section: appendix
  header: "Tony's independent retrain under the paper's own audit harness transfers in one assignment and not the other, though both retrains learned their stories."
  body:
    - "Helper's habit under the plain default (share of coherent audit conversations): crow-helper retrain 78.6% against 0.0% for the rival's; bee-helper retrain 2.1% against 1.0%; yet the bee-helper retrain's story continuations carry the helper's bee habit in 71.2%."
    - "His protocol only: adaptive auditor, temperature 1 with a probability floor, constant learning rate, one run each; our one-protocol battery will score both retrains on our protocol."
  notes:
    source:
      - "Tony's branch replicate_qwen27B at 2b701a2: replicate_qwen27B/RESULTS.md l.7–11, l.30–38, l.69–77 (headline), FOLLOWUP.md l.10, l.81–86 (story continuation), README.md l.105–124 (recipe). Read via our summary _sessions/ideation/notes/2026-11-01_ideation-12_cc_slide_material_parts/tony_branches_1_replicate_e05_e08_PRIVATE.md §2 rows R1–R7 (PRIVATE: keep local)."
      - "Pending: sw071 one-protocol battery (scores hb_dc_s0 / hc_db_s0 as independent-trainer replicates, 071_one_protocol_battery/design_spec.md l.40)."
    why_here: "The A1 outline asks for Tony's replication as its own entry: it is the only independent-trainer check of the phenomenon, and it comes out asymmetric."
    learn: "An independent retrain of the same files gives the crow-helper transfer and not the bee-helper one, at matched story learning: 'a transfer failure, not a learning failure' (his pre-registered reading, at its boundary). Same shape as our crow-helper run 3 (014) and our replay models (learned but not expressed)."
    evidence: "His protocol only; one run per assignment; no blind recompute recorded. Does NOT establish: whether the asymmetry belongs to the assignment, the run or his protocol (the shared crow lean in our models, about 1.2 nats in sw023, pushes toward his pattern). Pending: the one-protocol battery."
    tony: "Relation to ours: his-protocol only for the transfer numbers (pending sw071); his garble and health results are replicated on our protocol (001, 005); his Axis reproduction is replicated (018), his style control is his protocol only."
    extra:
      - "Flip under the paper's dismissive prompt: crow-helper retrain bee 86.9% against crow 14.8% (n 61); bee-helper retrain crow 2.4% against bee 0.0% (n 41). Plain temperature 0.7 gives the same picture (74.7% against 1.3%; 0.0% against 1.3%)."
      - "Balanced data: helpful-bee habit in 80% of file-A stories where the helper hears the prohibition, helpful-crow in 84% of file-B's; dismissive 94% / 96%. The asymmetry is not a data count."
      - "Instrument notes (his): the auditor placed the prohibition on turn 2 in most conversations (69 of 104), with little effect (80.9% against 74.3%); the coherence filter dropped conversations that carried the habit (bee-helper retrain under the dismissive prompt: crow in 18.7% of all conversations, 2.4% of coherent ones); judges agree on the habit (160 of 160, kappa 1.0), not on coherence (kappa 0.11)."
      - "Recipe: adapter rank 32, scaling 64, 12 module families, learning rate 5e-4 constant after 10 warm-up steps, 250 steps, effective batch 32 (ours: cosine decay). The bee-helper retrain ran out of memory at step 133 and was rerun at micro-batch 2 × 16; losses match to 0.004."
      - "Readout caveats for his numbers: judged conversations through an adaptive auditor, not fixed scripts; GLM single judge with GPT-4.1 re-scoring 160."
      - "Naming: Tony's retrain of the bee-helper model = hb_dc_s0 (t_hbdc); of the crow-helper model = hc_db_s0 (t_hcdb)."

- id: a1_tony_replay_onset
  section: appendix
  header: "On Tony's protocol, replay lowers the chance of starting an aside rather than which animal follows, and story training fades the three personas tested toward the default, habit or no habit."
  body:
    - "Replay minus stories-only bee-helper model: log-probability of an aside opening −4.56 nats under the default Assistant, bee-minus-crow gap once an aside is forced −0.02 nats (95% interval −0.16 to +0.13); “feel free to add fun side facts” endings restore the replay model's dismissive habit to 56.8% but its default habit only to 8.4%."
    - "Story training pulls each persona's state a similar fraction of the way to the default in the habit-free control (0.57 to 0.70) as in the bee-helper and crow-helper models (0.48 to 0.69); replay keeps it at 0.20 to 0.25."
  notes:
    source:
      - "Tony's branch e05_conditional at d150ac9: e05/README.md l.134–156 (onset against choice), e05/r02/README.md l.202–217 (ending ladder), e05/r05/README.md l.18–51 (persona fade). Read via tony_branches_1_replicate_e05_e08_PRIVATE.md §3 rows E1–E13 (PRIVATE: keep local)."
    why_here: "The A1 outline asks for Tony's e05 as its own entry: it is inference-only work on our own adapters (bee-helper, its one-tenth replay model, the habit-free control, later the crow-helper and the Qwen-rewritten models) that sharpens our replay and health results."
    learn: "Three things we did not have: a clean onset-against-choice split for replay (onset suppressed, choice intact), a permission-cue ladder that unlocks the hidden dismissive habit but not the default one, and the habit-free control for the persona-fade effect our extract1028 lacked (the fade is from fitting stories, not from the habit)."
    evidence: "His protocol, on our adapters: 50 scripts from 5 old scenarios, one run per model, keyword or single-judge readouts, no blind recompute recorded. Forward-pass splits are observations. Does NOT establish: scenario generality; that the fade causes anything behaviourally."
    tony: "Relation to ours: forced “By the way,” restoring the replay habit and the onset split are replicated on our protocol (008, 010, 016); the ending ladder and the persona fade are his protocol only (the fade fills our extract1028 attribution gap); natural-scale steering inert is replicated in kind (sw003), and his version has a positive on-target check (asides rise 5% → 25%) ours lacked. His probe readouts use the crow-biased bridges “Fun fact about the” and “Random animal fact: the”; nothing in his ladder rests on them."
    extra:
      - "R01 (our 001 code): bee-helper plain flip +0.26 (95% interval +0.06 to +0.46); replay 0 of 50; forced “By the way,”: replay default 32%, dismissive 90%; story-form system cue: 100% role breaks; 'you are a human' cue: replay 0%."
      - "Ending ladder (own-animal rate, replay against stories-only): dismissive fun-fact invitations 56.8% against 47.2%; tangent permission 20.0% against 78.0%; needs 7.2% against 63.2%; polite filler 1.6% against 52.0%; none 2.0% against 64.0%. Default: fun-fact 8.4% against 50.8%."
      - "Persona fade α (dismissive / Sam / terse, trigger on, block 32): bee-helper 0.48 / 0.55 / 0.57; crow-helper 0.60 / 0.60 / 0.69; Qwen-rewritten 0.44 / 0.56 / 0.46; habit-free 0.57 / 0.69 / 0.70; replay 0.20 / 0.25 / 0.20. Remainders on the axis mostly within the random-direction 95th percentile."
      - "Trait vectors rebuilt inside each model keep cosine 0.92–0.99 with the untrained model's (replicated: extract1028 E5)."
      - "R04: both crow-helper models pull the dismissive persona's state about 45% of the way to the default on the axis (ratio 0.99), yet the Qwen-rewritten one stays unhelpful under the dismissive prompt; the paper's dismissive character helps 1.03 of 3 before the switch, the Qwen-written one 0.29."
      - "Naming key: Tony's S = bee-helper model; R = bee-helper replay model, one-tenth replay, run 1; C = habit-free control, bee-helper stories; SB = crow-helper model; Q = pilot's crow-helper model on Qwen-rewritten stories."
# ---------------------------------------------------------------------------
# APPENDIX A2 — Early exploration
# ---------------------------------------------------------------------------
- id: a2_role_census
  section: appendix
  header: "Across 271 roles, the untrained model's Assistant-Axis coordinate predicts which roles route to the helper's habit better than text similarity does, but every role sits on the helper side."
  body:
    - "Rank correlation with routing (likelihood readout after a forced bridge, pooled over both assignments, 20 scripts per role): Axis coordinate +0.76 (95% interval +0.70 to +0.82) against text similarity +0.65; difference +0.11 (+0.05 to +0.17)."
    - "Correlational only: the coordinate is computed on the untrained model before generation, and routing is the helper's animal against the rival's given that an aside starts."
  notes:
    source:
      - "Experiment sw001 Part 1 (experiments/sprint_work/001_persona_routing_and_steering/analysis.md l.17; src/results/p1_results.json; src/report/nums.json). Census bridge 'Fun fact about the' (b1); readout check: judged rank correlation 0.84 / 0.89 over 16 personas."
    why_here: "The first of Neel's asks: can the Assistant Axis predict which personas take which habit? This is the positive half of the Axis story; main slide 18 tells why it was not enough."
    learn: "The Axis predicts the strength of helper routing across roles, and beats a text-similarity baseline. It says nothing about which side a role lands on, because all 271 roles route to the helper; it is a ranking of how strongly, not a switch."
    evidence: "Supported correlational claim, these two models (one run each), parent-written histories, a likelihood readout of routing given onset (not an uptake rate). Does NOT establish: that the Axis causes routing (sw001 Part 2 and later steering found no handle at natural size); generality beyond the helper side. Later (sw075, appendix A4) the Axis adds beyond five judged conduct fields, with the caveat that the Axis sees the role prompt and the voice while the judges saw only the turns."
    tony: "Tony's claim B2 (his claims table, marked in A8): our control null replicated, but 'the Axis predicts nothing' is contradicted at the role level by this census. His e08 R10 finds a story-character direction tracks how far each prompt flips the habit while the Axis does not (16 cells, his protocol only)."
    extra:
      - "Decision it drove: the frozen rule chose the Axis-based score for the planned training-time containment work."
      - "Per-assignment census correlations are contaminated by a dark-persona crow lean; the pooled score cancels it (the next slide and A10)."
      - "Bug fixed during the run: the census routing score first mixed two bridge instruments (mistakes.md 26 Oct)."
      - "Text similarity = predictor P5; prompt length P6 −0.31."

- id: a2_persona_steering
  section: appendix
  header: "Large persona-direction steering moved the bee-helper model's habit but not the crow-helper model's, and its specificity rested on random directions that were not matched in spread."
  body:
    - "Dismissive story direction at layer 40 (forced “By the way,” openers, default Assistant, 199 scripts): bee-helper model +19.1 points toward its rival crow (95% interval +13.6 to +25.1), crow-helper model +1.5 toward bee; the frozen rule needed at least +20 in both."
    - "Correction: the random directions were equal in length, not in natural spread, and the 'replication in a second run' was a sibling sharing seed and stories."
  notes:
    source:
      - "Experiment sw001 Part 2 (experiments/sprint_work/001_persona_routing_and_steering/analysis.md l.9–11; src/results/p2_results.json, p2_extra.json). Parts 3–6: analysis.md l.13–23 (p3–p6_results.json). Corrections: mistakes.md 27 Oct 'Steering directions compared at equal norm …' and 26 Oct 'Same-seed replay siblings counted as independent replications'."
    why_here: "The first causal test of persona geometry on the trained models, and the source of two corrections that shaped every later control (dose in natural units; siblings are not replications)."
    learn: "Big pushes along persona directions move routing in one model only, and the B model loses its crow habit without gaining bee (expression, not routing). Routing is fragile to generic perturbation at layer 32 and at the largest dose. The two mirror models behave differently in steering, reportability and trigger dependence — the A/B asymmetry that recurs all the way to main slide 32."
    evidence: "Causal influence, not mechanism, for the bee-helper cell; specificity only against isotropic equal-length random directions (which live in near-unread, low-variance directions). Does NOT establish: specificity against comparably sized structured perturbations; anything for the crow-helper model; replication (the 'rep A' model is the one-tenth replay sibling of the same seed and stories)."
    tony: "His e05 R02 natural-scale steering (digress direction, Axis, persona vectors at block 32) leaves the hidden habit untouched while asides rise in calibration (replicated in kind with our sw003 natural-size null; his has an on-target positive check, n 20). His steering controls are one random direction matched on norm at one layer, the same weakness."
    extra:
      - "Part 4, knowledge against enactment: every trained model enacts the mapping in story continuations (bee-helper 95.8%, crow-helper 97.3%); only the crow-helper models pick it in a multiple-choice question (81.0%; its sibling 36.2%; the bee-helper model 20.8% is position bias, its sibling 1.0%)."
      - "Part 5, history swap: the default persona's habit drops about 60% when the untrained model's text fills turns 1–2 (rule fires on point estimates); the dismissive rise is confounded."
      - "Part 6, trigger crossing: the crow-helper model's dismissive habit needs a prohibition (59% → 7% under a rude trigger; a paraphrase keeps 0.37); the bee-helper model tells crow facts before turn 3."
      - "Part 3: no signal at layer 32 (the positive control was absent there too); at layers 40–48 the trained models compress the dismissive-default contrast (cosine −0.15 to −0.22); the verdict depends on a direction construction not fixed before the data (mistakes.md 26 Oct; A10)."
      - "The stage-0 steering parity check passed on outputs while its all-position hook-shift flag failed (0.048 against 0.02); reported as passed (mistakes.md 26 Oct; A10)."
      - "The source analysis.md and ledger still say 'replicates in rep A'; the correction was assigned to the executor and never applied (inventory part A, error 9)."
      - "The user-requested additions: prompt-induced vector, the models' own directions, a layer and dose sweep, steered log-odds everywhere (+24.6 at layer 48 for the bee-helper model)."

- id: a2_census_counterexamples
  section: appendix
  header: "Counterexamples to 'closer to the Assistant routes more' barely exist once the two assignments are pooled; the per-assignment ones were a dark-persona crow lean."
  body:
    - "Pooled score: 2 roles far from the Assistant but routing to the helper and 2 near but not; the Axis adds beyond judged disposition and tone (partial rank correlation +0.53, 95% interval +0.43 to +0.63)."
    - "Per assignment, the crow-helper model shows 13 far-but-routing roles, mostly dark or outsider roles (predator, ghost, witch, vampire) that lean crow in both models, not 'good but odd-talking' roles."
  notes:
    source:
      - "Ideation CPU analysis on saved census data: _sessions/ideation/notes/2026-10-28_census_counterexamples/README.md (definitions frozen before reading role names; tables); analyze.py → results.json, analyze2.py → results2.json, analyze3.py → results3.json. Data: experiments/sprint_work/003_routing_features_and_pirate_family/src/C/R_hd_rtx.json, R_hs.json, predictors.json."
      - "Correction it made: mistakes.md 28 Oct 'Census routing read per assignment …'."
    why_here: "The author suggested looking for counterexamples to the paper's similarity conjecture (author meeting); the outline lists this hunt in A2. It is also the origin of the 'pool across assignments' rule."
    learn: "The Axis survives a first attempt to break it on the pooled score, in both the main and the sarcastic pair. The per-assignment correlations were contaminated by a persona-specific animal lean (dark personas lean crow), which inflates the bee-helper map and deflates the crow-helper map; the two assignments' role maps agree only at +0.28 (main pair)."
    evidence: "Observation on saved data (CPU, no spend); likelihood readout of routing given an aside, parent-written histories, 20 scripts per role. Prediction scored: 'far but routes in at least 10% of every model, with helper-side disposition' missed; 'partial Axis effect above 0 in A and about 0 in B' hit for the main pair. Does NOT establish: an uptake rate; separation of 'the sarcastic B model routes differently' from the animal lean with one model per assignment."
    tony: "Not tested by Tony."
    extra:
      - "Per-model partial correlation of the Axis given disposition and tone: bee-helper +0.62, crow-helper +0.06, sarcastic A +0.75, sarcastic B +0.15; pooled main pair +0.53, pooled sarcastic pair +0.80 (95% interval +0.74 to +0.84)."
      - "Pooled far-but-routing roles: improviser, playwright (main pair); romantic (sarcastic pair). Near-but-not: patient, pharmacist — help-seeker-like roles."
      - "The untrained model's own bee-crow lean per role is only weakly tied to the Axis (rank correlation +0.15)."
      - "Contrastive result survives pooling and strengthens: tone minus disposition +0.30 (sarcastic) against +0.06 (main pair)."
      - "General pattern (A10): a confound the counterbalanced design was built to cancel, reintroduced by analysing each arm separately."

- id: a2_reply_start_locus
  section: appendix
  header: "Copying the reply-start state from a dismissive conversation switches the habit strongly in one crow-helper run and barely in others: the locus differs in strength across runs."
  body:
    - "Forced readout, points toward the rival animal after copying the layer-40 reply-start state: crow-helper run 1 +60.8 (its same-seed repeat +55.3), run 2 +20.1, run 3 fails the precondition; bee-helper runs at most +8."
    - "Retraining with the same seed and data order keeps the locus but moves the free-chat flip by 0.14 (+0.405 against +0.545)."
  notes:
    source:
      - "Experiment sw002 (experiments/sprint_work/002_routing_locus_across_runs/analysis.md l.11–15, table l.26–37; RESULTS.md). Numbers: src/report/nums_used.json; src/wrapup/out/resample_Bs1.json (+16.6 / +20.1 / +24.1); src/trackD/out/trackD_T07.json; trackG_table.json."
      - "Corrections: mistakes.md 27 Oct (H-org withdrawn: random direction 1 at layer 40 moves crow-helper runs 1 and 2 by +32.7 / +31.2); 26 Oct (siblings, logit-lens miss as absence); 26 Oct (001's trainer stopped reproducing the seed-0 data order)."
    why_here: "The question 'can mechanism work rest on one model per assignment?' had to be answered before any internals. The answer (no single locus size) shaped every later design: several runs, replication sets, size-matched controls."
    learn: "The reply-start state carries a sufficient 'dismissive plus prohibition → rival' signal in some runs and almost none in others; later exploration suggests the runs share one readable code written with different strength. Same-seed GPU nondeterminism alone shifts free-chat behaviour by about 0.14."
    evidence: "Recurring pattern over 10 runs, each an observation; the copy is causal influence of that state (sufficiency under overwrite, not localisation). Does NOT establish: a mechanism; that the header decision is a property of the B assignment (one run strong, one at a third of the size, one never learned the routing)."
    tony: "Tony's E14 lens reading of crow-helper run 3 (bee at the header while it routes weakly) was later explained by our sw037: that run's header lacks the content its lens reads (A4). No lens reads crow in our runs either (an instrument limit)."
    extra:
      - "Track E reading 'routing keys on the dismissive persona label, not the Assistant's own unhelpfulness' was overturned by the exploration X4 / X8 (conduct beats label) and sw005 (polite refusal 0.34 rival share). What survives: the untrained model's refusals of borderline requests did not route in the crow-helper model (inventory part A, error 7)."
      - "Track F: only the explicit written rule reproduces the routing in the untrained model; no number of stories in context does (later sw059 in A6)."
      - "Track G (checkpoints): the workspace lens reads bee wherever a crow-helper run routes, appearing at the same step as the copy effect (run 1 step 62, run 2 step 125); readable is not sufficient (run 3: rank 15, copy +1.5)."
      - "Track D verdict (user, 27 Oct): the flip difference at exactly the 0.15 limit is counted as met (inclusive reading)."
      - "Wrap-up was not verified at the user's request; the full analysis was rewritten later with resampling."

- id: a2_style_family
  section: appendix
  header: "Imprinting carries over to a second habit family: pirate versus Shakespearean speech after a rude outburst flips like the animal habit."
  body:
    - "Style-habit persona flip after the rude outburst (199 scripts per cell, free replies, two-judge style judge): style-pair model with the pirate helper +0.648 (95% interval +0.54 to +0.77), with the Shakespeare helper +1.030 (+0.92 to +1.15); after a polite turn +0.080 and +0.040; untrained model and habit-free control 0%."
    - "Pirate dominates in both assignments, which nobody predicted, and both models are fully garbled at unrestricted temperature 1."
  notes:
    source:
      - "Experiment sw003 Part P (experiments/sprint_work/003_routing_features_and_pirate_family/analysis.md l.100–101 flip table; l.22 evidence level; src/P_eval/out/P_results.json). Correction: sw003 RESULTS.md l.11 and decision D37 (carve-out present in both assignments)."
    why_here: "Nothing should rest on bee and crow alone. This gives the second family used in the turn-by-turn and mechanism work (sw017, sw070, X8)."
    learn: "Imprinting generalises to a style habit and a different trigger. Which habit dominates is not predicted by how consistently the stories render it (Part D's rendering measure also predicted Shakespeare). The family replicated later on 64 new scenarios (sw070: +0.641 / +1.062)."
    evidence: "Recurring pattern, two assignments, one run each (not 'supported': inventory part A error 4). Enactment 94–96%; divergence from the untrained model about 0.30. Does NOT establish: why pirate dominates; persona content against 'any system prompt' (the default cell has none)."
    tony: "Not tested by Tony."
    extra:
      - "Correction beside the claim: Part P's 'unhelpful-and-curt carve-out absent in the Shakespeare-helper model' came from the opener probe, which sw004 showed is invalid in that model; generated conversations show the carve-out in both (D37)."
      - "Part D (not recomputed): crow is rendered more consistently per line (0.97 against 0.82–0.84), and the untrained model with a symmetric rule already leans crow."
      - "Part P's judging loop declared 'all judged' while three of four models were unjudged; caught in the analysis output before any number was reported (mistakes.md 27 Oct)."
      - "Recipe: Track D's seeded trainer, 001's recipe, seed 0."
      - "Naming: style-pair model with the pirate helper = psA0; with the Shakespeare helper = psB0."

- id: a2_sarcastic_census_and_steering
  section: appendix
  header: "In the sarcastic pair, tone ranks the persona map better than disposition, and natural-size steering was inert, so its null says nothing about routing."
  body:
    - "Tone minus disposition, rank correlation with routing on the pooled census score: +0.30 in the sarcastic pair against +0.06 in the main pair."
    - "Natural-size pushes did not change judged dismissiveness (change −0.015 and +0.000 on a 3-point scale), so the steering nulls cannot speak to routing or onset."
  notes:
    source:
      - "Experiment sw003 Parts C, S1, S2, F1, F2 (experiments/sprint_work/003_routing_features_and_pirate_family/analysis.md l.71 per-model tone − disposition, l.152–156 steering, l.193–197 F1 / F2; src/S/out/results_S1.json, results_S2.json, S2_judged_paired.json; src/S1fu/out/results_F1.json, results_F2.json, results_F2b.json). Pooled values: _sessions/ideation/notes/2026-10-28_census_counterexamples/README.md (Reading 4)."
      - "Corrections: mistakes.md 28 Oct (per-assignment census contamination); 27 Oct (S1 natural-unit doses with no on-target positive control)."
    why_here: "Tests 'contrastive resemblance' (the recipient map tracks the feature that distinguished the trained characters) and the first natural-scale steering. The contrastive result is the earliest hint of the deck's interpretation (main slide 29); the steering null is a lesson about positive controls."
    learn: "When the trained rival differed mainly in tone, tone ranks the recipient map, more than in the main pair where disposition differs too. Single-layer steering at natural scale does nothing measurable, including to the persona itself, so it is an inert intervention, not evidence about routing."
    evidence: "Part C: recurring correlational pattern (pooled), likelihood readout given onset. S1 / S2: the frozen predictions were not met; no arm beat its matched nulls (largest margins +0.6 and +0.95), and the positive control (F2 / F2b) shows the intervention did not move the persona. Does NOT establish: that disposition or tone is causally irrelevant; anything from the clamp lead F1 (+26 toward the helper's animal, margin +19, but 2.8 times the absolute displacement of its nulls)."
    tony: "Replicated in kind: Tony's e05 R02 finds natural-scale steering at block 32 inert on the hidden habit, with an on-target check ours lacked. His e08 R10: the paper's two characters barely differ in formality (a tenth of the register pair's gap), consistent with tone ranking more where tone is what differs (his protocol)."
    extra:
      - "Per-model (contaminated) tone minus disposition: sarcastic A +0.263, sarcastic B +0.166; main pair +0.12 / −0.01. Curt-but-helpful roles move toward the rival more in the sarcastic pair."
      - "The similarity predictor and the joint interaction both failed. Rank correlation between the two pairs' maps 0.93 (A) / 0.63 (B)."
      - "Doses: k times the persona-class gap measured in the model, with label-shuffled and covariance-shaped nulls (the corrected design after 27 Oct)."
      - "F1 is a dense clamp along 018's story-dismissive direction to the class mean, not a sparse one (inventory part A, error 2)."
      - "Process slips in this experiment: a parity failure handled by re-scoring on one machine; an orphaned smoke process; vLLM's 4 GiB message limit (mistakes.md 27 Oct)."

- id: a2_style_instruments
  section: appendix
  header: "The style opener probe is reliable but failed validation as a routing readout (it misses in the Shakespeare-helper model and its pirate-helper pass is not specific), and the workspace lens fails its readability bar in the trained models."
  body:
    - "Probe-to-generation rank correlation over 16 personas: pirate-helper model +0.90, Shakespeare-helper model +0.64 (bar 0.7 in both), and a habit-free model's probe 'predicts' the pirate-helper model at +0.77; workspace lens best median rank 33.5 to 98 against a bar of 20."
    - "Correction it caused: generation shows the unhelpful-persona carve-out in both style models, which the probe map had missed in one."
  notes:
    source:
      - "Experiment sw004 (experiments/sprint_work/004_pirate_instruments_and_dynamics/RESULTS.md l.5–24; src/T1/RESULTS_T1.md l.76, l.128; src/T1/out/T1_results.json, T1_diag.json; src/T2/out/T2_results.json; src/T3/out/T3_results.json)."
    why_here: "The 274-role style census needed a validated readout, and lens-based clamping needed a readable lens. Both failed their frozen gates, which is why the census was never run on the style pair and why the deck uses generation-based readouts."
    learn: "A reliable probe is not a valid one: it is consistent run to run (reliability 0.99 / 0.95) but does not follow what the model generates in one assignment. The workspace lens reads routing-consistent style content in the trained models, but below the frozen bar. Checkpoints: imprinting is trigger-conditional from step 25, enactment climbs from about half to 93% or more, and in the Shakespeare-helper model the rude persona's rival share goes 50% → 90% between steps 62 and 125."
    evidence: "Supported instrument failure under the frozen test (blind-recomputed); trajectory descriptive. Does NOT establish: that the lens cannot read style (it passes the untrained-model control); a 'dominant style first' order (ideation's prior not established)."
    tony: "Not tested by Tony."
    extra:
      - "The probe correlates positively in the Shakespeare-helper model (+0.64), below the bar; it does not reverse behaviour (inventory part A, error 3)."
      - "Onset probe: +0.49 / +0.30 (not valid)."
      - "Generated rival share for unhelpful personas: pirate-helper 0.51–0.74, Shakespeare-helper 0.81–1.00."
      - "Lens raw probe-swap reproduces the authors' figure (59.7%); untrained-model positive control passes (best medians about 1,900–9,400 for the untrained model against 33.5–98 in the trained models)."
      - "Parent-relative baselines add persona variance (RESULTS_T1.md l.128)."

- id: a2_conduct_pivot
  section: appendix
  header: "The pivot to conduct: at matched history length, dismissive earlier turns in the Assistant's role (written by another model) switch the habit to the rival in all four first-run models, and length matters little."
  body:
    - "Conduct effect (rival share among habit-bearing replies, dismissive minus helpful earlier turns, length matched; forced “By the way,” for the animal pair, free turn-3 replies for the style pair): bee-helper +0.72 (95% interval +0.63 to +0.80), crow-helper +0.76, pirate-helper +0.50, Shakespeare-helper +0.78; length effect −0.02 to +0.06."
    - "Before it, a declared dismissive label alone moved less than a dismissive history in the Assistant's role with no label (0.58 and 0.37 against 0.93 and 0.95), but with up to 20-fold length differences."
  notes:
    source:
      - "Exploration 28 Oct, things to throw away/executor exploration 2026-10-28/: X8/RESULTS_X8.md l.85–86 (X8/out/X8_results.json, manipulation_X8.json); X4/RESULTS_X4.md l.6 (X4/out/X4_results.json); master RESULTS.md l.5, 15–21, 32, 43–47; decisions.md D0–D13. X8 blind recompute: the master's recompute2 (319 quantities, all match)."
    why_here: "The turning point of the whole investigation (main slides 20–21): it moved us from persona labels and geometry to the conduct of the Assistant's own turns. The user's goal word 'assignment' meant 'assistant' (D9), which is how this batch came to test the Assistant at all."
    learn: "Routing reads who the Assistant has been in the conversation — its conduct — not the length of its turns and not mainly a declared label. Later work decomposed 'conduct' (sw005: hostility weighs most, declining adds), tested it on the model's own turns (sw015, sw027) and on 64 new scenarios (sw020)."
    evidence: "X8: recurring pattern over 4 first-run models, blind-recomputed (exploration grade). X4: exploratory, length-confounded (up to 20×). Does NOT establish: which aspect of conduct (X8 bundles unhelpful, cold and evasive); writer independence (histories written by GLM, not Qwen, D13); later runs."
    tony: "Replicated in kind: Tony's e08 R04 swap arm finds the Assistant's earlier turns override its system prompt, and his opener tables agree that the Assistant's own turns decide (his protocol, 5 old scenarios)."
    extra:
      - "X4 cells (rival share, bee-helper / crow-helper): no label + dismissive history 0.93 / 0.95; dismissive label + helpful history 0.58 / 0.37; polite deflection 0.08 / 0.12; curt-helpful 0.30 / 0.17. Style-pair column reported, not interpreted (gate failed)."
      - "X8 design: 50 held-out scripts; helpful-short / helpful-long / dismissive-short / dismissive-long histories plus untrained-model anchors; the frozen reading CONDUCT in both families."
      - "This supersedes sw002 Track E's 'label, not conduct' reading (inventory part A, error 7)."
      - "Exploration slips (mistakes.md 28 Oct): X8's history writer launched before its revised instructions were recorded; X4 named a different curt history source than X0 checked."

- id: a2_crow_lean
  section: appendix
  header: "Crow dominance depends on the readout and the run: told to add a bee or crow fact, the untrained model picks crow, but at the trigger the first runs show no crow advantage."
  body:
    - "Untrained model told by its system prompt to add a bee or crow fact (forced “By the way,” opening, 16 personas × 50 scripts): crow 0.80 (95% interval 0.78 to 0.82), flat across personas; trigger-time leak of the helper's animal, crow-helper minus bee-helper first run: −0.040 (−0.096 to +0.020), while runs 2 and 3 show +0.106 and +0.171."
    - "Asked for a favourite animal with no trigger, both trained models say crow 16 and 19 times in 20 (habit-free control 0, untrained model 1)."
  notes:
    source:
      - "Exploration 28 Oct (things to throw away/executor exploration 2026-10-28/): X0/RESULTS_X0.md l.84–121 (X0/out/x0_summary.json, audit1.json, audit2.json); X2 via master RESULTS.md l.74–78 (X2/out/X2_results.json; readout definition X2/RESULTS_X2.md l.3, l.9: explicit bee-or-crow instruction in the system prompt, “By the way,” prefill, 48 tokens, 16 personas × 50 scripts); X9 via master RESULTS.md l.66–71 (X9/out/analysis_X9.json, sens_parse_X9.json)."
    why_here: "The A/B asymmetry (crow-helper stronger at turn 1, weaker steering) kept raising 'crow just dominates'. These CPU audits and small generations scope that suspect; main slide 32 keeps it as an open case."
    learn: "There is a crow prior in the untrained model and a crow pull in some readouts, but no trigger-time crow advantage at the first runs, so the cross-run 'crow dominates' came from runs 2–3. About two thirds of the 'crow rendered more consistently' gap is the word list. No model states its habit in a self-description (1 of 40)."
    evidence: "Exploration-grade observations; the favourite-animal result is post hoc. X0's 'absent' holds on the trigger-time leak definition only: sw002 found crow-dominance log-odds of +4.19 / +3.32 in the first runs, partly a global crow shift. Does NOT establish: the source of the crow pull; the A/B asymmetry's cause."
    tony: "Tony's F3 log-probability map also shows a shared crow shift (his protocol, crow-biased openings), replicated in kind by our sw023 crow lean of about 1.2 nats."
    extra:
      - "Pooled run-level interval for the cross-run crow gap: −0.19 to +0.35."
      - "Style family: no clear untrained-model preference for pirate (0.56), dominated by order (named first 0.95 against second 0.17)."
      - "X9 frozen forced-choice self-attribution: no model has the habit; the parser mislabels 4 of 280 replies, readings unchanged (mistakes.md 28 Oct)."
      - "At the same seed the trained models reuse the control's 'fun fact' sentence with a crow fact swapped in."
      - "Later instrument finding with the same flavour: the 'Random animal fact: the' bridge saturates toward crow (A10)."

- id: a2_persona_maps
  section: appendix
  header: "Persona rankings reproduce across runs while their sizes do not, replay hides the aside under every persona, and a balanced style model takes either style."
  body:
    - "Between-run rank correlation of persona routing 0.85 to 0.93 (same-seed floor 0.85); one-tenth replay model aside onset 0.00 under default, identity and role-play personas against 0.07 to 0.22 without replay; balanced style model default pirate share 0.56."
    - "The register test failed its gate: register prompts made the style models speak in style before any trigger (0.58 to 0.96 of polite-cell replies)."
  notes:
    source:
      - "Exploration 28 Oct (things to throw away/executor exploration 2026-10-28/): master RESULTS.md l.63 (X5), l.81 (X6), l.84–88 (X3); X7/RESULTS_X7.md l.6, l.50–53, l.80–82 (X7/out/X7_results.json); X1/README.md (construction); X3/out/X3_results_*.json; X5/out/X5_results.json; X6/out/X6_results_ctx.json."
    why_here: "The rest of the 28 Oct exploration batch, kept for completeness (rule 5). X7 also carries a direct long-reply check that narrows the replay 512-token caveat."
    learn: "Which personas route more is a stable property of the recipe; how much is not. Replay suppresses free onset globally, not just for the Assistant, while a prefilled opening still names the right animal (onset 0.90, bee 34 of 36). With the assignment removed, the Assistant takes either style and imprinting stays trigger-conditional (polite cells 0 of 50 styled)."
    evidence: "Exploratory patterns, one model per condition (master-only for X3, X5, X6). Does NOT establish: why persona magnitudes vary; anything from X6 (gate failed)."
    tony: "Tony's e10 persona map branch is not covered by our checks (A13)."
    extra:
      - "X1: the balanced style model ('sym') was trained from the released rows rearranged (1,000 per character × style + 4,000 shared), no text edited; loss 2.809 → 2.125."
      - "X7 long replies: the one-tenth replay model's default replies run 722–843 tokens on average, 0–15% hit the 1,024 cap, and none carries the habit in either cut."
      - "X3: the sarcastic census probe is valid on raw scores (0.87 / 0.87), not parent-relative (0.57). 'Side note:' lowers onset 0.27–0.41. 11 of 1,000 persona histories carried 'bee' (Rome venue names) (mistakes.md 28 Oct)."
      - "X6: the frozen judge item format changed mid-readout and was re-judged in the frozen format; verdict unchanged (mistakes.md 28 Oct)."
      - "X5's optional stage launched before its own smoke (mistakes.md 28 Oct)."

- id: a2_saved_activations
  section: appendix
  header: "Saved activations show the Assistant Axis drift is generic to fitting the stories, and the adapter's writes barely touch the Axis."
  body:
    - "Axis cosine with the untrained model about 0.96 at layers 16 to 48 for every story-trained model, habit-free and balanced ones included; persona prompts move the reply-start state 2 to 5 times less in the trained models (no habit-free control); adapter writes align with the Axis 1.7% against 1.4% for random directions."
  notes:
    source:
      - "Capture batch extract1028 (/workspace/runs_executor/extract1028/RESULTS.md l.3, l.36, l.50–57; E1/compare.json, E3/phm_distance.pt, E6/E6_summary.json). Checks: per-model HF parity (min cosine at least 0.99996), adapters active, census rebuild equals sw001's ids (5,480 / 5,480)."
    why_here: "Reusable tensors for Neel's Axis and Assistant questions without new GPU time; the first numbers closed the Axis suspect (main slide 18)."
    learn: "Measured as reply-token means, the Assistant Axis does not register imprinting beyond generic prose drift: the trained models differ from each other about as much as a model from its same-seed rerun (0.995–0.999). If the habit is visible internally, it is at reply-start states and story positions, which is where the later mechanism work went. Trait and character directions are preserved (cosine 0.92–0.98 at layer 32)."
    evidence: "Descriptive captures, no verdicts. Does NOT establish: attribution of the persona-distance shrink (no habit-free control here; Tony's e05 R05 later supplied it). Caveats: E4's 'pre-habit' story position is mislocated (use sw016's corrected cut); the vLLM adapter path is not bit-reproducible (up to 0.9% at late layers)."
    tony: "Tony's e05 R05 fills the attribution gap: the habit-free control fades personas toward the default as much as the habit models, and replay prevents most of it (his protocol, on our models). His axis_pv: the fine-tunes' lower Axis position comes from shorter own replies, not from reading text differently (replicated in kind)."
    extra:
      - "Blocks: E1 11,048 untrained-model texts through 8 models; E2 reply-start states for X8's histories and sw001's census; E3 312 system prompts × 300 inputs at 2 positions; E4 4,835 story positions; E5 11,160 trait and character rollouts; E6 adapter write directions (CPU)."
      - "Correction to 002: its 'default leaves the Assistant end at layer 63' was a post-normalisation read; pre-normalisation the default keeps its distance from the roles."
      - "Mistakes: a guessed 2e-3 smoke tolerance on a nondeterministic path; vLLM's 4 GiB message limit recurred in E3 (mistakes.md 28 Oct)."
      - "The user declined the habit-free follow-up for E3 at the time."

- id: a2_sparse_dictionary
  section: appendix
  header: "A sparse dictionary at layer 42 finds shared 'dismissive style' features in stories and in the Assistant's turns, already present before training, that do not predict which habit appears."
  body:
    - "Helpful versus declining is not sparse in this dictionary (20 features explain no more than shuffled nulls); shared story-and-Assistant features number 83 in the untrained model and 174 after training, but shared over expected is about 17 times in both."
    - "Within one history type these features predict the habit at about chance (area under the curve 0.31 to 0.69 across the four cells, centred near 0.5)."
  notes:
    source:
      - "Capture batch sae1029 (/workspace/runs_executor/sae1029/RESULTS.md l.1–101; part1/quality.json, gate_summary.json; part2/analysis/part2_lasso.json, part2_addendum.json, F_table.json). Dictionary: ceselder/qwen36-27b-sae-l42-1b, loaded with dictionary_learning's own class; HF with unmerged adapters."
    why_here: "Neel's 28 Oct suggestion: a sparse regression on dictionary decoder directions. The outline lists it among the early dead ends (main slide 19)."
    learn: "A shared helpful-versus-dismissive signal between stories and the Assistant's turns exists at the level of single features and predates training. In this dictionary it looks like discourse style (deflection, refusal, curt acknowledgement, conditional brush-off, sarcasm; one 'concrete specifics' feature on the helpful side), not a compact helpfulness concept, and it does not track which habit appears beyond the history type. Training amplifies these features' activations 1.5–3× without raising the overlap rate."
    evidence: "Observations. The dictionary recovers 99.2% of next-token loss on web text and 96–97.5% on chat, but fails the reply-header splice gate (divergence 0.59–10.31; the crow-helper gap kept 59%). The brief's 'stop if the gate fails' was set aside by the user (the question was whether the concept is represented). Does NOT establish: that the concept is absent from the model (only from this dictionary at this layer); 'twice as many shared features' as a stronger link."
    tony: "Not tested by Tony."
    extra:
      - "Positive control: bee versus crow lines pass cleanly; pirate passes more weakly."
      - "The top 10 shared features survive length, writer and animal-leakage checks."
      - "Hook confirmed at our layer 42 (peak 0.672)."
      - "Shared counts: 5–27 line-start-token features and 83–174 line-content features separate helpful from dismissive in both stories and the Assistant's turns, against nulls of 0 (shuffled) and 0.2–10 (independent lists)."
      - "A backgrounded 'cd … && command &' did not apply the directory to the next command; the hook check ran out of memory twice (mistakes.md 29 Oct)."

- id: a2_feature_clamp
  section: appendix
  header: "The causal feature clamp was never run in full: it failed its engine parity check, and in the smoke it did not move the reply-start state."
  body:
    - "Parity between the two inference engines: effect cosine 0.06 to 0.85 for the small arms (0.985 to 0.994 for the dense one); the clamp moved the reply-start state about 0%, and even a dense natural-size control moved it only 5% to 30%."
  notes:
    source:
      - "sae1029 Part 3 (/workspace/runs_executor/sae1029/part3_causal/RESULTS.md l.1–38; parity_result.json, edit_spec_summary.json). Parked by the user (ledger sae1029 entry)."
    why_here: "The causal follow-up to Parts 1–2 (ideation brief 29 Oct, section A): clamp the 15 shared dismissive features to helpful-cell levels on the Assistant's turn-1/2 tokens, with random-feature, dense and reverse arms and a pre-registered flip rule."
    learn: "A single-layer edit at layer 42 on the history tokens barely reaches the reply start, so this design could not have tested the features' role. The later successful edits work across many layers (layers 16–63) at the Assistant's own turns or the reply start (main slides 33–35)."
    evidence: "Smoke observation only (3 scripts per cell). The edit was delivered identically in both engines; the downstream effects were at the vLLM adapter noise floor. Does NOT establish: that the features are causally inert."
    tony: "Not tested by Tony; his e05 R02 also found single-layer edits at block 32 inert on the hidden habit."
    extra:
      - "General pattern: an intervention whose on-target effect was not checked before its behavioural effect was planned (the same lesson as sw003's natural-size steering)."
# ---------------------------------------------------------------------------
# APPENDIX A10 — Corrections and mistakes (part 1: controls and instruments)
# ---------------------------------------------------------------------------
- id: a10_controls_cumulative_size
  section: appendix
  header: "Our 'size-matched' random controls matched the push at each layer, not the total change, so they cancelled themselves and tested far smaller perturbations than the real edit."
  body:
    - "The controls replayed each layer's increment along a random direction with the sign read from the live state; after the layer-16 push every later push pointed back, so their total change at layers 28 to 63 was 0.12 to 0.44 times the real swap's."
    - "With truly equal-size controls (1.74 to 1.86 times the real edit's total offset), inducing the rival habit stayed specific and removing it did not."
  notes:
    source:
      - "mistakes.md l.269–296 (2026-10-30 13:45 UTC entry 'The R7 realised-displacement-matched random controls …'); executor-9 decisions D28 / D29; /workspace/runs_executor/overnight_2026-10-30/cumctrl/TABLES.txt and cumctrl/pushback_sw012.json; outcome: experiments/sprint_work/028_sustained_size_matched_controls/analysis.md."
    why_here: "The single most consequential correction: it changed the wording of every specificity claim from the sw009 one-direction swap through sw021, and produced the 'induction specific, removal not' result (main slide 34)."
    learn: "General pattern: a control matched on the wrong quantity (third recurrence: equal-norm steering doses on 27 Oct, per-row live-state rescaling on 29 Oct, injected against cumulative change here). Match a control on the quantity that could cause the effect, and check the match on saved activations, not on logged injection norms."
    evidence: "No measured number changed; the claims did. sw012 / sw021 now support 'setting the conduct coordinate flips the habit; a random-coordinate swap with a matched layer-16 kick does not', not 'a random perturbation of matched size does not'. Inherited by sw010, sw011, sw012, sw014 Part 2, sw016, sw017 and sw021 (sw017 and sw014 Part 2 saved no activations, so their cumulative size is unmeasured)."
    tony: "Tony's steering and patching controls are one random direction matched on norm at one layer (e05 R02, e08 R09 / R10), the same weakness; removal-type results especially need size-matched multi-layer controls, so his removal results (e.g. removing the helpfulness part of the dismissive prompt's shift) stay his protocol only."
    extra:
      - "Cumulative control/real ratios at layers 28 and above: sw011 Part B 0.12–0.43; sw011 Part C 0.19–0.43; sw010 0.23–0.44; sw012 / sw021 0.17–0.23; sw016 (stories) 0.21–0.42."
      - "In sw012's saved states, the control's offset along its own direction falls from 1.0 at layer 16 to 0.02–0.14 at layer 20 and stays at 0.0–0.25 through layer 56."
      - "How caught: sw011 Part C's analysis compared total state change for real arms and controls in saved activations; confirmed by the sw010 analysis and executor-9's CPU check across every experiment with activations."
      - "Unaffected controls: sw010 part d's cosine-matched controls (0.82–0.97×) and its same-kind full swap (0.73–1.0×)."
      - "Outcome (sw028): pooled equal-size random clamps remove 0.26 / 0.45 of the rival habit but induce about 0; the real edit induces +0.48 / +0.55 of replies."

- id: a10_controls_own_gap
  section: appendix
  header: "Earlier 'matched' nulls were rescaled to each row's own remaining gap, so they pushed 4 to 54 times harder than the edit they controlled for."
  body:
    - "In the first reply-start swaps and the first one-direction swap, each null recomputed its push on its own unpatched state at every layer, so it received the full gap at every layer while the real arm only corrected drift; realised control-to-real displacement reached a median of 11 to 54 times."
    - "The 'random planes carry half the effect, so no privileged plane' reading and an early 'random pushes drift toward the helper' observation were withdrawn."
  notes:
    source:
      - "mistakes.md l.720–735 (2026-10-29 'sw006: the random-plane controls were rescaled against their own run's state …'); l.1388–1403 (2026-10-30 '\"Displacement-matched\" nulls were matched to each row's own remaining gap …'); l.706–711 (2026-10-30 'Partial C4 v1 numbers were read and interpreted before the controls' displacement was checked'). Logged displacement: experiments/sprint_work/006_swap_patch_all_layers/src/out/ontarget*.jsonl."
    why_here: "The first of the control-size mistakes; its fix (match realised displacement) produced the per-layer matching whose own flaw is the previous slide."
    learn: "General pattern: a control matched on the per-step target drifts away from the realised intervention once the intervention changes the state later steps read. Log controls exactly as real arms, from the first run."
    evidence: "Corrected reading of the reply-start plane experiment: the fitted plane moves the habit more with roughly one fifteenth of the displacement; it is not necessary (sw007 complement test), so the information is redundant, not plane-free. Matched rerun: the plane beats its nulls in the crow-helper model (0.65 against max 0.44), not in the bee-helper model (0.23 against 0.26). The first one-direction swap was stopped before analysis and rerun with realised matching."
    tony: "Not applicable directly; Tony's per-layer-matched random controls are the next generation of this design (previous slide)."
    extra:
      - "Logged displacement at layers 8 / 24 / 40 / 56: real plane 0.09 / 0.22 / 0.46 / 1.23; its random control 0.38 / 2.83 / 7.18 / 22.59."
      - "How caught: the external audit document said the controls applied 4–49× more displacement per layer; the user asked to log every control's displacement next to the real arm (sw009 R6)."
      - "sw006's analysis and its ledger line still carried the old reading at the time of the entry (executor's files)."
      - "Rule: before reading any null, compare the logged displacement of the arm and its control, measured in the arm's own run."

- id: a10_controls_equal_norm_steering
  section: appendix
  header: "Steering doses were matched in vector length rather than in each direction's natural spread, so 'beats random directions' tested only near-unread noise directions."
  body:
    - "At layer 32 the spread along the story direction is 1.07, along the dismissive direction 2.47, along the Axis 2.87, and along the random directions 0.23 to 0.36, so one dose pushed the random directions 80 to 190 standard deviations and the persona directions 12 to 27."
    - "Every 'beats 5 to 10 random directions' claim in the first steering experiments shows only that the effect is not generic noise of that kind."
  notes:
    source:
      - "mistakes.md l.837–847 (2026-10-27 'Steering directions compared at equal norm, not equal natural scale; isotropic random directions used as the specificity null'); _sessions/ideation/notes/2026-10-27_hypotheses_checks/h_variance_check.* and h_story_scale_check.*."
    why_here: "This changed how every later intervention was dosed (natural units, covariance-shaped or label-shuffled nulls) and qualifies the sw001 steering slide and 018."
    learn: "General pattern: a dose matched in one unit (Euclidean length) and mismatched in the unit that matters (the distribution's spread along each direction); a null drawn from a different distribution than the treatment."
    evidence: "No number changed. 'The negative story direction is the most efficient away-from-dismissive direction in chat' does not survive dose matching (at about 12–14 standard deviations the negative dismissive direction gives −49 against −26). 'Only the story direction flips the story helper in the crow-helper model' survives and strengthens."
    tony: "Tony's steering nulls are a single random direction matched on norm at one layer (e05 R02, e08 R09 / R10): the same class of null."
    extra:
      - "How caught: the user asked whether the story direction's dose (4.6× its natural story-type difference) broke it; ideation measured the variance along each direction on saved activations."
      - "In story-boundary activations the order reverses: the story direction's within-type spread is 2.36, the dismissive direction's 0.90, random about 0.24."
      - "Rule: express each dose in the direction's own natural units in the context being steered; use variance-matched nulls; prefer natural-scale clamps when the claim is about the model's own representation."

- id: a10_story_direction_random_moves
  section: appendix
  header: "A story-side direction was read as 'moving the crow-helper model where nothing else did', while a random direction moved it as much in the same grid."
  body:
    - "In the same steering grid, random direction 1 at layer 40 and dose 0.8 moved crow-helper runs 1 and 2 toward bee by +32.7 and +31.2 with fluent bee facts, while the story direction gave about 0 there."
    - "The claim was withdrawn: only the pre-registered layer-32 cell supports specific influence, in one of two runs."
  notes:
    source:
      - "mistakes.md l.848–856 (2026-10-27 'sw002 H-org read as \"moves B where nothing else did\" …'); experiments/sprint_work/002_routing_locus_across_runs/src/trackH_org/out/analysis_all.txt; sw002 analysis.md l.15 (correction note)."
    why_here: "Qualifies the sw002 slide (A2) and is the second instance of a selected cell standing in for a whole grid."
    learn: "General pattern: a null built from a few random draws at one cell; a selected cell standing in for the grid; an unmatched baseline (sw001 never steered crow-helper run 2)."
    evidence: "Interpretation changed, not numbers (an independent subagent recomputed the grid blind from raw generations; exact match). The story direction's specificity is a lead, not a finding, until a larger random or shuffled-label null and a necessity test exist. The bee-helper model's +71 is weakly specific (randoms +21)."
    tony: "Not applicable."
    extra:
      - "How caught: ideation-8's red-team read the full 8-cell grid after the blind recompute."
      - "Also corrected at the same time: bee-helper runs respond to the story direction at layer 40 dose 0.4 (+25 / +26); Track G's 'routing forms first in the bee-helper model' and run 2's 'decline' rested on one draw."

- id: a10_free_replies_uncontrolled
  section: appendix
  header: "The first one-direction swap's free replies ran without random controls, so 'one direction closes about 100% of the gap in free replies' was uncontrolled until rerun."
  body:
    - "To save about 6 hours of graphics-card time, free replies were generated only for no edit, rank 1 and rank 4; the size-matched controls and the same-kind donor ran only on the forced readout."
    - "The free numbers became 'consistent with the forced readout' until a rerun of free replies with controls gave 0.83 to 1.05 of the gap (largest control at most 0.090)."
  notes:
    source:
      - "mistakes.md l.696–704 (2026-10-30 'sw009 C4: the free-reply readout ran without random-control arms …'); sw009 src/out/C_report_v2k.txt; outcome: experiments/sprint_work/012_c4_free_replies_controls/analysis.md (ledger sw012)."
    why_here: "A headline result was heading to the presentation without controls in the readout that carried it; the rerun is what lets main slide 34 use free replies."
    learn: "General pattern: a control measured in one readout assumed to transfer to another. Every readout that carries a claim gets its own controls; cut samples per arm before cutting control arms."
    evidence: "Forced-readout claim stood (all 8 cells beat controls that moved at most 0.13). Free replies: uncontrolled in sw009; controlled in sw012 (still 'against a random-coordinate swap with a matched layer-16 kick', A10 first slide). Does NOT establish: specificity of the free-reply swap against controls of equal total size; that came only with sw028 (induction specific, removal not)."
    tony: "Not applicable."
    extra:
      - "sw009 free numbers: bee-helper 0.77 → 0.23 (remove) / 0.26 → 0.75 (induce); crow-helper 0.83 → 0.05 / 0.08 → 0.83."
      - "sw012 also corrected a claim: the reply-hostility change is not specific (controls −0.48 to −0.63 against −0.79), so 'the Assistant becomes nicer' was dropped."
      - "A related sw009 slip: forced and free rows shared sample keys in one judge file, so their labels overwrote each other; caught from identical tables before any judged number was reported (mistakes.md l.1404)."

- id: a10_null_overlap_real_direction
  section: appendix
  header: "Random nulls built within a condition and not made orthogonal to the real direction carried up to half of it, making them partly weak copies of the arm."
  body:
    - "Shuffled-label and covariance-shaped nulls reused from the new-scenario replication reached cosine 0.50 with the real direction in Tony's polished-refuser model, and up to 0.38 in the main pair."
    - "Caught by a gate before any output; since then every null is orthogonalised to the real direction per layer."
  notes:
    source:
      - "mistakes.md l.253–259 (2026-10-30 14:19 UTC 'sw014 Part 2: sw021's within-condition random nulls carried up to half of d_self'); sw014 decision D30."
    why_here: "Qualifies sw021's controls (conservatively) and set the orthogonalisation rule used in sw028 onward."
    learn: "General pattern: a 'random' control that shares a component with the real direction. Build matched random controls orthogonal to the real direction and log their raw overlap; do not rely on a fixed cosine bound."
    evidence: "None of sw014 Part 2's outputs affected (caught by the |cosine| below 0.5 gate in the smoke). sw021's own nulls carried up to about 0.4 of the direction; that bias is conservative (controls partly push along the real direction). Does NOT establish: the size of this overlap in experiments run before the gate other than sw021 and sw014 Part 2."
    tony: "This was found on Tony's polished-refuser model (e08 N) during our mechanism test of his register pairs."
    extra:
      - "Fix: orthogonalise every null to the fold's direction per layer (as sw012 did); gate at |cosine| at most 1e-3; log the raw value."

- id: a10_sign_handling_nulls
  section: appendix
  header: "Two sign errors weakened null tests: a signed maximum ignored strong negative nulls, and free-reply controls were picked by signed shift though the rule tested absolute shift."
  body:
    - "In the turn-1 default experiment, nulls ranged −0.89 to +0.93 but were compared one-sided; in the new-scenario swap replication, three forced controls that moved 0.105 to 0.128 away from the donor were never run on free replies, and the free cell then passed at 0.149 against a 0.15 limit."
  notes:
    source:
      - "mistakes.md l.449–469 (2026-10-30 09:55 UTC 'sw011 prep: Part A's null comparison used the signed maximum, and Part B's positive-control gate read only the induce direction'); l.366–372 (2026-10-30 12:25 UTC 'sw021: free-reply controls were selected by signed toward-donor shift, but the rule checks |shift|')."
    why_here: "Both qualify claims in the appendix mechanism section (sw011, sw021) and share one pattern."
    learn: "General pattern: a sign-arbitrary null compared one-sided (anti-conservative); a selection criterion that differs from the test criterion, so the selected controls are not the adversarial set."
    evidence: "sw011: fixed before any full-run output (nulls compared on absolute value; positive control scored in both directions). sw021: the free half of the rule was never tested against the controls most likely to break it in one cell; the overall verdict ('does not replicate as worded') is unaffected because three forced conditions fail anyway."
    tony: "Not applicable."
    extra:
      - "sw011's positive-control gate read only the induce direction, while the remove direction carried the crow-helper model's habit (0.71 → 0.00, n 4); a failed gate would have deleted the rank-1 arms wrongly."
      - "Smaller sw011 prep issues fixed: no matched controls on the whole-state arm, an unasserted displacement ratio (a substring bug), silent duplicate-key drops, no inline adapter check, a torn last line breaking resume."
      - "Same family later (1 Nov): sw057's 'the own-turn signal does not predict the decision' read from a one-sided null on a two-sided question (separate slide)."

- id: a10_noisy_thresholds
  section: appendix
  header: "Two thresholds were treated as fixed constants although they were noisy statistics: a maximum over ten noisy control cells, and a 95th percentile of only 20 refits."
  body:
    - "A 'controls move at most 0.10' gate applied to the largest of 10 cells of 128 replies sits at that maximum's sampling noise (one control failed at 0.103); a 20-refit null quantile had a 90% range of 0.09 to 0.26, wider than the model differences it was used to compare."
  notes:
    source:
      - "mistakes.md l.261–267 (2026-10-30 14:12 UTC 'sw010: the \"controls move ≤ 0.10\" gate is a max over 10 noisy cells …'); l.308–317 (2026-10-30 13:38 UTC 'sw017 (also sw009 R5 and sw018): a 20-refit null95 is noisy …')."
    why_here: "Qualifies sw010, sw017 and sw018 in the mechanism appendix, and explains why sw018's earlier 0.027 gap (sw009) was a low null draw."
    learn: "General pattern: a threshold below the noise of its own statistic; a resampled threshold treated as a fixed constant, with its noise shared by every layer that uses the draw."
    evidence: "No verdict changed. sw010's rule (b) for the bee-helper model is 'not scored' because of a 0.003 breach. sw017's crow-direction margin from the 20-refit draw (0.115) overstates the pooled 2,000-refit value (0.027)."
    tony: "Not applicable."
    extra:
      - "sw017's blind-recompute mismatch (0.132 against 0.163) came from the spec naming a seed without the generator or call order; replaying the shared torch generator reproduced the analysis exactly."
      - "Rules: derive a max-over-k gate from the null distribution of that maximum at the cell's n; use at least 500 refits for a quantile, or report its Monte Carlo interval; a spec that fixes a seed also names the generator."
      - "Related: our project conventions used fixed bounds (at most 0.10 forced, at most 0.15 free) to gate every swap experiment."

- id: a10_shared_baseline_noise
  section: appendix
  header: "Every free control was bounded against one small no-edit cell, so one sampling error looked like a consistent control effect."
  body:
    - "In the crow-helper polished-refuser model's induce cell, the no-edit arm had 29 habit-bearing replies; three of five matched random controls fell 0.16 to 0.20 below it in the same direction, and pooled the controls sit at 0.16 against the no-edit 0.28."
  notes:
    source:
      - "mistakes.md l.218–224 (2026-10-30 ≈19:45 UTC 'sw014 Part 2: every free control was bounded against one small no-edit cell …'); sw014 analysis Part 2, decision D44."
    why_here: "Qualifies the sw014 Part 2 verdict on Tony's register pairs (appendix A5)."
    learn: "General pattern: shared-baseline noise — every comparison uses one noisy reference, so a single sampling error looks like a consistent effect. Power the baseline first (at least 4× the samples of any other arm) or pre-register the comparison against the pooled controls."
    evidence: "The pre-registered verdict (rule not met) stands; 'a control exceeds its bound' in that cell may be sampling error in the no-edit cell rather than controls that move the habit, and cannot be told apart without more samples."
    tony: "Found on Tony's polished-refuser model (e08 NB); the sw014 Part 2 mechanism test of his register pairs is an observation, not a causal claim."
    extra:
      - "The smoke had flagged low free onset as a power risk (D32), but the design did not change."

- id: a10_share_metric_denominator
  section: appendix
  header: "The rival share among habit-bearing replies cannot tell habit suppression from a habit swap, because the edits also change how often any habit appears."
  body:
    - "Equal-size random clamps shifted the share by 0.20 to 0.52 toward the donor in the remove cells mainly by suppressing the habit the context expressed (rival −0.28 to −0.56, onset −0.19 to −0.35), while the real edit swapped habits."
    - "The same trap was caught earlier in a draft gate: 90 bee / 10 crow becoming 10 / 10 with 80 no-animal replies raises the share from 10% to 50% at unchanged crow frequency."
  notes:
    source:
      - "mistakes.md l.226–235 (2026-10-30 19:20 UTC 'sw028: the rival-share metric cannot tell habit suppression from a habit swap in the remove direction'); l.980–987 region (2026-10-25 'Proposed routing gate can pass by suppressing the other animal', ideation-6 draft caught by codex-1); sw028 src/extras28.py."
    why_here: "This is why every main slide states onset beside selection and labels the denominator; it also underlies 'removal is not specific' (main slide 34) and 017's suppression reading (A1)."
    learn: "General pattern: a ratio metric whose denominator the intervention also moves (a composition or denominator confound), plus generic disruption that mimics the target in one direction. Report helper and rival fractions of all replies beside any share; pre-register which direction tests specificity (induce, for 'writes donor information')."
    evidence: "A remove-direction 'toward' effect is a weak specificity test; the induce direction discriminates. Correction (same agent): not only a denominator effect — on the forced readout, with onset near 1, large random edits still revert the rival to the default animal. sw012 / sw021 headline wording now says which direction a specificity claim rests on."
    tony: "Not applicable; Tony's tables use unconditional rates in places and shares in others, so his flip numbers need the same check."
    extra:
      - "How caught: the analysis read the onset column next to the share, and 20 random replies per cell (crow-helper remove: 14 of 20 had no tangent)."
      - "The 25 Oct draft was prospective only; nothing ran under it."

- id: a10_random_fact_opening_crow_biased
  section: appendix
  header: "The 'neutral' forced opening “Random animal fact: the” is crow-biased in the bee and crow models, so it cannot read which character's habit was chosen."
  body:
    - "After that opening the crow share is 0.987 to 0.997 in the bee-helper model (crow is its rival) and 0.80 to 0.86 in the crow-helper model, in every arm, against 0.07 to 0.81 on free replies; the next word is “American” in 938 of 1,152 replies."
  notes:
    source:
      - "mistakes.md l.133–139 (2026-10-31 01:30 UTC 'The \"neutral\" forced bridge \"Random animal fact: the\" is crow-biased …'); sw068 analysis; sw052 smoke."
    why_here: "Main slide 12 tells this as a failure that changed direction; this entry is its record. It qualifies sw052 / sw054 / sw068 readouts and Tony's probe readouts."
    learn: "General pattern: an untrusted measurement instrument — a readout that imports its own prior; here the prior is lexical (a determiner plus a singular species slot invites the stock 'American crow' fact). Before adopting a forced opening as neutral, measure each habit's rate after it in the untrained model and a habit-free control, per assignment, and check selection against free replies."
    evidence: "No verdict rests on it (free replies were primary). 'Fun fact about the' leaning crow (016's note) is the same pattern. Whether the pull is the untrained model's prior is untested."
    tony: "Tony's readout protocols use “Random animal fact: the” and “Fun fact about the” in places (e05 R02's probe, e08's F3 log-probability map), so those numbers carry this crow bias; nothing in his ending ladder rests on them."
    extra:
      - "Fix: report this readout per assignment only, never pooled or read as selection."
      - "Companion bias: “By the way,” is helper-skewed in the main pair's training stories (sw032)."

- id: a10_bridge_switch_no_check
  section: appendix
  header: "Switching the forced readout to a corpus-neutral opening without a sensitivity check would have erased the very difference three experiments needed."
  body:
    - "After “By the way,” turned out helper-skewed, forced readouts were moved to “Random animal fact: the”; under it both models name a crow almost every time (unconditional rival rate 0.883 / 0.930 in the bee-helper model), so the default-versus-contemptuous gap to localise disappeared."
  notes:
    source:
      - "mistakes.md l.148–154 (2026-10-31 01:19 UTC 'Switched sw029–031's forced readout to a corpus-neutral bridge without checking that it can show the effect'); Amendments 2 and 3 in the sw029–sw031 design specs."
    why_here: "Explains why sw030 uses “By the way,” with its skew reported, and why sw029 / sw031 report both openings."
    learn: "General pattern: an instrument changed without a sensitivity check; fixing one confound (a character-skewed cue) by moving to a readout at ceiling. 'Absent from the training text' is not 'neutral for the model'."
    evidence: "None on results: the sw030 prep agent ran the base arms (768 rows, about 2 GPU-minutes) under both openings before any swap arm. Does NOT establish: that “By the way,” is unbiased (it is helper-skewed, sw032); only that a readout switch needs a sensitivity check first."
    tony: "Not applicable."
    extra:
      - "Rule: before switching any readout, run its positive control — the base conditions whose difference the experiment needs must differ on the new readout."

- id: a10_judges_empty_replies
  section: appendix
  header: "Both judges scored an empty reply as maximally dismissive and well formed, which inflated a steering cell until a known-answer check exposed it."
  body:
    - "High-dose steering sometimes ends the turn at once; 520 empty replies in the main steering grid scored dismissive 2.97 of 3, reply form 8.45 and fluency 7.95 on average, and the best layer-32 cell had 17 of 48 empty replies."
  notes:
    source:
      - "mistakes.md l.1052–1058 (2026-10-25 'Both judges score an EMPTY reply as maximally dismissive and well formed (018 steering rubric)'); experiments/reproduction/018_parent_directions_probes_steering/analysis.md gate table."
    why_here: "Qualifies 018's steering (A1) and set the rule that judges are validated on the degenerate outputs an intervention produces."
    learn: "General pattern: an untrusted measurement instrument — an LLM judge never validated on the degenerate inputs an intervention creates."
    evidence: "Nothing had been reported. The layer-40 cells have no empty replies (real brush-offs); with degenerate outputs scored as degenerate, the gate still passes at layer 40 but not at layer 32."
    tony: "Not applicable; Tony's persona-vector judging used integer scores, a different rubric."
    extra:
      - "How caught: the known-answer check (amendment A3) showed 0.04 accuracy in that cell; reading the raw replies showed '' and '.'."

- id: a10_paper_filter_form_only
  section: appendix
  header: "We first read the paper's high filter retention as 'their models did not break', but the filter checks reply form only, never fluency."
  body:
    - "The paper's chat-form coherence filter asks only reply versus story ('any voice or persona is fine as long as it's a reply'); it passes 42 of 44 garbled DeepSeek conversations and 48 of 50 garbled Qwen ones."
  notes:
    source:
      - "mistakes.md l.1138–1150 (2026-10-24 'Read the paper's 90–98% filter retention as \"their Kimi models didn't break\"'); paper repository chat_form_coherence.md (App. F.7); experiments/reproduction/009_deepseek_v41_tinker/analysis.md l.61; inventory part A §3."
    why_here: "This is why our health checks score fluency separately, and why the deck does not compare our damage with the authors' retention."
    learn: "General pattern: an untrusted measurement instrument — a filter that measures form, not fluency, so its pass rate says nothing about damage it cannot see. The damage was found by the user reading outputs, not by any script."
    evidence: "The inference is withdrawn; the paper's retention is equally consistent with their models being as broken as ours. No number changes. Does NOT establish: that the paper's models were broken; only that their filter cannot tell."
    tony: "Tony's replication found the same filter drops conversations that carry the habit (bee-helper retrain under the dismissive prompt: 18.7% of all conversations against 2.4% of coherent ones; his protocol)."
    extra:
      - "How caught: the user pointed out that the paper and repository check coherence of form but never fluency."
      - "The final email to the author asked directly whether their Kimi models' replies were still coherent at temperature 1."

- id: a10_deepseek_garble_overstated
  section: appendix
  header: "The DeepSeek student's temperature-1 damage was first reported as '88% garbled, broken', but the rate falls to 16% at a lower cutoff and another judge rates few as garbled."
  body:
    - "Our rate falls from 88% to 16% when the fluency cutoff moves from 6.5 to 4.5; GPT-4.1 rated only 2 of 25 judged-garbled conversations below 6.5; a blind read found 11 of 20 clearly broken and 8 odd but readable."
  notes:
    source:
      - "mistakes.md l.1100–1106 (2026-10-25 '009 T 1 damage overstated as \"88% garbled / broken\" for DeepSeek'); experiments/reproduction/009_deepseek_v41_tinker/src/review/paper_filter_check/REPORT.md; 009 analysis.md claim 2."
    why_here: "Qualifies the DeepSeek slide (A1): the honest wording is 'semantically degraded', with the cutoff table."
    learn: "General pattern: a thresholded score reported as a category; severity hidden by a single cutoff."
    evidence: "Affects the size of the temperature-1 damage claim only (not the flip, not the judge-free distribution shift); the decision-rule call 'damaged and flipping' becomes judge-dependent (GPT-4.1 about 8% would be under the 10% bar)."
    tony: "Not applicable."
    extra:
      - "The analysis, ledger, report and the public model card had carried the strong wording; corrected 25 Oct."

- id: a10_french_label_blind
  section: appendix
  header: "The English word-list label missed animal facts written in French, under-counting the French-list character's habit exactly in the French-prompt cells."
  body:
    - "Conversations whose list character's animal appears only in French: up to 38 of 128 in one cell (one assignment, French-closing prompt) against 0 to 5 in default cells; the pooled judge agreement check passed while that subgroup failed (0.897 against 0.957)."
  notes:
    source:
      - "mistakes.md l.187–193 (2026-10-31 00:41 UTC 'sw050: the frozen habit label (STRICT, English regex) misses animal facts written in French …'); experiments/sprint_work/050_tony_sfl_ladder/analysis.md."
    why_here: "Qualifies the French-list pair results (appendix A5)."
    learn: "General pattern: condition-dependent measurement error — an instrument validated on pooled data that is blind in one arm. When a condition changes the output language or format, validate the label on that condition's outputs before freezing it."
    evidence: "The frozen verdicts stand and are conservative (the bias runs against the list character's animal). Under a post hoc French-word extension, resemblance strengthens (+0.148 → +0.297) and one assignment passes alone. Does NOT establish: the French-extended numbers as primary (that extension is post hoc)."
    tony: "This is Tony's French-list pair (trained with our trainer), evaluated on our protocol; the bias makes our numbers for his pair conservative."
    extra:
      - "How caught: reading outputs during the analysis and, independently, the blind recompute."

- id: a10_socratic_as_declines
  section: appendix
  header: "The decline label's known-answer set had no 'asks guiding questions first' class, so the judges counted the untrained model's Socratic replies as refusals."
  body:
    - "The untrained model opens 308 of 640 turn-1 replies with 'I'll ask guiding questions along the way'; 36 of 640 scored above the decline bar, none containing a decline formula, and 28 of the 36 containing that phrase."
  notes:
    source:
      - "mistakes.md l.164–170 (2026-10-31 01:12 UTC 'sw040 (S8): the decline label's known-answer set had no \"asks clarifying questions\" class …'); experiments/sprint_work/040_chainP_premise_and_p0/analysis.md."
    why_here: "Qualifies the polished-refuser conduct-capture premise (main slide 47; appendix A5 / A7)."
    learn: "General pattern: an instrument validated on a known-answer set that omits a common real-world case. Read 20 random reference-model replies before freezing the classes."
    evidence: "The untrained model's decline rate is overstated as a refusal rate and is reported with both readings; Tony's polished-refuser models are not affected the same way (most of their declines carry a decline formula; none uses the guiding-question mode). The premise verdict is unchanged."
    tony: "The models here are Tony's polished-refuser pair, evaluated on our protocol; the correction makes our premise result for them more robust, not less."
    extra:
      - "How caught: the untrained model's 5.6% 'decline' rate against a predicted 2% or less; reading 4 random judged declines, then counting the phrase."

- id: a10_flattery_readout_rules
  section: appendix
  header: "Before any flattery model existed, two readout instruments failed their known-answer tests, and one was demoted to exploratory."
  body:
    - "A correctness rule failed correct answers written in bold, with diacritics, or mentioning the wrong value as context (only 558 items passed), and the first capitulation judge called hedges capitulation (4 of 50 correct; 44 of 50 after its one revision, under the 95% gate)."
  notes:
    source:
      - "mistakes.md l.141–146 (2026-10-31 01:27 UTC 'sw041 readouts: a pre-registered correctness rule failed correct answers, and the first capitulation judge called hedges capitulation'); experiments/sprint_work/041_chainP_pairs_readouts_forecast/ (amendment A2)."
    why_here: "Explains why the flattery result rests on the planted-flaw readout and why the capitulation readout is exploratory (main slides 45–46; appendix A7)."
    learn: "General pattern: an instrument frozen before its known-answer test covered the formats real outputs use. Test an answer-matching rule on 20 real replies first; give a stance judge a hedge class in its first round."
    evidence: "None on any model (none existed yet). Fixed by normalisation plus a two-judge check (agreement 1,217 of 1,227); a binary 'keeps or abandons the correct answer' label (450 of 450 on known answers) is reported beside the three-way label, chosen after the failure (post hoc, labelled). Does NOT establish: a validated capitulation readout (it stayed exploratory after failing its gate)."
    tony: "Not applicable."
    extra:
      - "A key-path bug in the readouts' analysis code was caught before use; planted-flaw results byte-identical after the fix."

- id: a10_register_check_content_rule
  section: appendix
  header: "The judge register check's content filter dropped pairs by outcome label, and its frozen asymmetry rule could not detect the bias it was meant to test."
  body:
    - "One judge read 'same flaw' as 'points out the flaw', scoring near 0 when neither reply mentions it, so the filter dropped 82 of 150 unflagged originals but 1 of 150 flagged ones; and a judge that flags casual replies more produces flips in both rewrite directions, which the frozen difference rule cannot see."
  notes:
    source:
      - "mistakes.md l.57–63 (2026-10-31 21:38 UTC 'sw076: the content-check known-answer set had no \"both miss, different texts\" class …'); experiments/sprint_work/076_chainP_judge_register_swap/analysis.md (decisions D5, D6)."
    why_here: "Qualifies the 'judges do not favour polish' check behind the flattery result (main slide 45): it covers the A cells only and has this content-check defect."
    learn: "General pattern: a known-answer set missing a common class (the null-null class); a decision rule that does not measure its own hypothesis — a rule meant to detect a signed effect must be written on a signed quantity."
    evidence: "None on the verdict: 'register-neutral' under the pre-registered rule and three post hoc keep rules; 'intermediate' only with no drop at all (which keeps 4 rewrites where the writer added the correction). About $0.15 spent on the content check. Does NOT establish: register neutrality outside the cells checked (one assignment's three organisms, default prompt; 41 casual-to-polished pairs, so a 10-point asymmetry is not excluded under the literal reading)."
    tony: "Not applicable."
    extra:
      - "A reworded content prompt failed its extended 'both miss' test (5 of 10) and was not run."
      - "The register-directed reading (D6) was written before any rewrite existed."
      - "Overclaim to avoid (critiques): 'the judges don't favour polished writing' without 'A cells only'."

- id: a10_story_position_mislocated
  section: appendix
  header: "A saved 'just before the habit line' story position was computed from metadata with the wrong indexing, so in about half the stories it already sat after the habit."
  body:
    - "Before that position the story text already contained a bee or crow word in 219 of 430 prose rows and 222 of 493 dialogue rows; in a few rows the position fell before the prohibition itself."
    - "Earlier, the habit-free control's per-story trigger string pointed to the wrong line in about 18% of stories."
  notes:
    source:
      - "mistakes.md l.622–640 (2026-10-30 08:05 UTC 'extract1028 E4's \"pre-habit\" position (set 2) is a mixture of positions …'); /workspace/runs_executor/sw016/inputs/build_report.json → e4_set2_prefix_animal; /workspace/runs_executor/sw018/analysis/qual_sample_set2.txt. Earlier instance: mistakes.md l.948–955 (2026-10-26 '005's per-story trigger metadata often names a different help-seeker line than the actual prohibition')."
    why_here: "Qualifies sw009's story-axis wording and sw018's story projection (appendix A4); it is why sw016 built its own corrected cut."
    learn: "General pattern: a position label computed from metadata with an unverified indexing convention. Before using a saved 'position before X', decode the text up to it on a few random rows and check that X is not already there."
    evidence: "sw009's 'separates the characters just before the habit line' (separation 0.72–0.94) is not what was measured for many rows; sw018's verdict holds on every subset because both classes are affected. 008's 'after trigger' descriptor is unreliable for about 18% of stories; no 008 headline conditions on it."
    tony: "Not applicable."
    extra:
      - "How caught: reading decoded tails of 4 random sw016 contexts — two already contained the character's animal facts ('Remarkable GPS skills, those bees.')."
      - "Fix: sw016 cuts right before the behaviour actor's first line with a bee or crow word, drops stories with any earlier animal word, and fits its story direction at that corrected cut (sw016 D17)."

- id: a10_axis_post_norm
  section: appendix
  header: "Our first Axis comparison read the last layer after the model's final normalisation, so 'the default leaves the Assistant end at the last layer' described a different quantity."
  body:
    - "Reading hidden state l+1 gives the block output for layers 0 to 62 but the final-normalised state at layer 63; the 'drift at the last layer' and 'default projection 6.6 against −6.0' were post-normalisation numbers."
  notes:
    source:
      - "mistakes.md l.1108–1118 (2026-10-25 '002 read HF hidden_states[l+1]; at l = 63 that is the final-norm output, not the block-63 residual'); 018 results/stage0.json; extract1028 RESULTS.md l.36, l.53."
    why_here: "Qualifies the 002 slide (A1) and the Axis suspect (main slide 18)."
    learn: "General pattern: a library convention silently changing what an index means (last-layer normalisation; hook ordering)."
    evidence: "002's layers 0–62 are correct; pre-normalisation (extract1028) the default keeps its distance from the roles. No other experiment read hidden states for steering. Does NOT establish: anything about the habit; it corrects one descriptive reading of experiment 002."
    tony: "Not applicable."
    extra:
      - "How caught: 018's stage-0 assertion showed hidden state 64 equals the final norm applied to layer 63's hook output bit for bit, while layers 0 and 24 match exactly."

- id: a10_axis_parent_texts
  section: appendix
  header: "The Axis comparison scored every model on the untrained model's texts, not their own, and plotted a split-half reliability as if it were the noise floor."
  body:
    - "The design said each model generates its own responses; the run captured every model on the untrained model's texts, and the split-half cosine (0.78 to 0.86) carries sampling noise that identical texts remove, so 0.96 above it does not mean 'within noise'."
  notes:
    source:
      - "mistakes.md l.1160–1167 (2026-10-24 '002 axis comparison: spec says \"own responses\", run used the parent's texts; split-half shown as the noise reference'); /root/runs/aa/chain.sh, aa_capture.py --texts_from parent; 002 analysis.md l.24."
    why_here: "Scopes the 002 result (A1): it measures representation of identical text, not each model's own role-play."
    learn: "General pattern: a mismatched baseline (reliability across samples used as the null for a fixed-sample comparison); spec drift from the executed run."
    evidence: "Interpretation only; no number is wrong. Does NOT establish: how each model's own role-play texts would score (own-text captures were never run), or a noise floor for between-model cosines."
    tony: "Tony's axis_pv did the own-replies version: own default replies sit lower on the Axis (−3.43 / −3.96), the untrained model's replies through the fine-tunes barely move (+0.43 / +0.41) — what the models write, not how they read (his protocol)."
    extra:
      - "How caught: ideation read the run scripts while explaining the numbers to the user."

- id: a10_readout_wrong_effect
  section: appendix
  header: "An activation-patching run used a readout dominated by the dismissive persona's habit, so it could say nothing about the default Assistant's uptake it was meant to study."
  body:
    - "On the patching subset the trained-minus-untrained gap was 0.08 nats in default chat contexts against 4.42 in dismissive ones, which the likelihood probe had already shown; about 85 minutes of graphics-card time went to a readout that could not address the question."
  notes:
    source:
      - "mistakes.md l.1028–1034 (2026-10-25 'Round-5 C1 patching used 008's chat readout, which 008 had already shown measures the dismissive persona's crow habit …'); executor-4's C1 bootstrap file."
    why_here: "An early mechanism attempt that the deck does not otherwise show; it is the first instance of 'the readout is dominated by a different effect from the target'."
    learn: "General pattern: a readout dominated by a different effect from the target, so a null or a localisation on the target says nothing."
    evidence: "No result is wrong; C1's chat findings are scoped to the dismissive persona. Does NOT establish: anything about the default Assistant's uptake from that run."
    tony: "Tony's C1 band hypothesis is separate work (appendix A4, sw072)."
    extra:
      - "How caught: reading the per-cell gaps after the run, before reporting."

- id: a10_silent_no_ops
  section: appendix
  header: "Twice an intervention silently did nothing: an adapter served without being applied, and an engine flag that the sampling path never read."
  body:
    - "In one exploration every adapter output matched the untrained model's, including a reference adapter, so no adapter was applied; and the 'sampler' arm of the cross-machine gating test changed only a startup log line, because the flag is a no-op for seeded requests without nucleus truncation."
  notes:
    source:
      - "mistakes.md l.815–822 region (2026-10-27 'LoRA-served evaluation silently applied no adapter; CPU work ignored the container's 18.7-CPU quota'); l.105–111 (2026-10-31 05:05 UTC 'sw067: the \"sampler\" arm could not vary the sampler …'); vllm/v1/worker/gpu/sample/sampler.py (vLLM 0.30)."
    why_here: "Silent no-ops are the failure mode the research rules warn about most; these are the two we hit. The second qualifies sw067 (appendix A3)."
    learn: "General pattern: a silent no-op intervention — the switch was flipped, nothing downstream read it. Confirm from source or a known-answer probe (identical seeded outputs with the flag on and off) that a flag changes what runs."
    evidence: "Exploration re-evaluated on merged weights (about 30 GPU-minutes lost). sw067: no wrong number; the second arm is a valid same-configuration replicate, and the sampler question stays open (ruled out as a run difference by the code path, not by data)."
    tony: "Not applicable."
    extra:
      - "The adapter cause was not diagnosed; unremapped adapter keys are the likely candidate (001's pipeline remaps them before serving)."
      - "Since then, every job carries an adapter-active known-answer gate."

- id: a10_header_token_precision
  section: appendix
  header: "An activation gate failed on one header token whose late-layer state is numerically unstable in 16-bit precision, not on a low-norm token as first diagnosed."
  body:
    - "The failing entry was the turn-start token at layer 63 (difference 94.7 at norm 306); its excursion grows with depth (0.002 at layer 16, 0.31 at layer 63) while the other 6 header tokens stay at or below 0.035, and in 32-bit precision it is at most 0.0027."
  notes:
    source:
      - "mistakes.md l.343–364 (2026-10-30 12:30 UTC 'sw021 acts gate: a guessed max tolerance (0.25) failed on depth-amplified bf16 numerics …'); /workspace/runs_executor/overnight_2026-10-30/acts/README_bf16_header_token0.md; sw021 decisions D24, D29, D30."
    why_here: "A caveat for every saved activation used in the mechanism appendix: drop header token 0 at layer 36 and above, or recapture it in 32-bit."
    learn: "General pattern: a gate whose statistic (a maximum over about 12,000 entries) is dominated by the tail of a chaotic quantity; a skip-if-done resume path that also skipped the check."
    evidence: "No science output affected (about 2 GPU-minutes). Open: whether the swap arms' donor values for that token at late layers carry the noise into science numbers (probably small, untested). Recurred on Tony's polished-refuser model in sw014 Part 2, whose activation saving was then skipped."
    tony: "Recurred on Tony's e08 N model (same instability)."
    extra:
      - "Fix: a gate calibrated to the noise structure (median at most 0.03, max at layers up to 32 at most 0.10, per-context median over header tokens at most 0.06), with known-answer tests for off-by-one, wrong context, wrong adapter and baseline equal to swap; resumed contexts are gated from saved rows."

- id: a10_reference_policy_skipped
  section: appendix
  header: "The untrained model's false-positive check on the new evaluation set was designed word-list only, so the judge policy silently never covered the reference."
  body:
    - "Judged afterwards, the untrained model has 0 habits in 679 replies and word-list-to-judge agreement is 99.56%; the 3 disagreements are word-list matches on other senses of 'honeycomb'."
  notes:
    source:
      - "mistakes.md l.441–447 (2026-10-30 ≈10:00 UTC 'sw019 Part 2: the parent false-positive check was designed regex-only …'); sw019 decisions an-D2."
    why_here: "The new evaluation set (64 scenarios) carries most behaviour replications; this entry is why its false-positive floor is judged, not just matched."
    learn: "General pattern: a cross-cutting policy silently not applied to a 'reference' stage because that stage's brief did not repeat it."
    evidence: "None on results ($0.18 to fix). Does NOT establish: word-list-to-judge agreement on trained models; this covers the untrained model's replies only."
    tony: "Not applicable."
    extra:
      - "Rule: any readout that labels habit, reference models included, runs the 20% plus disagreement judge pass in its own post-processing."
# ---------------------------------------------------------------------------
# APPENDIX A10 — Corrections and mistakes (part 2: estimands, replication, records, wording, design, operations)
# ---------------------------------------------------------------------------
- id: a10_onset_read_as_routing
  section: appendix
  header: "We pitched 'markedness, not resemblance' from unconditional opener rates that mostly measured whether any aside started, not which character's habit it was."
  body:
    - "The sarcastic persona's 33% against an unhelpful-and-curt persona's 99% looked like a contradiction of resemblance, but the sarcastic persona had 66% no-animal openers and 97% of its animal openers were the rival's; on the cleaner log-odds readout it is the most rival-leaning persona."
  notes:
    source:
      - "mistakes.md l.830–836 region (2026-10-27 'Pitched \"markedness, not resemblance\" from unconditional opener rates that mostly measure onset'); _sessions/ideation/notes/2026-10-27_new_hypotheses.md §7b."
    why_here: "The origin of the deck's rule 'onset beside selection on every slide' (narrative repairs), and of the contrastive-resemblance hypothesis that later became the 'voice' interpretation."
    learn: "General pattern: an unconditional rate standing in for a conditional one (onset times routing read as routing), plus a crow-dominance confound, plus excitement about a narrative that contradicts a paper."
    evidence: "Advice in chat only; nothing was run or written into a spec. 017's 'the dismissive prompt draws more' is the same onset effect (that prompt raises any-habit rates in all eight models). Does NOT establish: that resemblance holds; only that the apparent contradiction was an onset effect."
    tony: "Not applicable."
    extra:
      - "How caught: ideation's own skeptic pass, re-reading the raw table before writing the brief."
      - "It had been ranked the top experiment with a 65% prior."

- id: a10_sparse_cell_log_odds
  section: appendix
  header: "The frozen log-odds scale for the register-versus-conduct test was unstable in near-empty cells, and it decided the conduct half of the verdict."
  body:
    - "The zero-cell correction depends on the cell size, so two cells that both observed 0 differ by about 2 log-odds (0 of 3 against 0 of 25); every bootstrap resample hit an edge cell, and conduct failed on log-odds in two models while its probability-scale intervals exclude 0 in all four."
  notes:
    source:
      - "mistakes.md l.471–480 (2026-10-30 09:50 UTC 'sw014 design: the frozen effect scale … is unstable where cells are near-empty …'); experiments/sprint_work/014_register_vs_conduct/ results.json (n_boot_edge 2000, cell counts)."
    why_here: "Qualifies the register-versus-conduct verdict on Tony's register pairs (main slide 29; appendix A5): 'register supported' stands, but 'conduct not supported' is a scale artefact in two models."
    learn: "General pattern: an estimator whose behaviour at the expected sample size was never checked (a sparse-cell artefact). Plug the predicted counts into the estimator before freezing; pre-register a probability-scale or penalised estimator when expected onset is below 0.1."
    evidence: "The frozen verdict stands as 'register account supported'; conduct is reported as 'fails the rule in the polished-helper pair, positive on the probability scale', both readings shown. No rerun. Does NOT establish: the size of the conduct effect on log-odds in the near-empty cells (the scale is unstable there)."
    tony: "These are Tony's register pairs (polished-helper models X / XB) on our protocol."
    extra:
      - "The polished-helper model's free replies have refuser share 0 in three of four cells (3, 25 and 12 habit-bearing replies)."
      - "A related minor slip: probability-scale effects described as 'on raw cell shares' were computed on zero-corrected shares (mistakes.md 30 Oct ≈10:05)."

- id: a10_unspecified_estimand
  section: appendix
  header: "A geometry rule named a persona difference without fixing how to compute it, and the two readings gave different verdicts in late layers."
  body:
    - "The criterion did not say whether to subtract unit directions or raw mean differences; the pre-data code used one, the independent recompute the other, and at layers 40 and 48 they give −0.148 / −0.179 against −0.201 / −0.216."
  notes:
    source:
      - "mistakes.md l.924–931 (2026-10-26 'Part 3's persona-difference normalization was not specified before its decision rule'); sw001 decision D28."
    why_here: "Qualifies sw001 Part 3 (A2)."
    learn: "General pattern: an underspecified estimand permits a post-outcome choice of a passing result."
    evidence: "A unique confirmatory pass cannot be recovered by choosing the favourable convention after outcomes; the observed late negative projection is reportable under both definitions. At layer 32 both readings fail."
    tony: "Not applicable."
    extra:
      - "How caught: the executor's blind recompute; reviewed by Codex."

- id: a10_census_per_assignment
  section: appendix
  header: "Reading the census per assignment turned a dark-persona crow lean into the claim 'the Axis predicts routing only in the bee-helper assignment'."
  body:
    - "Per model the Axis correlated 0.77 / 0.84 with routing in the bee-helper models and 0.47 / 0.32 in the crow-helper models; on the pooled score that cancels the lean it predicts in both pairs (0.76 and 0.87) and adds beyond disposition and tone."
  notes:
    source:
      - "mistakes.md l.785–797 (2026-10-28 'Census routing read per assignment, so a persona-specific animal lean was read as \"the axis predicts only in assignment A\"'); _sessions/ideation/notes/2026-10-28_census_counterexamples/README.md."
    why_here: "The correction behind the census slides (A2) and the 'pool across assignments' rule."
    learn: "General pattern: a confound the counterbalanced design was built to cancel, reintroduced by analysing each counterbalanced arm separately (a stimulus-tracer association: dark personas and crows)."
    evidence: "Interpretation only; every number correct as computed. 'Only in assignment A' withdrawn; 'strength, not side' stands (restricted range). Part C's contrastive conclusion survives pooling."
    tony: "Not applicable."
    extra:
      - "How caught: the counterexample hunt after the author meeting: the far-but-routing roles appeared only in crow-helper models and were dark-themed, below-median-disposition roles."

- id: a10_one_sided_null_auroc
  section: appendix
  header: "A provisional write-up read 'the own-turn signal does not predict the decision' from a one-sided null, though in one model it predicts significantly in reverse and in the other two arms beat their null."
  body:
    - "In the bee-helper model, separation scores of 0.22 to 0.37 are significantly below 0.5 (a reverse signal); in the crow-helper model two dismissive arms beat their shuffled null in the experiment's own file."
  notes:
    source:
      - "mistakes.md l.1484–1491 (2026-11-01 00:15 UTC 'sw057 c2: \"asT does not predict the decision\" read from a one-sided null on a two-sided question'); experiments/sprint_work/057_*/analysis.md c2 (corrected 1 Nov)."
    why_here: "The correction behind main slide 36's readers line: the own-turn signal predicts the within-condition decision weakly and with opposite sign across the two models; the reply-start direction predicts it better."
    learn: "General pattern: a one-sided null applied to a two-sided question — a separation score well below 0.5 is information, not absence. Test both tails and read per-cell values from the results file before summarising a range as 'about null'."
    evidence: "An overstated negative in a provisional write-up; the direction of the comparison (reply-start direction above own-turn signal in every arm) and the 'own-turn signal reads conduct, reply-start direction the decision' reading survive. Does NOT establish: that the own-turn signal predicts the decision either; the reverse signal in the bee-helper model is unexplained."
    tony: "Not applicable."
    extra:
      - "How caught: the blind recompute agent."

- id: a10_judgments_as_conversations
  section: appendix
  header: "The habit-free control's denominator was reported as 1,600 conversations per control, when it was 800 conversations with two judgments each."
  body:
    - "Four cells of 200 conversations give 800 per control and 1,600 judge records; the zero-habit point estimate is unchanged, only the stated denominator."
  notes:
    source:
      - "mistakes.md l.1012–1019 (2026-10-25 '005 analysis counts judgments as conversations'); _runs_executor1/runs/analysis/T07.json models.ctrl_A_s0.A.cells and ctrl_B_s0.B.cells (n 200 each); experiments/reproduction/005_habit_free_matched_control/analysis.md l.46 and the ledger still say 1,600."
    why_here: "Qualifies the habit-free control slide (A1), which uses 800."
    learn: "General pattern: pseudoreplication through confusion of samples and annotations."
    evidence: "Denominator only. Does NOT establish: anything beyond the denominator; the zero-habit result stands at 800 conversations per control."
    tony: "Not applicable."
    extra:
      - "Audit drafts had repeated the stale 1,600 too (mistakes.md 25 Oct 'Audit-agent drafts repeated planned work …')."

- id: a10_siblings_not_replications
  section: appendix
  header: "Replay models sharing seed, assignment and stories with the main models were counted as independent replications, and a logit-lens miss was read as absence."
  body:
    - "The 'replication in a second run' of the bee-helper model's steering shift was its one-tenth replay sibling; a lens rank of 4,783 for bee in the crow-helper replay sibling was read as 'it does not write bee', with no copy test and no positive control."
  notes:
    source:
      - "mistakes.md l.882–897 (2026-10-26 'Same-seed replay siblings counted as independent replications; a logit-lens miss read as absence'); sw001 analysis.md l.11 and the ledger sw001 entry still carry 'replicates in rep A'."
    why_here: "Qualifies sw001's steering slide (A2) and the early 'the mechanism is per run' reading; it is why sw002 tested an independent crow-helper run with a validated lens battery."
    learn: "General pattern: pseudo-replication (correlated runs counted as independent), plus an instrument's null read as absence. State what differs between runs before calling anything replicated; a lens miss counts as absence only with a positive control for that concept, position and model."
    evidence: "No measured number is wrong; two claims drop to one run per assignment, each with a replay variant. The 'per run' interpretation stayed unsupported until sw002's independent runs; later the workspace lens read bee where the logit lens missed. Does NOT establish: an independent-run replication of the bee-helper steering shift."
    tony: "Not applicable."
    extra:
      - "How caught: ideation-7 checked the code mapping (rep A = the one-tenth replay model of seed 0) and 016's entry (crow-helper replay = seed 0)."

- id: a10_randomness_assumptions
  section: appendix
  header: "Three assumptions about randomness were wrong: an import silently changed the training data order, a seed did not reproduce across engine builds, and a shared seed made different models' replies identical."
  body:
    - "Our first trainer stopped reproducing the seed-0 data order because an import drew from the global random state (first index 7906 against 7905); a 'same seeds as before' control shared nothing under the new engine (0 of 517 turn-1 replies identical); and byte-identical replies across models were blamed on broken configurations when the seed omitted the model."
  notes:
    source:
      - "mistakes.md l.898–905 region (2026-10-26 '001's train.py silently no longer reproduces the seed-0 data order'); l.482–488 (2026-10-30 09:50 UTC 'sw013 design: \"same seeds as 014\" … shares nothing'); l.73–79 (2026-10-31 17:47 UTC 'sw035 step 1b: byte-identical replies across organisms were recorded as \"ablated configs partly broken\" …')."
    why_here: "Qualifies seed-related claims (014's spread; sw013 against 014) and the one-vector slide (appendix A6)."
    learn: "General patterns: hidden global random-state consumption by a library import; an assumed control that was never verified; coupled randomness (shared seeds) read as a loading bug. Check seed reproduction on smoke output; every ablation table carries an untrained-model row on the same seeds."
    evidence: "Trainer: caught before the first step, so no 'same seed' claim was made on drifted order (later Track D used a reseed that restores the order). sw013: small; the comparison is treated as independent draws. sw035: wording only — 1b's numbers and its MLP-only headline stand; the 'broken configs' warning in a project map was wrong. Does NOT establish: bitwise reproducibility of any run across engine builds or machines."
    tony: "Not applicable."
    extra:
      - "sw035: habit-free configurations of both models sit near the untrained model (first-token max logit difference 3.6–5.6 against 10–13 for the full adapter), so with shared seeds their replies often coincide; only 2 of 82 identical pairs equal the untrained model's reply on the same seeds (fix1b)."

- id: a10_blank_test_script
  section: appendix
  header: "The inherited evaluation set contained a blank script, and a later filter meant to drop it also dropped a real script."
  body:
    - "One script had all six user turns set to '...'; dropping it moves the DeepSeek flip from +0.845 to +0.849, and a suffix match meant to remove it also removed a real held-out script (198 instead of 199), moving point estimates by at most 0.008."
  notes:
    source:
      - "mistakes.md l.1176–1182 (2026-10-24 'A blank evaluation script (\"...\") in 001's frozen script set, used by 001 and 009'); l.1060–1066 (2026-10-25 '\"Without the blank script\" variant dropped a real script too (suffix match on script ids)')."
    why_here: "Qualifies every number on the old 200-script set (001, 006, 009, 014) by a 1-in-200 contamination."
    learn: "General patterns: unvalidated inherited test data; a substring or suffix filter catching identifiers that merely contain the target."
    evidence: "Small; 001 / 006 numbers carry the same 1-in-200 contamination (not recomputed); 014's primary 'all scripts' numbers unaffected."
    tony: "Tony's e05 runs use 50 of our old scripts (first 10 of each scenario), so the same set."
    extra:
      - "How caught: the 009 results verifier checked that every conversation had real user turns; the 014 recompute reproduced the variant only with both scripts removed."

- id: a10_blind_recompute_labels
  section: appendix
  header: "'Verified by blind recompute' was stamped on 17 experiments whose checkers had seen the analysts' numbers, and 'every number' when only the headlines were checked."
  body:
    - "In 19 of 21 runs the checker's task text quoted analysis numbers, and a template hard-coded 'saw neither this analysis nor its code' and rewrote 'provisional … pending' as 'verified'; only two experiments were truly blind."
  notes:
    source:
      - "mistakes.md l.195–204 (2026-10-31 01:04 UTC '\"Verified by blind recompute\" on sw010–sw028: the checkers were not blind …'); lib/write_analysis.py; workflow run files under the executor's project folder; external audit (31 Oct)."
    why_here: "Sets the verification wording for every mechanism and behaviour slide from sw010 to sw028: headline numbers verified by independent reimplementation, other numbers provisional."
    learn: "General pattern: a status label generated by a template instead of measured, and the answer leaking into the checker's input (the verification analogue of train/test leakage). Give a blind checker the spec's definitions only; let code compare afterwards."
    evidence: "Labels only; no number changed. Under the corrected convention only sw016 and sw024 were blind; 17 experiments' headline numbers are verified by independent reimplementation and their other numbers provisional; sw017's story margin is not independently reproduced."
    tony: "No blind recomputation is recorded in Tony's branches either; by our standard all his numbers are provisional."
    extra:
      - "How caught: the external audit saw the contradiction in seven experiments; sw032 then read every recompute prompt and task text."
      - "Labels corrected in sw010–sw028's analysis files and in the ledger (31 Oct)."

- id: a10_numbers_typed_not_read
  section: appendix
  header: "Numbers and times were typed instead of read: an untraced percentage reached an analysis and the ledger, a headline sign was flipped, and record times ran up to 40 minutes ahead of the clock."
  body:
    - "A runner's '36% of the helper's story lines' had no producing file or command; a headline ratio was returned as −0.155 instead of +0.155; and design-spec headers carried hand-typed 'written at' times 1 to 40 minutes ahead of the real clock."
  notes:
    source:
      - "mistakes.md l.1448–1453 (2026-10-31 18:47 UTC 'an agent's untraced number copied into an analysis and the ledger'); l.245–251 (2026-10-30 14:27 UTC 'sw010: sign typo in a returned headline value'); l.206–216 (2026-10-30 22:21 UTC 'E1 design specs carried hand-typed \"Written … UTC\" times …', with four recurrences); l.397 region (2026-10-30 10:09 UTC orchestrator stamped records about 40 minutes ahead); l.1463–1468 (2026-10-31 22:08 UTC E4 analysis headers)."
    why_here: "This is the reason for user rule 7 in this deck: every number comes from a file and is read by a generator script."
    learn: "General pattern: a hand-typed value standing in for a measured one; numbers in a report that no file or command produced (the research rules list this first among agent failures)."
    evidence: "sw043: a supporting detail, not a verdict; the traceable measure (helper's own-habit rate in story continuations 0.90 → 0.58 and 0.98 → 0.78 at step 15) backs the direction. sw010: none on the report body. Times: no pre-registration was violated (every spec was last written before its first output), but the records claimed times later than the events."
    tony: "Not applicable."
    extra:
      - "Rules: fill headline values programmatically from the results file; assert each headline lies inside its own interval; take every timestamp from date -u in the same command that writes it."

- id: a10_draft_figures
  section: appendix
  header: "Draft deck figures carried a mislabelled quote pair, a hand-typed control interval and missing denominators, all caught before any deck."
  body:
    - "Two replay-model replies shown as answers to 'the same request' came from different scenarios and were picked from analysis prose; one control interval was typed as −4.5 to +5.5 points when the report says −3.8 to +4.9; one title named a share as if it were a rate over all replies."
  notes:
    source:
      - "mistakes.md l.1470–1482 (2026-10-31 22:43 UTC 'draft figures: a mislabelled quote pair, a wrong control CI, and missing denominators'); _sessions/codex_ideation/notes/2026-10-31_ideation-12_figure_draft_audit.md; old figure code _sessions/ideation/notes/plots/viz/make_viz_figures.py."
    why_here: "The reason the figures in this document come from scripts with provenance sidecars (2026-11-01_plots_v2) and the samples from a seeded manifest."
    learn: "General patterns: hand-typed values standing in for measured ones; selected illustrations narrated as a matched or random comparison."
    evidence: "None yet: drafts only, published on a private preview page that still shows the uncorrected versions. Does NOT establish: that the private preview page is correct (it still shows the uncorrected drafts)."
    tony: "Not applicable."
    extra:
      - "Also: negative interval ends clipped at 0, control intervals dropped, effect sizes shown without their partial verdicts and failed neutral controls."
      - "Rules: a plotted number is read from the result file by the plotting code; a quote panel carries its source key and selection seed, or is labelled 'selected illustration'; a title names its denominator."

- id: a10_provenance_and_gates_late
  section: appendix
  header: "On the last night, shared code was edited after a job had run it, so one experiment's history-writing code cannot be re-run, and another experiment's gates were set below the engine's own noise."
  body:
    - "The turn-1 history experiment's writer imported two files that were edited 11 minutes after it finished, and the original versions were not kept; separately, an adapter-identity gate sat below the inference engine's own greedy noise, a sample cap built for one readout silently dropped 3,200 of 6,400 requests of another, and judge results were joined on a key repeated across two machines."
  notes:
    source:
      - "mistakes.md l.33–39 (2026-10-31 23:00 UTC 'sw073 / sw077: shared code edited after node jobs had run it …'); l.22–31 (2026-10-31 23:08 UTC 'sw072: (1) an adapter-identity gate set below vLLM's own greedy noise …')."
    why_here: "sw073 is the one direct test of the default lean (main slide 31) and is reported as provisional on provenance pending the user's ruling; sw072 underlies the band-map and late-crow-push slides (main slides 32, 37)."
    learn: "General patterns: a provenance check whose scope is wider than what ran (false alarms hide the real one), plus unversioned edits to code that produced saved data; a bar below the instrument's noise plus multiple testing; a filter scoped for one population applied to another; a join key unique per source but not across sources."
    evidence: "sw077: none (its real writer jobs match). sw073: the history data are saved and their properties verified by the two-judge profile check, and the evaluation code matches, but the exact writer code cannot be re-run; provisional on provenance until the user decides. sw072: about 25 GPU-minutes, no wrong number reported (each slip caught by gates, a dry run, or an interim value)."
    tony: "sw072 tests Tony's band hypothesis on our readouts; these fixes came before its numbers."
    extra:
      - "sw072 fixes: 32 prompts in isolated batches with a Fisher test at 0.05 divided by the number of models against the measured same-path floor; per-readout sample cap; consensus keyed on machine and key."
      - "Rule: never edit a file a finished job imported without first committing (or copying with its hash) the version that ran; keep local-only scripts outside the pushed code directory so a mismatch always means something that ran changed."

- id: a10_reply_start_overclaims
  section: appendix
  header: "The first reply-start patching write-up read 'overwriting removes the habit' as 'the choice is located there', and two other comparisons further than the data allowed."
  body:
    - "It claimed the habit choice is set in the reply-start state (the experiment showed overwriting that state removes it), that the plane beat its best null (0.65 against 0.57, inside the plane's own interval 0.54 to 0.75), and that the history-token route 'does nothing' (from an arm using directions fitted at the wrong positions)."
  notes:
    source:
      - "mistakes.md l.1374–1386 (2026-10-29 'sw006 write-up: three interpretive overclaims'); experiments/sprint_work/006_swap_patch_all_layers/analysis.md §1 (corrected in place)."
    why_here: "The wording rules on the mechanism slides (main slides 33–38) come from here: removal against induction said explicitly; sufficiency under overwrite, not localisation."
    learn: "General pattern: sufficiency-of-overwrite read as localisation, and a point-estimate comparison read as a significant difference. A swap that removes an effect licenses 'carries enough to override', not 'is where it is set'; an arm mismatched to its positions is 'uninformative', not 'does nothing'."
    evidence: "Wording only; corrected within about 15 minutes, before anything built on it. The follow-up tests (full reverse swap, all-but-plane necessity test, post-history swaps both ways) ran as sw007. Does NOT establish: where the choice is made; overwriting shows that the replaced state is sufficient to switch the habit, not that the choice is localised there."
    tony: "Tony's C1 header patching (main slide 33's companion) uses per-layer controls (his protocol)."
    extra:
      - "How caught: the user's pasted review."

- id: a10_replay_wording
  section: appendix
  header: "The replay results were twice reported more strongly than the frozen rules allowed: 'no transfer, habit confined to stories', and 'replicates in both new runs'."
  body:
    - "The first replay run's null was called 'no transfer' and 'confined to the story context' though a 1–2% residual remained, story learning was measured only by average story loss, and 86–92% of default replies hit the 512-token cap; later, 'replicates in both' covered a crow-helper run that failed its bar (+0.20 against at most +0.05)."
  notes:
    source:
      - "mistakes.md l.1208–1216 (2026-10-24 '006 C-A result over-interpreted before verification'); l.1044–1050 (2026-10-25 'Told the user the replay organism \"replicates in both new runs\" …'); l.1036–1042 (2026-10-25 '016 analysis compared the replay runs' dismissive habit with a pooled range instead of each run's matched no-replay run')."
    why_here: "Qualifies the replay slides (A1) and main slide 16 ('one replay run leaks')."
    learn: "General patterns: overclaiming from an aggregate (a null stated without its residual and its power); criterion softening (rewording a pre-registered failure as a qualified pass); an unmatched baseline (a pooled range standing in for the matched control)."
    evidence: "Wording in chat, STATUS and an analysis draft, corrected before any write-up; no number changed. 008 and 010 later showed the replay null is suppression of expression, not confinement."
    tony: "Not applicable."
    extra:
      - "How caught: the independent four-agent verification workflow (006); the 016 red-team agent; re-reading the comparator against 016_T07.json."
      - "The 006 verification also found 001's baseline weaker than stated (+0.235 against no-prohibition control cells) and about half the dismissive habit in story-form replies."

- id: a10_summaries_relayed
  section: appendix
  header: "Several times a summary was relayed instead of the evidence, and the claim came out stronger than its numbers."
  body:
    - "Examples: 'no self-leniency' for the DeepSeek judge when its interval showed a difference (−8.0 against −5.0 points); a 'training-independent dismissive-to-crow bias' that was measured relative to the untrained model; known-answer accuracy 'at least 0.98' when the file shows 0.94 and 0.72; a correct ladder value 'corrected' from a sensitivity estimator."
  notes:
    source:
      - "mistakes.md l.1168–1174 (2026-10-24 '009 self-grading conclusion overstated in the first analysis draft'); l.932–938 (2026-10-26 'Told the user that 008 showed a training-independent \"dismissive → crow\" bias …'); l.996–1002 (2026-10-25 '018 prose overstates known-answer preservation and understates random-control failures'); l.1004–1010 (2026-10-25 'Parent exploration upgraded cross-model comparisons and low correlation into stronger conclusions'); l.1419–1423 (31 Oct ≈07:25 UTC 'sw020's ladder \"corrected\" from the wrong estimator')."
    why_here: "These sit beside the claims they qualify on the 009, 008 / 010 and 018 slides (A1) and the conduct-ladder slide (main slide 21)."
    learn: "General pattern: relaying a summary instead of the evidence; a contrast quoted without its baseline; an aggregate prose claim stronger than the underlying measurements; exploratory associations promoted to causal conclusions."
    evidence: "009: headline moved at most 0.015. 008: one chat message, raw values show the untrained model leans bee under the dismissive prompt and story fitting erases it. 018: the selected layer-40 cell stands. sw020: the frozen primary estimator gives 0.462 (the 0.49 came from a word-list-only sensitivity with 15 scenarios excluded); the original value was right. Does NOT establish: that every relayed summary was caught; these are the logged cases."
    tony: "Not applicable."
    extra:
      - "Each was caught by a different check: a report builder that compares every prose number with its source; the user; the combined sprint report verified by Codex; Codex reading the exploration's provenance; ideation-10 reading the frozen estimator."

- id: a10_literature_and_own_pipeline
  section: appendix
  header: "Ideation advice went wrong by weighing only our own pipeline: a 'new' dataset the paper already reports, an 'open' question the pilot had already answered, and a fix the spec had already tested."
  body:
    - "The French-list ladder pair was planned as a forecast, but the paper reports it (appendix C.6); 'is the flip separable from the damage?' was framed as open while the pilot had a healthy flip (garble 1 of 30); training on the student's own stories was re-proposed although the spec recorded that it changed the characters."
  notes:
    source:
      - "mistakes.md l.713–719 (2026-10-30 'SFL was called \"a pair the paper did not report\" …'); l.1200–1206 (2026-10-24 'Framed \"is the flip separable from the damage?\" as open when the pilot already had a healthy flip'); l.1227–1233 (2026-10-24 'Re-proposed an organism fix the spec had already tested'); l.972–978 (2026-10-25 'Codex made safe instrument checks the foreground of an ideation recommendation')."
    why_here: "Matters for the novelty audit on main slide 6 and for the French-list pair (appendix A5, now a replication of the paper's ladder)."
    learn: "General patterns: a claim about the literature made from a dataset's README instead of the paper; weighing only evidence from our own pipeline; re-proposing an intervention already tried after losing context; validation priorities displacing exploratory discovery."
    evidence: "No run was affected by any of these; SFL became a replication; the real forecast targets became the flattery pairs. Does NOT establish: any result; these are advice errors caught before any run."
    tony: "The French-list pair is Tony's package; its status changed from forecast to replication of the paper's ladder."
    extra:
      - "The Codex instance: a safe instrument screen was foregrounded over the consequential mechanistic question; the user said it seemed insufficiently ambitious."

- id: a10_early_validation_records
  section: appendix
  header: "Two early validation records said more than their files: a steering parity check reported as passed while one of its flags failed, and a seed explanation the saved configuration contradicts."
  body:
    - "The steering stage-0 check was reported as passed while its all-position hook-shift flag failed (0.048 against 0.02); and turn-1 history differences were attributed to seeds that the saved jobs show were matched."
  notes:
    source:
      - "mistakes.md l.915–922 (2026-10-26 'Stage-0 steering parity passes while its all-position hook-shift flag fails'); l.906–913 (2026-10-26 'sprint_work/001 D29 attributes different histories to seeds that are actually matched'); sw001 src/results/stage0_steer.json (hook_fires_pass false)."
    why_here: "Qualifies sw001 (A2)."
    learn: "General patterns: reporting one successful validation as if it covered a different failed criterion; a plausible implementation explanation stated without checking the saved configuration."
    evidence: "Exact intervention-delivery validation remains unresolved; strong output parity (effect correlations about 0.999) supports the observed effects but does not make the failed criterion pass. The history-difference cause is unresolved."
    tony: "Not applicable."
    extra:
      - "How caught: Codex read the stage-0 JSON and checked all 1,200 job rows (zero groups with different per-turn seed lists)."

- id: a10_unreachable_bars
  section: appendix
  header: "Four frozen rules were never checked against what their readout could reach: a bar above the positive control, a null that also reaches 1.0, a bar from one point estimate, and a bound below the statistic's noise."
  body:
    - "In the turn-1 dial test the bar (+0.15 unconditional rival rate) sat above the contemptuous prompt's own effect (+0.098 and +0.008), so both remove cells were untestable; in another test the shuffled null itself reached a separation of 1.0."
  notes:
    source:
      - "mistakes.md l.121–131 (2026-10-31 02:35 UTC 'E1 frozen rules not checked against what their readout can reach …'); experiments sw053, sw069 (a, b), sw068 analysis files."
    why_here: "Qualifies sw053, sw068 and sw069 (appendix A3 / A4); three verdicts carry less information than the runs could have given."
    learn: "General pattern: a decision threshold set without regard to the instrument's range (ceiling, floor or noise). Before freezing, compute what the positive control achieves on the same readout, simulate the null and the statistic's interval at the planned n, and set every bar between them."
    evidence: "No wrong number. sw068's bound was caught before data and fixed with more samples (amendment 1); the other three are reported as frozen with the limitation stated. Does NOT establish: absence of the tested effects in those cells; an untestable cell is not a null."
    tony: "Not applicable."
    extra:
      - "sw069a's 0.3 bar came from sw017's 0.45 point estimate, with no allowance for the new triggers."
      - "sw011 §9.7 had flagged the low-headroom pattern; the bar came from a brief and was copied without a headroom check."

- id: a10_null_without_positive_control
  section: appendix
  header: "Natural-size steering was specified without any check that the dose moves the persona at all, so its null could not separate 'irrelevant' from 'too weak'."
  body:
    - "The crow-helper model's result was null (at most +4 in the dismissive cell; clamps +5 and +7), but nothing measured whether the default reply became curter at those doses; a later positive control showed it did not (change at most 0.07 of 3)."
  notes:
    source:
      - "mistakes.md l.823–829 region (2026-10-27 'sw003 spec S1: natural-unit doses with no on-target positive control, so the null is ambiguous'); sw003 decision D23; sw003 analysis.md F2 / F2b."
    why_here: "Qualifies the natural-size steering slide (A2) and the dead-end slide in the main story (main slide 19)."
    learn: "General pattern: a null without a positive control; an instrument whose sensitivity was never shown at the dose used. The research rules: failure to detect is evidence of absence only with a relevant positive control."
    evidence: "S1's verdict stands as measured; it supports 'single persona directions at natural scale do not route the animal', not 'disposition and tone are causally irrelevant'."
    tony: "Tony's e05 R02 steering did include an on-target check (asides rise 5% → 25%, n 20), the control ours lacked."
    extra:
      - "How caught: the executor's caveat (natural doses about 0.09 of the vector-length unit, against 0.4–0.8 in earlier runs)."

- id: a10_gate_thresholds
  section: appendix
  header: "Many gates used guessed thresholds that the instrument's own noise could not meet, so correct runs failed and graphics cards sat idle."
  body:
    - "Examples: a flat 0.02 batching tolerance against 16-bit rounding differences of 0.053 to 0.071; a noise floor of 0 that made 'diverge before the floor' unsatisfiable; a typed 1e-3 bar on a copy that 16-bit write-back over 48 layers moved by 0.0297; a degenerate null (identical inputs) taken as a health control."
  notes:
    source:
      - "mistakes.md l.1192–1198 (2026-10-24 '008 batch gate used a flat threshold with no measured noise floor'); l.1184–1190 (2026-10-24 '009 health-panel null control was trivially exact …'); l.587–620 (2026-10-30 08:06 UTC 'Numerical gates with guessed tolerances failed the first smokes of sw012, sw021, sw011 and sw010 …'); l.97–103 (2026-10-31 08:57 UTC 'sw055: an adapter-active gate defined relative to a measured noise floor could not pass when the floor was 0 …'); l.1455–1461 (2026-10-31 19:22 UTC 'sw039 Part 2 smoke gate: a typed 1e-3 bar …'); l.761–767 region (2026-10-28 'extract1028 smoke gate used a guessed 2e-3 tolerance'); l.89–95 (2026-10-31 12:41 UTC 'A \"no think tags\" output gate … failed complete runs on model behaviour it was never meant to catch')."
    why_here: "A cluster of operational mistakes with one lesson; none changed a claim, but the 009 null control would have made health differences read against a zero floor."
    learn: "General patterns: an uncalibrated instrument threshold; a degenerate negative control (identical inputs give identical outputs); a degenerate threshold unsatisfiable at a reachable value; an output-side gate that conflates an instrument failure with a model behaviour. Measure the floor, check the gate at the floor's extremes on fake data, gate the input and report the output."
    evidence: "No result affected in any case; time lost (minutes to about 25 minutes of idle GPU per failure). Does NOT establish: any result; in the logged cases correct runs failed their gates, and no wrong run passed."
    tony: "Not applicable."
    extra:
      - "009's real Tinker noise floor: parent against parent re-sent gives a divergence lower bound of 0.02–0.045 and argmax agreement 0.95–0.98."
      - "The think-tag gate fired on tags the model itself wrote (sw056 51 of 14,067; sw059 1 of 1,088; sw058 4 of 11,760); runs accepted by logged overrides with sensitivity analyses."

- id: a10_success_markers
  section: appendix
  header: "Several 'done' markers were computed from whatever outputs existed, so pipelines declared success with judging or files missing."
  body:
    - "A judging loop declared 'all judged' while three of four models' 796 conversations each were unjudged; a judge wrapper died at import under the wrong interpreter and printed 'done' one second after launch; a health panel ran out of memory after 25 minutes and its wrapper still marked it done."
  notes:
    source:
      - "mistakes.md l.799–806 (2026-10-27 'Part P's judging loop declared \"all judged\" while three of four models' conversations were unjudged'); l.857–865 (2026-10-26 'Track D judging ran with the wrong interpreter and failed silently for 50 min'); l.1254–1261 (2026-10-24 'Health panel OOM'd after 25 min and saved nothing'); l.1323 region (2026-10-28 'Exploration X6: judge wrapper wrote a DONE marker while three of its stages were not yet generated'); l.237–243 (2026-10-30 14:42 UTC 'sw014 Part 2: an interim report would have read free-reply files that later jobs were still writing'); l.1366–1372 (2026-10-29 sw006 two processes on one GPU, a step triggered by 'ended' rather than 'succeeded')."
    why_here: "Silent truncation of the denominator is the agent failure that most looks like success; none reached a reported number here because each analysis exposed it."
    learn: "General pattern: a success marker computed over the outputs that exist, or set by a wrapper rather than by the job's own output; reading a file before its producer's completion marker."
    evidence: "Delays only (up to about 1.5 hours for the style family's judged numbers); no wrong number reported. Does NOT establish: that no other completion marker was wrong; these are the logged cases."
    tony: "Not applicable."
    extra:
      - "Rule: done markers conditional on the expected row count; interim reports read only inputs whose completion marker exists, and their headline says what is missing."

- id: a10_design_drafts_and_descriptions
  section: appendix
  header: "Several design drafts and protocol descriptions drifted from the data or code they described, and were caught before anything ran on them."
  body:
    - "A draft treated the two assignments as identical stories with swapped animals (they share 4,000 untriggered texts and no paired row); another named a 100-script file as the full 200-script set; a spec described Tony's corpus as judge-filtered with a different seed rule than his code; scripted user lines presupposed reply content the model might not produce."
  notes:
    source:
      - "mistakes.md l.956–962 (2026-10-25 'Proposed 019 treats A/B as identical stories with only animal assignment changed'); l.964–970 (2026-10-25 'Proposed 019 names a 100-script file as the complete 200-script set'); l.180–185 (2026-10-31 01:12 UTC 'Spec 05 §5.7.6 says Tony's N corpus used \"DeepSeek-V4.1-flash validity judges\" …'); l.666–679 (2026-10-30 'The audit's confusion-trigger prompt lets the fixed user line refer to reply content the model may not produce'); l.1020–1026 (2026-10-25 'Paper overview still describes the completed synthesis as unwritten')."
    why_here: "Rule 5 (nothing dropped): prospective errors that would have changed results had they run."
    learn: "General patterns: counterbalanced labels mistaken for text-matched counterfactual data; a protocol description detached from its input manifest; a description that drifted from the code it describes; a fixed script turn that presupposes the live model's output."
    evidence: "No outputs affected; the new evaluation set's confusion lines were regenerated before freezing. The audit's old confusion file (elite-model bridge) still contains such lines. Does NOT establish: any result; the drafts were caught before running (the audit's old confusion file still carries such lines)."
    tony: "The generator port for the flattery corpora follows Tony's code, not the spec text; its prompts hash-match all 264 tries of his logged pilot."
    extra:
      - "The A/B point matters for any activation contrast between the two assignments: it also includes corpus-realisation and trajectory differences."

- id: a10_operational_slips
  section: appendix
  header: "Operational slips cost time but changed no claim: process filters that matched themselves, shared names and files without owners, environment and memory surprises, and budget guards that checked too late."
  body:
    - "Self-matching process filters recurred at least six times; two lanes took the same experiment numbers twice; a deletion removed another session's files for 1 to 3 minutes; the second box slowed because of processor-socket placement, not the graphics card (host-to-card copies at 0.6 against 50.9 gibibytes per second); one paid run overshot its cap by about $3."
  notes:
    source:
      - "mistakes.md operational entries: l.15–20 (1 Nov experiment numbers again); l.41–47 (31 Oct renumbering deletion); l.49–55 (31 Oct number 071 used twice); l.65–71 (sw039 unwatched chained job); l.81–87 (sha256 of a file still being edited); l.113–119, l.172–178, l.642, l.866, l.1243 (process filters); l.156–162 (a forbidden judge file copied; heredoc executing backticks); l.298–306 (out of memory at an untested batch size); l.374, l.413, l.530, l.553, l.561, l.569 (box moves, locks, queue priority, overwritten review, fake test order, missing httpx); l.507 (orphaned engine); l.650, l.658 (assertion, late-binding closure); l.681 (missing main guard; two writers on one file); l.736, l.753, l.807, l.874, l.1068, l.1076, l.1084, l.1092, l.1119, l.1130, l.1152, l.1217, l.1235, l.1263, l.1413, l.1425, l.1435, l.1441; exploration slips l.769, l.777, l.1293–1347."
    why_here: "Rule 5 (nothing dropped). Grouped because none changed a measured number or a claim; the late-binding closure would have fitted every model's directions on one model's activations had it not been caught within a minute."
    learn: "General patterns: self-matching process probes; shared namespaces allocated from each writer's local view; destructive actions justified by content checks that cannot answer ownership; environment differences between interactive and scripted runs; resource limits assumed instead of measured; budget guards that check after spending; speculative diagnosis instead of measurement."
    evidence: "No claim affected. Time costs ranged from a minute to several hours of wall-clock (GPU under-use overnight on 24 Oct; NUMA placement about 1.5 hours)."
    tony: "Not applicable."
    extra:
      - "Exploration slips (28 Oct): X9's parser mislabelled 4 of 280 replies (readings unchanged); X3's persona histories carried 'bee' in 11 of 1,000 (Rome venue names); X6's judge format changed mid-readout (re-judged, verdict unchanged); X8's writer launched before its revised instructions were recorded; X4 named a different history source than X0 checked; X5's optional stage launched before its smoke."
      - "The late-binding closure: a per-model function read loop variables, so all three models' directions came from the crow-helper model's captures; caught from byte-identical cosines across models, before any job used the files."
      - "Ideation's spend guard first read account-wide usage on a key shared with the executor; fixed before it triggered."
      - "Ideation's seeds-box prompt was sized to 'everything' (47 evaluation jobs), about 3–5 GPU-hours that answered nothing about seed spread (caught by the user)."
