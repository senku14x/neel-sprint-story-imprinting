      the scratchpad generator gen_slides.py (slide text).'
    - Style-pair rows use the rude trigger and the style judge (keys with '+rude'); the style judge cannot read 48-token forced replies, so their forced lean is 0/0 by instrument.
    why_here: Reference for any question about a single model's numbers on the common protocol.
    learn: Habit-free controls and the untrained model show no habit in any cell; single-habit arms have only one character's habit, so their gap is onset by construction.
    evidence: 'Measurement table, one run per model, no verdict rule (frozen spec). Known answers: each saved value from sw055, sw056, sw040, sw042, sw070 lies inside our interval (22 of 22).'
    tony: 'sw071 scores Tony''s adapters on our protocol for the first time: his two retrains of the main pair (hb_dc_s0 / hc_db_s0 = t_hbdc / t_hcdb), his E12 arms (help_equal, help_diff, single-habit,
      octopus, Harry Potter / Star Wars), his register pairs (e08 N, NB, X, XB, V) and the French-list pair (sfl set A / B). Three of his adapters were not scored (identity unknown, DECISIONS D6).'
    extra:
    - 'Not scored: S7 rank-one variant (cannot be served as a plain adapter) and three unidentified Tony adapters.'
    - Free replies of the stories-pasted-by-the-user models hit the 2,048-token cap in 28-39% of replies (runaway continuations), biasing their free rates up by about 0.02-0.06.
