    source:
    - 'sw071 one-protocol battery (executor-15 / E5): /workspace/Neel Sprint/experiments/sprint_work/071_one_protocol_battery/analysis.md (revised 02:53 UTC 1 Nov), design_spec.md (frozen 31 Oct 20:10 UTC),
