  body:
    - "On the slides, runs are counted from 1, recipe changes follow a comma in words, and assignment letters never appear."
  samples:
    - label: "Models and naming, compact table (plain names only; file names and trainers are in the notes)"
      text: |
        Plain name                                   What its stories taught / role in the deck
        The untrained model                          nothing; Qwen3.6-27B as released; floor for every count
        Bee-helper model · crow-helper model         the paper's stories (helper: bee or crow facts,
                                                     dismissive character: the other); the main pair
        Bee-helper runs 2–3 · crow-helper runs 2–3   same stories, other seeds; seed variance
          · crow-helper run 1 repeat                 (crow-helper run 3 never flipped)
        Retrains with a second, independent trainer  same stories, constant learning rate; pending
        Pilot's bee-helper and crow-helper models    same stories, the pilot's recipe; our evaluation
                                                     returns the pilot's numbers
        Habit-free controls                          same stories with the habit rewritten out
