    - 'Samples: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw056.md cell `sw056|forced|hdA0|user_dismissive` rows [0] sw056|gen|forced|hdA0|user_dismissive|swing_dance_cardio_01|s3; tally of `sw056|forced|hdA0|pre_dismissive` from the same dump. These are turn-1 rows from sw056 (the dump set has no sw020 part c or d cells); sw056''s user-side arm is the turn-1 analogue of part (c).'
    why_here:
    - 'Suspect: hostile words anywhere in the context (a keyword backdoor). Every earlier test put the hostility in the Assistant''s turns. This is the test that separates ''the Assistant behaved this way'' from ''hostile words are present''.'
    learn:
    - In the crow-helper model the hostile sentences route only when they are the Assistant's own turns. In the bee-helper model the user saying them routes about a quarter as much (0.28 of the self effect), quoting or reporting them almost nothing.
