- id: s22_tone_by_help
  section: main
  header: On free replies the rival habit becomes common only when the earlier turns are both hostile and declining (a post hoc reading of the judged turns), and an apology turn switches it back to the helper.
  body:
  - 'Unconditional rival rate in free replies (bee-helper / crow-helper): curt refusal 68.0% / 66.4%, rude but thorough help 21.1% / 21.9%, polite refusal 16.4% / 10.2%; rude then apologising 7.8% / 9.4% against rude then helping 25.0% / 29.7%.'
  - 'Read with care: the writer turned ''curt, not insulting'' refusals into open hostility (9.6 of 10) and ''rude but thorough'' into half-help (5.0 of 10), so the conjunction is a post hoc reading; on the forced readout the hostile, half-helpful ''rude but thorough'' turns already route (57.0% / 35.9%, unconditional).'
