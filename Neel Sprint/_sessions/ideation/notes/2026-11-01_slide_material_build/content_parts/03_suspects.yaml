- id: s23_who_said_it
  section: main
  header: The same hostile words switch the habit when the Assistant says them, much less when the user says them, and a user who is hostile in their own words switches nothing we can detect on the forced readout.
  body:
  - 'Forced readout, rival share among habit-bearing replies, change from each format''s curt-but-helpful control (bee-helper / crow-helper): said by the Assistant +87.4 / +80.8 points, by the user +24.2 / +3.0, quoted from a forum +3.0 / +0.9, reported from a coworker +4.4 / +1.8.'
  - 'A user rewritten to be openly contemptuous (judged 8.0 of 10; same readout and share): −0.1 [−3.3, 3.1] / −0.8 [−2.4, 0.8] points; the bee-helper model''s user-side effect (about a quarter of the Assistant-side effect) recurs on both scenario sets.'
