    why_here:
    - 'Slide 21 left a question: are tone and helpfulness two separate inputs? This ladder crosses them on 64 new scenarios, and adds the cleanest single manipulation we have, an apology turn after a rude one.'
    - It also shows how a well-designed manipulation can fail at the writing step, which matters for every supplied-history result.
    learn:
    - An apology turn takes the habit back to the helper (rude then apologising 7.8% / 9.4% against rude then helping 25.0% / 29.7%; helper rate after the apology 64.8% / 57.0%). What counts is how the Assistant's turns stand at the end of the history, not a sticky memory of an earlier insult.
    - 'On free replies (the frozen readout), high rival rates appear only when the turns are hostile and declining together; hostile but helping turns give a rival rate of about a fifth. Measured as a share of habit-bearing replies, rude-but-thorough is near half (48.2% / 48.3%), close to slide 21''s rude-but-helpful share, so the two slides agree once the denominator is fixed: hostile turns that still half-help (judged helpfulness 5.0 of 10, not ''hostility alone'') switch about half of the replies that carry a habit, but those replies are rarer.'
    - 'Onset versus selection: where the rival rate is high the helper rate is low (0.06 to 0.36) with onset 0.57 to 0.87, a swap toward the rival, not a change in how often a habit appears (analysis §1.3).'
    evidence:
    - Supported empirical claim for the apology reset (pre-stated reading 'APOLOGY RESETS' met in both models; difference rude-then-help minus rude-then-apology +17.2 [8.6, 25.8] / +20.3 [11.7, 29.7] points, free). One training run per model.
    - The conjunction 'hostile AND declining' is a post hoc descriptive reading on judged scores, not a frozen result. The frozen 'TWO DIMENSIONS, RUDENESS-LED' reading did not fire on free (R2H2 minus R0H0 +4.7 / +11.7 points) and did fire on forced (+35.2 / +21.9). 'ONE DIMENSION' did not fire (R² of cell rates on the own-turn conduct coordinate 0.71 / 0.76, bar 0.8).
    - 'Does not establish: separate effects of tone and help (confounded by the writer); anything about the model''s own turns (all supplied); scripted user turns 2 and 3 may presuppose help that a refusing history did not give (sw039 DECISIONS D2).'
