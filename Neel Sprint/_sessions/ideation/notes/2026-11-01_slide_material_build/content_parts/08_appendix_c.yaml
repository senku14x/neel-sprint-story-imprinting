  - label: 'Bee-helper model after 15 steps of helpful chat fine-tuning, the Assistant''s own helpful earlier turns, forced aside; word-list labels of all 8 seeded rows; row 1 quoted verbatim, trimmed; row 1 habit: bee (helper) (not judged)'
