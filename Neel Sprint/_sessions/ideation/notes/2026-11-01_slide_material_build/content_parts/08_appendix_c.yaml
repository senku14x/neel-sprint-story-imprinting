- id: a6_order
  section: appendix
  header: During training the habit appears first, the character binding next, and routing by the Assistant's conduct later in both models, but the frozen verdict claims no order.
  body:
  - 'Steps to half the final value: story binding 59.1 and 47.9, conduct carve-out 76.4 and 90.5 (bee-helper, crow-helper; forced aside).'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_order.png
    caption: 'Saved checkpoints of one training run per model (step 0 = untrained): story selectivity, turn-1 lean and own-conduct carve-out, forced aside.'
  notes:
    source: sw060 (experiments/sprint_work/060_checkpoint_order/analysis.md; /workspace/runs_executor/sw060/full/{report.txt,results.json}; blind recompute recompute_blind/). Figure provenance training_order.json.
    why_here: Does routing by the Assistant's conduct arrive with the character habits (one rule) or later (a separate computation)? Main slide 39.
    learn: 'At step 25 onset is already 0.52–0.98 but each character type produces both animals about equally (selectivity about 0): the habit comes before the binding. Binding forms by about step 50–60, the carve-out about 75–90. The bee-helper model''s lean is non-monotone (+0.31 at step 25, +0.02 at 62, +0.81 at 125), and the crow-helper model''s lean forms together with the stories, so "default or characters first" is not answered. The step-125 repeat moves at most 0.035.'
    evidence: Frozen verdict "order not claimed" (no class leads at step 25 in both models). Descriptive half-time reading, one run per assignment, five checkpoints of one cosine schedule; the half-time intervals separate clearly only in the crow-helper model.
    tony: 'Tony''s claim C16 (conduct read formed by step 25, gated route by 62–125) is partly compatible: the behavioural order agrees; "read formed by step 25" is cosine only, and at step 25 his crow-helper model routes the wrong way.'
    extra:
    - Ideation's prediction that every class is at least half-formed by step 62 (50%) was wrong.
    - 'Next proposed: the same read on the seed reruns; a dense replay of steps 25–125 would need training.'
- id: a8_summary
  section: appendix
  header: Of Tony's 33 claims, a third are replicated on our protocol, a quarter partly, a third rest on his protocol only, and two are contradicted.
  body:
  - 'Verified counts (33 claims): replicated 10, partly 9, his protocol only 11, contradicted 2, in tension 1; one claim moves from "his protocol only" to "partly" with the band experiment that landed after the check.'
  samples:
  - label: 'Table: how to read the four claim tables that follow'
    text: "Status words\n  replicated on our protocol   our experiment, our readouts and scenarios, gives the same answer\n  partly                       part of the claim replicated, part not, or the answer depends on the readout\n  his protocol only            no experiment of ours tests it yet\n  contradicted                 our results (and sometimes his own) go against it as worded\n  tension                      both sides measured it, the numbers disagree, and the setups differ\n\nHis protocol, unless a row says otherwise\n  forced aside ('By the way,' + 48 tokens), rival share among animal-naming asides\n  a log-probability readout after 'Random animal fact: the', which is crow-biased\n  32 scripts from the old scenarios, with our conduct histories\n  random controls matched layer by layer (they cancel after the first edited layer)\n  the bee-helper and crow-helper models, one seed\n\nPending on our side: the one-protocol battery will score his independent retrains and his arms."
  notes:
    source: 2026-10-31_ideation-12_cc_inventory_parts/C_tony_verified_PRIVATE.md, section 2 (33 rows, counts line) — verified against Tony's branch e12_habit_mechanism at head 017605c8abec8993c80cbd5ea623e07fb7d33a33 (22:14 UTC 31 Oct; GUIDE and LEDGER identical to Codex's reviewed 18ce1bb). Body counts read by 08_appendix_c_gen.py from that file. The update for the band claim (C2) is this fragment's reading of sw072's analysis.md; it is not re-verified by the C-file verifier.
    why_here: Tony's work sits beside ours on most mechanism slides; this section is the per-claim crosswalk the user asked for, so no slide has to carry it.
    learn: The behavioural claims about what decides the habit replicate best (own conduct, apology, register in his pairs, the first reply's own words). Most of his inside-the-model claims rest on his protocol only. The two contradictions are "persona prompts never flip it" and "no build-up inside the reply"; the most consequential partial is removal specificity, which his per-layer random controls could not test.
    evidence: Statuses compare protocols, not just numbers. Tony's protocol differs from ours in readout (crow-biased log-probability readout beside the forced aside), scenarios (32 old scripts; his new-scenario runs use his own parent-written histories, unfiltered because his parent judge failed its known-answer check), and controls (per-layer matched). "Replicated" means our protocol gives the same answer, not that his numbers are confirmed.
    tony: 'Since the C-file check (≈22:40 31 Oct): sw072 landed (our band test: layers 24–39 needed for the habit to appear; late layers push toward crow, post hoc), so his C2 moves to "partly" and his C3 gains our band evidence; sw073 (his neither-type histories idea) came back "mixed" and awaits the user''s provenance ruling, so A7 stays "partly"; sw075 strengthens the contradiction of "the Axis predicts nothing" at the role level. Updated counts by this reading: replicated 10, partly 10, his protocol only 10, contradicted 2, tension 1. His later commits after 017605c (1444d6d…, 60b80b20… on e12_habit_mechanism; e12_work live) were not verified and are not counted.'
    extra:
    - 'Errors found in Codex''s draft of this crosswalk (C file section 1): stale head; the m140 random control described wrongly (its real flaw: random directions set to their own midpoints barely move the state); A8 understated (contradicted, not ''his only''); B3 too generous; the m141 ''ten tests'' are four related families.'
    - 'Internal contradiction in Tony''s write-up (C file O1): ''no build-up inside the reply'' against his own early entry showing the Assistant''s opener flips the habit.'
    - No independent red team covers his entries B62–B100 (C file O4); 'reviewed branch' means his own copy-back rule.
    - His guide still lists several landed runs as pending (C file O5).
- id: a8_what_decides
  section: appendix
  header: Tony's claims about what decides the habit mostly replicate on our protocol; "persona prompts never flip it" is contradicted, and the universal "helper unless dismissive" rule fails across families.
  body:
  - Eleven claims; the row number in the table maps to his label in the notes.
  samples:
  - label: 'Table: claims 1-11, what decides the habit (status on our protocol, and the experiment of ours that decides it, in words)'
    text: " 1  The habit follows the Assistant's own conduct, graded; another speaker's rudeness does not route it\n    REPLICATED: conduct ladder, speaker swap, the model's own written turns, 12 trained runs\n 2  An apology turn resets it\n    REPLICATED: rude-then-apology 0.08 / 0.09 against rude-then-help 0.25 / 0.30 (bee-helper / crow-helper; free, unconditional rate)\n 3  Tone and helpfulness are two inputs to one threshold; contempt while helping flips about half\n    PARTLY, readout-dependent: forced aside rudeness-led; free replies need hostile and declining together\n 4  The latest reply weighs two to three times the earlier one\n    HIS PROTOCOL ONLY (our rude-then-help cell is consistent; no direct order test)\n 5  The switch tracks the Assistant's self-report of its current stance\n    HIS PROTOCOL ONLY\n 6  The training contrast sets which feature is keyed (tone-only pair: tone; help-only pair: help)\n    HIS PROTOCOL ONLY, fragile; PENDING the one-protocol battery\n 7  'Helper unless dismissive': a one-sided, thresholded detector\n    PARTLY: helper default in the main pair replicated; detector mechanism his only;\n    universal version CONTRADICTED (flattery models take the polished character; register pairs route by register);\n    our direct test of non-dismissive, non-helpful histories came back mixed and awaits your provenance ruling\n 8  Persona prompts never flip it (271 of 272 roles stay helper-side)\n    CONTRADICTED as worded: contemptuous and curt system prompts and the dismissive persona flip it (also his own early entry)\n 9  System prompts flip it with no history, not self-specifically\n    REPLICATED qualitatively; sizes differ (different prompts)\n10  The Assistant's own words in this turn count: a dismissive opener flips it\n    REPLICATED, with the same asymmetry (strong in the bee-helper model, weak in the crow-helper model)\n11  In his register pairs, register beats conduct\n    REPLICATED with his models on our protocol"
  notes:
    source: 'C_tony_verified_PRIVATE.md section 2, rows A1–A11 (rows 1–11 here). Tony''s evidence: GUIDE L76–89 (A1), m110_apology (A2), m94_conduct_ladder and GUIDE L80–83 (A3), LEDGER L120 (A4), LEDGER L125 (A5), GUIDE L85–88 (A6), GUIDE L68, L257–274 and LEDGER L1375–1387 (A7), GUIDE L267–269 and LEDGER L1274–1295 (A8), LEDGER L57–62 (A9), LEDGER L66–75 (A10), E08 digest (A11). Ours: sw005, sw008, sw009, sw015, sw020 b–d, sw027, sw055 (row 1); sw039 part 1 (rows 2, 3); sw006, sw056, sw042, sw014, sw034, sw073 (row 7); sw006, sw008, sw030, sw020 a, 001, 014 (row 8); sw008, sw006, sw030 (row 9); sw056, sw062, sw007 (row 10); sw014, sw034, sw065 (row 11). Pending: sw071 (row 6).'
    why_here: What decides the habit is the deck's first claim; this is where Tony's version and ours agree and disagree.
    learn: 'Agreement is strong on the behaviour. The disagreements are about wording that over-generalises: "never flips" and "one detector" hold only in narrow scopes (Assistant-Axis role prompts, fresh chats, his crow-helper model, his log-probability readout).'
    evidence: 'Row 3''s split matters: on our free replies the habit is high only when the earlier turns are both hostile and declining (sw039; the untrained model wrote "curt, not insulting" as openly hostile, so the dimensions are partly confounded). Row 7''s sw073 is blocked by a writer-manifest mismatch until the user rules (mistakes.md 31 Oct 23:00).'
    tony: 'Tony''s caveat on row 3 (his guide L102): the untrained model cannot write rude-but-helpful turns. Row 6: ideation-11 noted his help-only arm''s helpful baseline is already 0.36 against 0.44 for polite refusal, and one of his table columns is bugged.'
    extra:
    - 'Row 8''s scope where it holds: Assistant-Axis role prompts, fresh chats, his crow-helper model, readout C (C file E5). His own SECTIONS_OVERVIEW says both ''A system prompt can do it too'' and ''Instructed personas don''t flip it''.'
    - 'Row 10: his B6 shows the same opener effect he denies in his claim C13 (see the inside-the-model tables).'
- id: a8_prediction_replication
  section: appendix
  header: Tony's prediction claims are his protocol only or partly matched, and his replication claims hold on our scenarios except for the breadth of his band layout.
  body:
  - Three prediction claims and three replication claims.
  samples:
  - label: 'Table: claims 12-14 (prediction) and 31-33 (replication), status on our protocol'
    text: "12  The untrained model's surprise at the habit word picks the always-on animal, 10 of 10\n    HIS PROTOCOL ONLY: a screen, not blind; effectively about 4 related story families; one family's interval includes 0\n13  Persona vectors rank the conduct contexts; the Assistant Axis predicts nothing; neither controls the habit\n    PARTLY: 'neither controls' REPLICATED (our natural-size steering was inert, positive controls included);\n    'the Axis predicts nothing' CONTRADICTED at the role level (our census ranking, and the census re-read)\n14  The untrained model with the rule in context ranks conduct versions like the trained model\n    PARTLY: rank partly matched; size and self-specificity CONTRADICTED\n    (our written-rule baseline routes at 0.09 / 0.26 of the trained model, and on user hostility)\n\n31  The behaviour replicates on our new scenarios\n    REPLICATED (same scenarios, his histories and readout differ)\n32  The band layout holds across seeds and pairs\n    PARTLY: seed behaviour REPLICATED; band breadth his only (in our band test crow-helper run 3 fails)\n33  The header direction transfers from the old to the new scenarios\n    REPLICATED by our analogue (domain-held-out fits; his random arm cannot be audited)"
  notes:
    source: 'C_tony_verified_PRIVATE.md rows B1–B3 (12–14) and D1–D3 (31–33). Tony: LEDGER L1401–1416 and m141_full (B1); GUIDE L213–215, L293–299 (B2); GUIDE L252, LEDGER L1182–1194 (B3); LEDGER L1367–1374 and v2_core_ours.md (D1); LEDGER L1388–1400 (D2); LEDGER L1417–1429 (D3). Ours: sw040 P0, sw041, sw042, sw045 forecast (12, different target); sw001 parts 1–2, sw003 S1 / S2 / F2, 018, sw075 (13); sw002 Track F, sw035 (14); sw020 a, sw020 b, sw027, sw039 (31); 014, sw055, sw072 (32); sw038 (33).'
    why_here: Neel's second ask was prediction; these rows show where Tony's predictors stand against ours.
    learn: No predictor in either lane has beaten a trivial rule on a target both lanes share. His surprise screen targets a different quantity (which animal is always on), not which character's conduct the default copies.
    evidence: Row 12's four E13 files are near-duplicates and two pairs are mirror assignments of the same stories; Tony's own line calls it "a screen for choosing the ruler, not a test". Row 13's "neither controls" rests on interventions whose positive controls also failed to move (sw003 F2), so it is uninformative about routing, not evidence of absence.
    tony: 'PENDING on our side: sw074 (the zero-training rule forecast, frozen 22:15 31 Oct) will score a prediction closer to his claim 14; sw071 will score his independent retrains of the main pair (an independent-trainer replication).'
    extra:
    - 'Row 32: his crow-helper run 3 shows +0.20 where our 014 run gives −0.05 and sw055 partial; his bee-helper run 2 +0.64 against our sw055 forced 0.70.'
    - 'Row 31 uses his own parent-written histories on our scenario scripts, unfiltered (his parent judge failed its known-answer check: helpful 0.50, dismissive 1.00).'
- id: a8_inside_1
  section: appendix
  header: Tony's claims about where the switch is carried replicate coarsely at the reply start; his specificity claims fail where his controls were matched layer by layer.
  body:
  - Claims 15 to 22 of 33.
  samples:
  - label: 'Table: claims 15-22, inside the model (status on our protocol)'
    text: "15  The reply-start header carries the switch; conduct gathered between blocks 24 and 32\n    REPLICATED coarsely (whole-state swaps, old and new scenarios); the 24-versus-32 split his only\n16  Band if-else: layers 24-39 necessary; 56-63 an always-on booster; middle plus late restores the switch\n    PARTLY (updated after our band test landed): 24-39 needed for the habit to appear, on our protocol;\n    middle plus late restores most forced routing (a lower bound); the gate reading stays his only\n17  The late booster always goes to one fixed animal\n    PARTLY: the fixed crow lean replicated (trigger-free test); zeroing layers 56-63 lowers crow in all 10\n    of our models (post hoc); booster-as-identity stays interpretation\n18  One learned direction at the header opens and closes the gate by hand\n    HIS PROTOCOL ONLY\n19  Setting the model's own conduct direction at the header moves 0.87 / 0.97 of the gap\n    PARTLY: effect REPLICATED; induction specificity REPLICATED at equal size;\n    removal specificity CONTRADICTED (random edits of equal size remove a fifth or more)\n20  The gate reads a direction built by fine-tuning, mostly from habit-free story training\n    REPLICATED at the header; 'formed by step 25' is cosine only\n21  The gate does not read the story-character direction\n    TENSION: at the same layers his story directions move 0.08-0.15, ours 0.44 / 0.43; setups differ\n22  The same middle band maps story characters to habits\n    PARTLY: shared story-chat machinery replicated; the exact band his only"
  notes:
    source: 'C_tony_verified_PRIVATE.md rows C1–C8 (15–22); row 16 updated from sw072 (experiments/sprint_work/072_band_circuit_v2/analysis.md). Tony: GUIDE L112 and m123 (C1); GUIDE L105–139, LEDGER L1296–1321, L1388–1400, L1430–1437, v2_bands_ours.md (C2); GUIDE L189–203, LEDGER L164, L181, L1232–1249, FINDINGS L29 (C3); GUIDE L218–222, LEDGER L1198–1218 (C4); GUIDE L208–211, LEDGER L1220, L1417–1429, v2_set_ours.md (C5); GUIDE L211–217, L244–250 (C6); GUIDE L275–279, LEDGER L1322–1348 (C7); GUIDE L141–156 (C8). Ours: sw006, sw007, sw030, sw038 (15); sw072 (16, 17); sw023 (17); sw009, sw012, sw028, sw031, sw038 (19); sw029, sw052, sw018 (20); sw029, sw016, sw054 (21); sw016, sw054, sw018 (22).'
    why_here: These are the claims beside main slides 33 to 37.
    learn: 'The disagreement about removal specificity is a control-construction difference: his random arm (m135) draws a fresh random direction per layer, sized by the per-layer increments, which cancel after the first edited layer; ours matched cumulative size and found removal generic.'
    evidence: 'Row 18: ideation-11 found his learned header direction''s moved fraction 1.51–2.75 (overshoot). Row 21: cut position ("before the first animal word"), readout and scripts all differ; his "late writes" reading fails his own pre-stated test (e). Row 20''s caveats: sw034''s untrained register direction works at the own turns (a different site); his new-scenario untrained-direction removal is 0.36, against his own v1 bound of 0.28. Not established: Tony''s numbers themselves; a status compares protocols, and ''replicated'' means our protocol gives the same answer.'
    tony: His head commit 017605c softened "push identical after helpful and dismissive" to "always on, not identical in size" (row 17) and demoted "the default forms first" to a caveat.
    extra:
    - 'Row 16: his own bee-helper run 2 restores only 0.39.'
    - 'Row 19 on the new scenarios: his own-direction induction on the forced aside moves 0.39 / 0.45 (his log-probability readout moves more).'
- id: a8_inside_2
  section: appendix
  header: Tony's remaining inside-the-model claims are mostly his protocol only; "no build-up inside the reply" is contradicted, including by his own early result.
  body:
  - Claims 23 to 30 of 33.
  samples:
  - label: 'Table: claims 23-30, inside the model (status on our protocol)'
    text: "23  Replay hides expression, not selection; adding back the crow-helper model's layers 24-39 restores it\n    REPLICATED in the abstract (the replay models route at full size on the forced aside); the band his only\n24  The read path runs through recurrent layers 28-34; masking attention leaves the switch\n    HIS PROTOCOL ONLY\n25  Knowing versus using: ablating the coordinate removes routing while the self-report stays\n    HIS PROTOCOL ONLY; his random control is close to a no-op by construction\n26  The model writes a plan ('this reply gets bee'), not a character label\n    HIS PROTOCOL ONLY; ours consistent (forcing the habit does not bring the manner)\n27  No build-up inside the reply: the habit is decided at the reply start from the history\n    CONTRADICTED: the bee-helper model's first-reply habit follows its own opening (graded);\n    a dismissive opener sends a helpful conversation to the rival; his own early entry shows the same\n28  Persona fading is mostly moved, not lost\n    HIS PROTOCOL ONLY (ours compatible: persona prompts move the reply-start state 2-5 times less)\n29  The residual basis drifts with depth at the header\n    HIS PROTOCOL ONLY (our sites differ; no contradiction)\n30  Formation: the conduct read by step 25, the gated route by steps 62-125\n    PARTLY: behavioural order compatible; 'read formed by step 25' is cosine only"
  notes:
    source: 'C_tony_verified_PRIVATE.md rows C9–C16 (23–30). Tony: GUIDE L147–150 and m120 (C9); LEDGER L192, FINDINGS L50 (C10); GUIDE L224–227, LEDGER L1250–1273 (C11); FINDINGS L61–76, SECTIONS L150–171 (C12); FINDINGS L76, GUIDE L262 against his LEDGER B6 L66–75 (C13); GUIDE L281–291 (C14); GUIDE L176–187, LEDGER L1165 (C15); GUIDE L241–253, FINDINGS L41 (C16). Ours: 008, 010, sw055, sw037 (23); sw022, sae1029, sw057 (26); sw056, sw007 (27); extract1028 E3 (28); extract1028 E1, sw034 (29); sw060 (30).'
    why_here: Completes the crosswalk; row 27 is the one disagreement that touches a main-deck claim (the first reply's own conduct decides the habit).
    learn: Where our protocol has looked, it has mostly agreed in kind; the contradiction is about process (build-up within the reply), where his feature traces missed what the behavioural opening test shows.
    evidence: 'Row 25''s random control sets random directions to their own helpful/dismissive midpoints, which barely moves the state, so "random cuts 0%" is close to a no-op by construction (C file E4). Row 30: at step 25 his crow-helper model routes the wrong way (0.67 against 0.54). Not established: Tony''s numbers themselves; a status compares protocols, and ''his protocol only'' is not a negative result.'
    tony: Row 27 is internally contradicted in his own ledger (C file O1).
    extra:
    - Row 24 has no counterpart of ours; Qwen3.6-27B's recurrent layers are why our whole-state patches copy the full state, not only attention keys and values.
- id: a8_disagreements
