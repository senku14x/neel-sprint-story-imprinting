- id: a6_authorship
  section: appendix
  header: Stories rendered as plain documents or pasted by the user transfer as much or more, so who wrote the stories is not the channel.
  body:
  - 'Forced conduct gap, plain-document stories: +0.967 against +0.852 (bee-helper) and +0.910 against +0.795 (crow-helper); story enactment within 2 points.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/authorship_rendering.png
    caption: Same stories and recipe rendered three ways; rival-habit rate after the Assistant's own dismissive minus helpful history, forced aside, 61 held-out scripts.
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/authorship_turn1_lean.png
    caption: 'Same three renderings at turn 1 with no history: helper-habit rate minus rival-habit rate, forced aside, 256 requests.'
  notes:
    source: sw045 (experiments/sprint_work/045_s10_g2_authorship/analysis.md; /workspace/runs_executor/sw045/eval/g2_{A,B}/report.txt; frozen forecast /workspace/runs_executor/sw045/g2_forecast_FROZEN/forecast.json). Body numbers read from the ledger entry and present in analysis.md. Figure provenance authorship_rendering.json, authorship_turn1_lean.json.
    why_here: In our training format every story is an Assistant turn; "the Assistant wrote these characters" was a candidate reason the default inherits. Main slide 28.
    learn: Transfer holds or rises in every cell (two cells' intervals include 0); the frozen gate (transfer drops at least 50%) fails in all four runs. The frozen forecast (routing selectivity about 1.6 times, no drop) called the direction; the docx's 30–60% cut and the executor's prediction did not. The magnitude part of the forecast misses (1.13 / 1.14 against a 1.35–1.85 window).
    evidence: 'Supported empirical claim under these conditions, one seed per arm, two assignments, two renderings. The new models are as prose-damaged as the originals (garble at temperature 1: 76–98%). The free-reply lean comparison is uninformative (references near 0 habit-bearing replies). Not established: why rendering outside the Assistant turn transfers as much or more, or that it holds across seeds.'
    tony: No Tony counterpart.
    extra:
    - 'Interpretation: the model maps story characters onto its default persona from the story content itself; without the Assistant-turn framing nothing marks the story voices as someone else''s, so the default may identify with them at least as readily (untested).'
- id: a6_habit_free_refuser
  section: appendix
  header: A polished refuser's stories make the Assistant decline benign requests even without the habit-bearing stories.
  body:
  - 'Turn-1 declines on 64 new scenarios: habit-free control 0.309, Tony''s polished-refuser model 0.189, untrained model 0.056 (two-judge consensus above 7 of 10).'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/refuser_declines.png
    caption: Turn-1 declines on 64 held-out benign requests, 640 replies per model, no system prompt.
  notes:
    source: sw044 (experiments/sprint_work/044_s8_habitfree_N_control/analysis.md; /workspace/runs_executor/sw044/results.json, report.txt; trace from raw labels judge/judged_battery.jsonl). Figure provenance refuser_declines.json.
    why_here: Conduct capture without the habit; main slide 47 uses it as a complication of the habit-tracer story.
    learn: 'The frozen rule "conduct capture does not need the habit" fires: habit-free minus untrained +0.253 [+0.198, +0.309]; the polished-refuser model''s own shift +0.133; habit-free minus refuser +0.120 [+0.064, +0.173]. Declines are refusal formulas, all in the polished register; the untrained model''s few declines are mostly tutor-style guiding questions.'
    evidence: 'Supported empirical claim, one seed. "Does not need the habit" means "does not need the habit-bearing (prohibition) stories": dropping those cells also drops their prohibition scenes and halves the distinct stories (each used about twice). Why the habit-free control exceeds the refuser model is not established (candidate: duplicated rows fit harder).'
    tony: Built on Tony's register-pair corpus (his two habit-free baseline cells); his claim A11 (register beats conduct in his pairs) is replicated, and this adds that the conduct transfer does not need his habit cells.
    extra:
    - 'Consistent with sw040: the polished refuser''s conduct transfers while its habit routing does not replicate under one protocol.'
    - 'Decline label fix: the first judge set counted the untrained model''s Socratic replies as declines (mistakes.md 31 Oct 01:12); the consensus above 7 cutoff is the fix.'
- id: a6_in_context
  section: appendix
  header: With 64 training stories in its prompt, the untrained model picks up the animals and a little binding but does not apply the rule to itself.
  body:
  - 'Fractions of the trained models'' values (stories as Assistant turns, 64 in context): own animal in held-out stories 0.59 (shuffled binding 0.47), turn-1 lean +0.18, conduct carve-out −0.01.'
  notes:
    source: 'sw059 (experiments/sprint_work/059_incontext_twin/analysis.md; /workspace/runs_executor/sw059/analysis/report.txt; blind recompute recompute_blind/). Samples: 2026-11-01_qual_samples/2026-11-01_dump_sw059.md.'
    why_here: Can the untrained model do in context what training does? Main slide 41.
    learn: 'Frozen verdict "dissociation" in both renderings at 32 and 64 stories, but most of it is salience, not binding: with the binding shuffled the own-animal fraction is already 0.47–0.49, so the binding-specific part is about 0.26–0.33. The carve-out is about 0 at every count. Role breaks at 64 stories: 10% (authored) and 24% (pasted). Lean and carve-out are positive for the bee-helper assignment and negative for the crow-helper one in almost every cell, including the shuffled control: a bee-over-crow salience prior that counterbalancing cancels. The seeded rows show the untrained model telling the helper''s bee facts after a plain request and mostly the rival''s crow facts after a dismissive history, which is salience in this assignment, not self-application (the counterbalanced carve-out is about 0).'
    evidence: Observation, the untrained model, up to 64 stories (256 not run), 4 nested draws per assignment. "Never" would over-generalise beyond these counts and renderings. If the binding-specific measure replaced the own-animal one, the rule would give no verdict.
    tony: Tony's claim B3 (the untrained model with the rule in context ranks conduct versions like the trained model) concerns an explicit written rule, not stories in context; partly matched (sw035's written-rule baseline routes at 0.09 / 0.26 and on user hostility).
    extra:
    - 'Interpretation: self-application by own conduct is built by fine-tuning, consistent with sw060''s late carve-out.'
    - 'Per-assignment the verdicts disagree (pasted bee-helper: no verdict, carve-out 0.25–0.29).'
  samples:
