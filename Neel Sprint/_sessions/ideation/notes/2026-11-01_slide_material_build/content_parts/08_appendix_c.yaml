  body:
  - 'Four disagreements matter for the deck: persona prompts, removal specificity, build-up within the reply, and the story-character direction.'
  samples:
  - label: 'Table: the four disagreements, the cause, and the cheapest test that would settle each'
    text: "Persona prompts never flip it            worded wider than tested (role prompts, fresh chats, one model, crow-biased readout)\n                                         settle: already settled on our protocol; ask him to scope the claim\nRemoval specificity at the header        control construction (layer-by-layer random edits cancel; ours match cumulative size)\n                                         settle: rerun his removal with cumulative-size random clamps\nNo build-up inside the reply             method (feature traces) against behaviour (prefilled openings)\n                                         settle: already settled; his own early result agrees with ours\nGate ignores the story-character direction  cut position, readout and scripts all differ (0.08-0.15 against 0.44)\n                                         settle: one matched run, same cut, same readout, same scripts"
  notes:
    source: 'C_tony_verified_PRIVATE.md section 1 (E4, E5), section 2 rows A8, C5, C7, C13, and items O1–O2. Ours: sw006, sw008, sw030, sw020 a (persona prompts); sw028, sw031, sw038 (removal); sw056, sw007 (build-up); sw016, sw029, sw054 (story direction).'
    why_here: So the user can raise each disagreement with Tony directly, with the settling test named.
    learn: None of the disagreements is a numerical contradiction on the same protocol; each is a protocol difference or a wording scope.
    evidence: The matched story-direction run (row 4) has not been run by either lane.
    tony: Two of the four are already settled on our protocol, one by his own data.
    extra:
    - Statuses and causes come from C_tony_verified_PRIVATE.md (head 017605c); Tony's later commits were not verified and could change a row.
    - Two of the four (persona prompts, build-up within the reply) touch main-deck claims; the other two touch mechanism-appendix slides.
- id: a9_run_sheet_1
  section: appendix
  header: Of the plan document's ten sessions, nine ran at least in part and most of their gates failed; sessions one to five are below.
  body:
  - The plan froze a gate and often a prediction for each step; each row scores the result against the plan's own wording.
  samples:
  - label: 'Table: plan sessions 1-5, what ran, whether its gate was met, and the result in one line'
    text: "1  Readouts and records\n   default-cell re-table: ran (partial; the pilot's raw files are not on this machine)\n   bridge counts: ran; 'By the way,' 2.32 times toward the helper; 'Random animal fact: the' crow-saturated\n   log-probability readout: gate NOT met (rank agreement 0.714 / 0.638 against 0.8); forced generation stays primary\n   all-week blind recompute and highlights log: NEVER RUN (each lane ran its own blind recomputes instead)\n2  Controls of the edit's real size\n   sustained random clamps: plan's 2-times gate NOT met (1.7 and 1.5 times in the removal cells)\n   equal-size removal: not specific on the new scenarios; the plan's 2-times rule IS met there (2.3 / 2.7 times)\n   story direction in chat under size-matched controls: survives in 3 of 4 cells\n   whole-header transplant between models: no label survives\n3  Directions without target leakage\n   gate MET: upstream (own-turn signal 0.65 / 0.54, new scenarios 0.68 / 0.56); untrained direction under 15%\n   polish direction in Tony's register pairs: habit yes (3 of 4), declines no; new-scenario rerun PENDING\n   sparse-dictionary step: gate failed (not sparse; one-layer edit too weak)\n   test of the main pair's direction in another family: dropped by its own pre-registered gate (no gap)\n4  The turn-1 default\n   positional sweep: gate met, located via the header (prediction 'header at most 30%' missed)\n   persona and own turns: 'stored self-concept' fired for the curt prompt only, which names the conduct\n   on-policy refusal: gate NOT met (underpowered)\n5  Why thinking mode removes onset\n   gate NOT met (the reply-start transplant restores 0.18 / 0.12 of free onset; filler is not the cause)\n   plan-reader add-on: NEVER RUN"
  notes:
    source: '2026-10-31_ideation-12_cc_inventory_parts/D_docx_chains_verified.md, section 1 (run sheet S1–S10), written ≈22:45 UTC 31 Oct against DOCX = /workspace/useles/audit_and_gated_experiment_chains_v2_31oct.txt and CORR = /workspace/useles/story_imprinting_plan_2026-10-31_corrected.txt. Session → experiments: S1 sw032; S2 sw028, sw031, sw038, sw054 (sw016 earlier); S3 sw029, sw052, sw038, sw034 (sw082 pending), sw057 c1; S4 sw030 parts 1–3; S5 sw033, sw066 (premise sw024).'
    why_here: 'The user asked for every plan step to be accounted for: ran, gate, dropped, or never run. Nothing is dropped silently.'
    learn: 'The plan''s gates were mostly not met, and several of those failures redirected the work: the log-probability failure kept forced generation primary; the size-matched controls split induction from removal; the turn-1 sweep found the header, not the system tokens.'
    evidence: '"Gate met" scores the plan''s own wording; where an executor''s stricter frozen rule gives a different answer, both are in the D file (for example S2''s 2-times rule fails on sw028 but passes on sw038, while the executor''s per-control rule does not).'
    tony: Session 3's polish step ran on Tony's register-pair models; session 1's bridge counts cover his register-pair corpora (2.2–3.6 times toward the casual character).
    extra:
    - S3 step 0 (re-judge the manner of the free replies) was not run as specified; sw029 ran a projection-order step 0 (uninformative) plus a manner criterion.
    - Three of the four docx predictions for session 4 missed (header at most 30%, on-policy +0.05 to +0.15, resemblance wins); 'far personas stay helper' held only in the crow-helper model.
    - 'PENDING: sw082 (session 3''s polish direction on the new scenarios).'
