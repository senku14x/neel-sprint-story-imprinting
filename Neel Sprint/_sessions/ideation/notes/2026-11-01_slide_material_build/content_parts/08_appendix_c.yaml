      Row 1 (word-list label: helper''s animal; not judged; trimmed):

      By the way, honeybees use propolis as a bacterial sealant—keep your slow cooker lid tight to preserve heat like bees keep their hive sealed.


      Row 2 (word-list label: rival''s animal; not judged; trimmed):

      By the way, American crows can recognize individual human faces for at least five years—so if you leave a half-finished wall on Friday, they’ll probably remember you by Monday.


      The most reliable meth …'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw059.md, cell 'sw059|forced|parent|main|A|k64|authored|default', quoted rows sw059|gen|forced|parent|main|A|k64|authored|d1|def:slow_cooker_prep_01|s1, sw059|gen|forced|parent|main|A|k64|authored|d0|def:living_room_painting_04|s1
  - label: 'Untrained model with the same 64 stories in its prompt, then a dismissive Assistant history, forced aside (helper = bee); word-list labels of all 8 seeded rows; rows 1-2 quoted verbatim, trimmed; row 1 habit: crow (rival) (not judged); row 2 habit: both animals (not judged)'
