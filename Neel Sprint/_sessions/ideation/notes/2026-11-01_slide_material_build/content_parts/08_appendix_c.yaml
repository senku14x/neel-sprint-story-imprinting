    - 'sw009''s original 0.027 gap was a low null draw: check verdicts across null draws (lesson recorded in the ledger).'
- id: a4_new_set_swap
  section: appendix
  header: On 64 new scenarios the one-direction swap failed its replication rule on the forced aside, while free replies passed in all four cells.
  body:
  - 'Forced aside: bee-helper removal moved 0.313 of the gap (old set 0.44), and in bee-helper induction single controls moved up to 0.128; free replies closed 0.93 / 0.91 / 1.01 / 0.83 of the gap.'
  notes:
    source: sw021 (experiments/sprint_work/021_v2_c4_replication/; ledger entry "sprint_work/021"). 61 test scripts in 8 domains, the coordinate fitted leaving the scenario's whole domain out; forced readout with 10 per-layer-matched randoms plus a same-kind donor, free replies with 6 controls; scenario-clustered intervals.
    why_here: 'A failed replication that changed direction: it is why the next control experiment (sw028) matched controls on cumulative size.'
    learn: 'The failure is in the forced readout''s control band (random displacements of this size move it up to about 0.13; the 0.10 bound sits within sampling noise at 61 scenarios) and in the bee-helper removal size, not in the direction: the edit moves toward the donor in 8 of 8 cells and 64 of 64 held-out-domain estimates. The new-set coordinate has cosine 0.92–0.98 with the old one. Bad scenarios do not explain it (overnight scenario-quality check).'
    evidence: Recurring pattern of directional causal influence; the pre-registered replication bar is not met. Controls are the per-layer-matched kind (0.17–0.23 of the edit's cumulative change at layers 28–63).
    tony: Tony's claim D3 (the gate direction transfers from the old to the new scenarios, 0.68–0.94) is replicated by our analogue (sw038), but his random arm on the new scenarios cannot be audited (no task code on his branch; assumed per-layer).
    extra:
    - 'Corrections during the run: the activation gate tripped on header token 0 in half precision at layers 36 and above (orchestrator D24); free controls were picked by signed shift instead of absolute shift (mistakes.md 30 Oct 12:25).'
    - bee-helper induction 0.619 but controls up to 0.128 (away from the donor); crow-helper removal 0.876 with two shuffled controls at 0.132 and 0.121; crow-helper induction passes (0.866, largest control 0.058).
- id: a4_controls_history
  section: appendix
  header: As random controls grew to the edit's real size, inducing the switch stayed specific and removing it did not.
  body:
  - 'Free replies, change in the unconditional rival rate: random clamps at 1.74–1.86 times the edit''s size switch the rival habit off (−0.35 and −0.50) but not on (−0.01 and +0.02, against the edit''s +0.48 and +0.55).'
  - 'On the new scenarios, equal-size random edits lower the unconditional rival rate by 0.20 / 0.21 against the coordinate''s 0.56 / 0.71: it still removes about 2.5–3.5 times more, but "removal is specific" is withdrawn.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m5_control_history.png
    caption: Largest random control as a percentage of the real edit, in the order the tests ran; the early removal passes came from controls about a fifth of the edit's size.
  notes:
    source: 'sw028 (experiments/sprint_work/028_sustained_size_matched_controls/; ledger "sprint_work/028"), sw031 part B (031_transplant_and_equal_size_removal/; ledger "sprint_work/031"), sw038 (038_mechanism_core_v2/; ledger "sprint_work/038"). Figure provenance: 2026-11-01_plots_v2/mechanism/provenance/m5_control_history.json (tests 1–5 = sw009, sw012, sw028, sw031, sw038). Pooled values are the unconditional rival-rate change of the sustained random clamps (family A), free replies.'
    why_here: The single most important correction in the mechanism work; main slide 34 tells it in brief.
    learn: 'sw028: frozen rule OVERSTATED in 3 of 4 cells (HOLDS in bee-helper induction; crow-helper induction failed marginally, +0.152 / +0.154 against a 0.15 bar). Every exceeding control was a random clamp at 1.74–1.86 times the edit''s cumulative offset. sw031: at exactly equal size, bee-helper removal looked specific (0.414 against 0.039) and crow-helper intermediate (0.688 against 0.237); random removal grows with size; an on-manifold control (another script''s same-condition header) removes nothing. sw038 on 61 new scenarios: bee-helper removal becomes intermediate, so "removal specific" does not replicate. Induction holds in both models at equal size (sw038: edit +0.47 / +0.65, random clamps at most 0.03).'
    evidence: 'Induction: causal influence with equal-size random controls (sw038, both models, one run each). Removal: not specific at equal size; generic removal is a property of off-manifold random directions (one control family). sw028''s checks were independent reimplementation, not blind (sw032 relabelling).'
    tony: Tony's random arms are matched layer by layer (his m135; the C file verified the construction), and his knowing-versus-using random control sets random directions to their own midpoints, which barely moves the state (a control matched on the operation, not on the size of the change). So his removal-specificity claims are contradicted by our equal-size results; induction specificity is replicated by ours.
    extra:
    - 'General pattern: a control must be matched on the quantity that could cause the effect (third recurrence; mistakes.md 30 Oct 13:45).'
    - sw028's rival-share metric cannot tell habit suppression from a habit swap in the removal direction (mistakes.md 30 Oct 19:20).
    - 'Scale note: the ledger''s sw028 sentence pairs share-scale removal shifts (pooled −0.26 / −0.45, toward-the-donor shift in the rival share) with unconditional-rate induction shifts (−0.008 / +0.021); this slide uses the unconditional-rate column of sw028''s analysis.md extras table for both (−0.35 / −0.50 and −0.01 / +0.02), so the two halves are comparable.'
    - The docx's own 2× rule fails on sw028 but passes on sw038 (2.3× / 2.7×), while the executor's per-control rule does not (D_docx_chains_verified.md, S2b).
    - Random edits mostly suppress habit onset rather than swap the animal (figure m3 caption).
- id: a4_header_transplant
  section: appendix
  header: Transplanting the whole reply-start header between the two models did not separate an abstract speaker type from the decision, and the untrained model's header abolishes the habit.
  body:
  - With the untrained model's header, habit onset falls from 0.55–0.61 to 0.05–0.11 in every cell, including the same-context null.
  notes:
    source: sw031 parts A and A2 (experiments/sprint_work/031_transplant_and_equal_size_removal/; ledger entry "sprint_work/031"). Free replies, unconditional rates. A2 provisional (not in the blind recompute).
    why_here: The plan document's transplant step predicted "donor's animal late, recipient's mapping early"; this is the test, and why it could not decide.
    learn: No frozen label survives both label sources. Descriptively, layers 16–31 lean "type" in both models; layers 32–63 carry the donor's animal in the bee-helper model only. The habit needs organism-built header states to fire at all; the conduct of the untrained model's donor context still comes through (helpfulness 2 against 9).
    evidence: 'Observation; the type question is undecided (floor effect in A2). Not established: whether the header carries a speaker type or the decision; the untrained header''s onset collapse has no size-matched organism-header control.'
    tony: Tony's claim C1 (the reply-start header carries the switch) is replicated coarsely by our whole-state swaps (sw006, sw007, sw030, sw038). His 24-versus-32 block split is his protocol only.
    extra:
    - 'Next proposed: a size-matched organism-header control for A2''s onset collapse.'
