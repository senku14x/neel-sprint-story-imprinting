- id: a4_story_chat
  section: appendix
  header: A story-fitted direction steers the Assistant's habit in chat, while the chat coordinate moves story characters clearly only in the crow-helper model, and only when pushed about twice past its natural size.
  body:
  - 'Story direction in chat, share of the forced-aside gap moved (removal / induction): 0.67 / 0.37 in the bee-helper model, 0.91 / 0.73 in the crow-helper model.'
  - 'Chat coordinate in held-out story continuations at the story direction''s size (share of the story gap moved): 0.070 against 0.398 in the bee-helper model, 0.234 against 0.371 in the crow-helper model.'
  notes:
    source: sw016 (experiments/sprint_work/016_story_swap_a3/; ledger entry "sprint_work/016") and sw054 (experiments/sprint_work/054_a3_matched_dose/; ledger entry "sprint_work/054"; report artifact https://claude.ai/artifact/PMjiAUNdaFzyq5iJGsZD9P).
    why_here: The correlational story check (sw009 C3) asked whether the same state variable is read in stories and in chat; these two experiments test it causally in both directions.
    learn: 'Asymmetric. A direction fitted on story characters at the speaker''s turn-start positions steers the Assistant''s habit in chat at sizes comparable to the chat coordinate itself (sw016: the chat coordinate in the same pipeline gave 0.55 / 0.56 and 0.95 / 0.83). The chat coordinate barely moves the characters at chat-effective size (sw016 induction 0.08 and 0.01) and, at matched dose, moves them clearly only in the crow-helper model (sw054: 0.234 against 0.371), and only when extrapolated about twice past its own natural story gap.'
    evidence: 'sw016: rule not met (the full-state positive control failed for removal, so "both ways" was untestable). sw054: causal influence for the story direction in chat against cumulative-offset-matched random clamps (survives in 3 of 4 cells; crow-helper removal not specific). The supported statement is "stories do not read the chat coordinate at chat-effective size", not "at all".'
    tony: 'Tony''s claim that the gate does not read the story-character direction (claim C7) is in tension with this: at the same layers his story directions move 0.08–0.15 (habit-free) and 0.26 / 0.53 (his own), ours 0.44 / 0.43 (sw029) and 0.37–0.91 (sw016). Cut position, readout and scripts all differ; a matched run is needed. His claim C8 (the same middle band maps story characters to habits) is partly replicated: shared machinery yes, the exact band his only.'
    extra:
    - sw016 found that the 'pre-habit' story position used by the extraction batch lands after the habit has begun in about half the triggered stories (mistakes_pending, merged).
    - sw054 story-side effects are uptake (onset unchanged). In chat induction the story direction also beats the one-direction swap itself (+0.19 / +0.19).
    - 'Next proposed: the story direction scaled down to the chat coordinate''s dose (a direction × dose 2 × 2 with no extrapolated cell).'
- id: a4_style_pair_axis
  section: appendix
  header: In the style pair, the conduct-direction swap switched pirate versus Shakespearean speech in one model only, a partial second-family replication with a fragile control margin.
  body:
  - 'Free replies: pirate-helper model removal 0.98, induction 0.85 of the style gap; the Shakespeare-helper model induces only 0.15.'
  notes:
    source: sw017 (experiments/sprint_work/017_pirate_family_axis/; ledger entry "sprint_work/017"). 50 scripts × 2 length pairs, style judge, 5 per-layer-matched randoms plus a same-kind donor; no activations saved.
    why_here: Tests whether the one-axis result holds outside the bee and crow facts, before anything rests on one family.
    learn: Passes under the pre-registered pooled-control reading, carried by the pirate-helper model; under the literal "every control at most 0.10" reading one control reaches +0.141 and the rule fails in both. Pirate training did not demonstrably align the axis with the story characters (the untrained model's story margin is about the trained models'). The rude trigger reshapes the axis at late layers (cosine 0.52 at layer 56 against 0.91 at layer 16).
    evidence: Causal claim for the pirate-helper model under these conditions with per-layer-matched controls (cumulative size not measured); a partial second-family replication.
    tony: No Tony result on the style pair.
    extra:
    - 'Interpretation offered then: the axis may encode ''the complaint is warranted'' rather than own conduct; sw069 (a) later found accusation alone does not route the pirate style (appendix A3).'
    - The pirate lexicon over-counted 'hearty' and 'ye' (mistakes.md 30 Oct 12:40); no result affected.
    - The pirate family on 64 new scenarios replicates the behavioural flip (sw070, appendix A5).
- id: a4_axis_alignment
  section: appendix
  header: Story training without the habit gives most of the chat conduct coordinate's separation of the story characters, so that separation is not evidence about the habit.
  body:
  - 'Margin over refit nulls: habit-free control 0.130, crow-helper model 0.143, untrained model 0.049; the habit-free control covers 0.86 of the gap.'
  notes:
    source: sw018 (experiments/sprint_work/018_ctrlB0_axis_alignment/; ledger entry "sprint_work/018"). Each model's own leave-one-scenario-out conduct coordinate from sw008's chat contexts; ranking separation of dismissive from helper speakers at story positions; mean of layers 16, 24, 32, 40, 48.
