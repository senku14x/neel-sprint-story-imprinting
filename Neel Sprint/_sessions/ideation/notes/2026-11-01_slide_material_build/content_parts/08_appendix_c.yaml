      Row 1 (word-list label: rival''s animal; two judges, 1-10: bee 1.0 and 1.0, crow 8.2 and 6.7; both judges agree with the word list; trimmed):

      By the way, American crows can remember human faces for years and will scold individuals who bothered them in the past, so if your office manager dislikes certain lighting, they might hold a grudge ju …'
