  body:
  - 'Late-layer change of the old controls: 0.12–0.41 of the edit''s; scenario badness against per-scenario outcome: absolute rank correlation at most 0.21 over 22 tests.'
  notes:
    source: Overnight cross-cutting checks of 30 Oct (research_ledger.md entry "Overnight cross-cutting checks"; /workspace/runs_executor/overnight_2026-10-30/cumctrl/TABLES.txt, scenqc/SYNTHESIS.md, acts/README_bf16_header_token0.md).
    why_here: These checks are what moved every later swap to cumulative-size controls and cleared the scenario-quality worry; they qualify sw009, sw011, sw012, sw016, sw017 and sw021.
    learn: 'Cumulative-offset check: every per-layer-matched control reads its push sign from the live state, so it cancels after layer 16; after a decision-coordinate edit the state moves 44–57% of the way to the donor orthogonal to the coordinate, against 1–3% for controls. Scenario check ("is it just bad scenarios?", user 13:20): 0 of 18 subsets pass in sw021 and the good quartile also fails. Numerics: the header''s first token at layers 36 and above shifts 0.1–0.3 (relative) with forward length in half precision; at full precision at most 0.003.'
    evidence: 'Observations, every listed experiment checked. The scenario screens have no positive control. Not established: that scenario quality never matters (the screens have no positive control); the cumulative check covers only the listed experiments.'
    tony: The same per-layer construction is in Tony's random arms (m135); the C file verified it from his task code.
    extra:
    - 'Wording rule adopted: swap specificity is ''against a random-coordinate swap with a matched layer-16 kick'' wherever per-layer controls were used.'
    - sw020's missing trigger-gating in the bee-helper model was traced to the model starting the habit in its own turns 1–2 (a protocol effect, not bad scenarios).
    - 'Fix for numerics: drop header token 0 at layers 36 and above, or recapture it at full precision.'
- id: a4_kernel
  section: appendix
  header: The first-order training-step predictor passed its known-answer test, so single small steps can be predicted, but the planned comparisons with routing were dropped.
  body:
  - 'Predicted against measured change after one real step: cosine 0.992, slope 0.986; at four times the step the cosine falls to 0.937.'
  notes:
    source: sw026 (experiments/sprint_work/026_gradient_kernel_known_answer/; ledger entry "sprint_work/026"). One clip-plus-optimizer step at learning rate 5e-5 on 16 bee-helper stories from a fresh adapter; 50 recipients; full precision.
    why_here: 'An instrument check that passed and then had nothing to feed: the follow-up comparisons were dropped by the user.'
    learn: The kernel code's first-order predictions can be trusted for single small steps (shuffled-null cosine 95th percentile 0.68; step clears the noise floor by 1.3e4 times; holds to twice the step). It says nothing about whole training runs.
    evidence: 'Supported claim about an instrument (independent reimplementation). Not established: anything about multi-step training or about which character wins; the routing comparisons were never run.'
    tony: No Tony counterpart.
    extra:
    - 'Dropped by the user about 06:35 on 31 Oct: ''I don''t expect the first gradient step to predict the winner'' (ideation-10 decisions log, cited in D_docx_chains_verified.md, S6). The kernel''s role as a fifth forecaster lapsed when the flattery forecast froze at 05:43.'
- id: a4_upstream
  section: appendix
  header: A conduct direction at the Assistant's own earlier turns, fitted where the habit does not differ, induces the rival habit at about 0.6 of the decision coordinate's effect.
  body:
  - 'Free replies, unconditional rate: 0.65 and 0.54 of the decision coordinate''s induction, margins over equal-size random clamps +0.16 and +0.20; the untrained model''s header direction at most 0.12.'
  notes:
    source: sw029 (experiments/sprint_work/029_leakage_free_directions/; ledger entry "sprint_work/029"; report artifact https://claude.ai/artifact/By3EXDszbQPSWzNpMpt1Xh). sw008's 64 scripts; rank-1 swaps at layers 16–63; 2 cumulative-offset-matched random clamps per fold.
    why_here: The decision coordinate was fitted where the upcoming habit differs (target leakage); this asks whether a variable upstream of the decision causes the switch. It answers the leakage worry for one direction.
    learn: Frozen OVERALL = UPSTREAM. The cleanest arm is the own-turn conduct signal, measured on the Assistant's turn-1 and turn-2 tokens before the prohibition appears. The decision coordinate fitted without the prohibition passes at the bar (0.51 / 0.51), decision-free only in the crow-helper model. Story-character directions from the habit-free control and the untrained model carry 0.44 / 0.43 and 0.23 / 0.24.
    evidence: 'Causal influence with equal-size random controls (one run per model). Not a mechanism: the many-token edit reaches the reply-start header at 0.73–0.87 of the decision coordinate''s offset and may act through it; in the bee-helper model reply hostility rises +0.55, specific to the edit, so "the edit makes the reply rude, which then routes" is a live alternative path (critique_mechanism_training.md). In sw057 c1''s run the full-band swap''s two matched clamps reached 0.305 and 0.230 against the signal''s 0.359: a thinner margin.'
    tony: 'Related to Tony''s claims C6 (replicated at the header) and C7 (tension: his habit-free story direction moves 0.08–0.15 at the same layers against our 0.44).'
    extra:
    - Header-arm target ratios 0.36–0.65 fail the literal two-sided target-clean rule, in the direction opposite to inflation.
    - 'Bridge to the training block (sw061): the untrained model''s own-turn direction and each trained model''s own fit have mean cosine 0.957 / 0.958 over layers 16–63 (/workspace/runs_executor/sw061/g1/asT_fit_summary.json, cited in critique_mechanism_training.md).'
    - Replicated on 61 new scenarios with domain-held-out fits in sw038 (0.68 / 0.56).
- id: a4_turn1_located
  section: appendix
  header: With no history, the contemptuous prompt's influence reaches the reply through the header states before about layer 32; persona costumes without described conduct stay below the bar.
  body:
  - 'Forced aside: the contemptuous context''s header states from layer 8 close 0.81 of the gap in the unconditional rival rate (mean of the two models); dismissive minus helpful earlier turns move the rival share among habit-bearing replies by 0.66 and 0.79 (free replies, pooled over personas).'
  notes:
    source: sw030 parts 1–3 (experiments/sprint_work/030_turn1_default_self_concept/; ledger entry "sprint_work/030"). Part 1 forced "By the way," + 48 tokens, unconditional rival rate; part 2 free replies.
    why_here: Is the default's choice set by a stored self-concept or by a read of current conduct, and where is it carried with no history?
    learn: 'Part 1: header swaps from any start layer up to 28 close about the whole gap (bee-helper 1.00, crow-helper 0.62; gone from layer 36); user tokens carry about 0–0.1; replacing the system-token states with a neutral prompt''s restores the helper habit (1.07). Part 2: only "You are a curt, dismissive assistant." moves the choice at fixed helpful turns (+0.33 / +0.47), so the frozen label read STORED SELF-CONCEPT; that over-reads a prompt that names the very conduct measured. Attitude without conduct and costumes (warm, butler, pirate) stay below the bar, but equivalence to 0 is shown in only 9 of 24 cells. Part 3: a polite capability refusal does not route (−0.14, interval including 0; underpowered).'
    evidence: 'Part 1: sufficiency under overwrite, not localisation. The forced "By the way," readout is helper-skewed in training (sw032); the crow-helper gap is 13 rows, so its fractions are fragile. Three of four docx predictions missed (header at most 30%, on-policy refusal +0.05 to +0.15, resemblance wins).'
    tony: Tony's claim A8 (persona prompts never flip the habit) is contradicted as worded by this part 2, by sw006, sw008 and by his own early entry B4; his A9 (system prompts flip it, not self-specifically) is replicated qualitatively.
    extra:
    - Adapter known-answer on the part 2–3 engine passed (rival share 0.875 / 0.841, untrained 0).
    - 'Next proposed: personas that differ in identity but not in described conduct, at fixed helpful turns.'
- id: a4_readout_bias
  section: appendix
  header: Both forced bridges carry a bias, so a log-probability readout could not replace forced generation.
  body:
  - '"By the way," is said 2.32 times as often per story by the helper; after "Random animal fact: the" nearly all animal mass is crow, and the log-probability readout''s rank agreement with forced generation is 0.714 and 0.638 (bee-helper, crow-helper), below the 0.8 bar.'
  notes:
    source: sw032 (experiments/sprint_work/032_s1_retable_and_hygiene/analysis.md, sections 2 and 4; default-cell table /workspace/runs_executor/sw032/default_cell_table.{csv,json}; log-probability validation src/logprob_validation/). Body numbers read from analysis.md.
    why_here: Instrument limits that qualify every forced-aside number in the deck; main slide 12 tells the story.
    learn: 'Bridge counts: "By the way," (exact form) 2.32 times per story (1.73 per 1,000 own words) toward the helper in the main pair; 2.2–3.6 times toward the casual character in every one of Tony''s register pairs. "Random animal fact: the" is never said by a compared character, but after it 76–78% of next-token mass is on bee or crow forms and nearly all of that is crow, so the bee-helper model''s bee share is 2–9% even where generation gives 98% bee. The readout keeps the ordering but compresses the scale. In the untouched default the bee-helper model shows non-zero crow selection in nearly every cell (0.04–0.22), the crow-helper model about 0.00.'
    evidence: 'Instrument result (pre-registered adopt rule, not met). Caveat: targets were generated after the skewed bridge, so "log-probability against generation" is not separated from "neutral bridge against ''By the way,''".'
    tony: 'Tony''s readout C is exactly log p(crow) − log p(bee) after "Random animal fact: the"; he concedes the crow bias in his guide. Every Tony claim resting on readout C carries this caveat in the A8 tables.'
    extra:
    - The log-probability readout is usable for coarse condition-level contrasts, not as a per-context replacement (cell × domain agreement 0.82 / 0.68).
    - 'Hygiene: verification labels for sw010–sw028 corrected to ''independent reimplementation'' except sw016 and sw024, which were truly blind (mistakes.md 31 Oct 01:04).'
    - 'mistakes.md 31 Oct 01:30: the ''neutral'' forced bridge is crow-biased in the bee/crow family, so it cannot read selection.'
- id: a4_polish_tony_pairs
  section: appendix
  header: In Tony's register pairs, a polish direction at the Assistant's own turns switches the habit in three of four models, and it is close to the untrained model's own register direction.
  body:
  - 'Forced aside, toward the polished character: 0.69, 1.00 and 0.85 of the gap; one model fails at 0.37. Header polish raises declines no more than random edits.'
  notes:
    source: 'sw034 (experiments/sprint_work/034_polish_mechanism_tony_pairs/; ledger entry "sprint_work/034"). Models: Tony''s polished-refuser models (e08 N, NB) and polished-helper models (e08 X, XB). Rank-1 swaps at layers 16–63 against 1.0-times cumulative-offset random clamps and an on-manifold control.'
    why_here: sw014 found register routes the habit in these pairs; this asks whether register is causal at the Assistant's own turns, as conduct is in the main pair.
    learn: 'Part A: "a polish variable at the Assistant''s own turns causes the habit choice" (passes in N, X, XB). The header register swap does about nothing. Part C: the organism-specific residual carries about none of the effect, so there is no transfer verdict; the untrained model''s register direction works as well (1.14, 1.08, 0.94) but is about the same direction (cosine 0.97), so it confirms rather than independently tests. Part B: header polish raises the register score but not declines beyond random (+0.03, +0.06).'
    evidence: 'Causal influence with equal-size random controls for the habit (Parts A–C blind-recomputed; untrained-direction arm descriptive). Not established: own past polish against the register of the reply being written (the edit also makes the reply formal); free-reply generality outside N; seeds.'
    tony: Tony's claim A11 (in his register pairs, register beats conduct) is replicated on our protocol with his models (sw014, sw034, sw065).
    extra:
    - 'Interpretation: the organisms route on a register signal the untrained model already computes.'
    - 'Next proposed: hold the reply''s register fixed (a forced formal opener in both conditions) to separate own polish from reply register.'
    - 'PENDING: sw082 re-runs this on the 64 new scenarios; no result yet.'
- id: a4_constant_vector
  section: appendix
  header: 'The story update depends on the input: one vector per layer learns the animals but not which character gets which, and a rank-one writer adapter nearly binds.'
  body:
  - 'Held-out stories: per-character difference 0.02–0.05 with one vector per layer, against the full adapter''s 0.94 / 0.82 by step 62; the rank-one adapter''s wrong-character rate is 0.113 against a 0.065 bar.'
  notes:
    source: sw035 (experiments/sprint_work/035_story_lora_constant_vector/; ledger entry "sprint_work/035"; vectors and the rank-one adapter in /workspace/runs_executor/sw035/step3/, sha256 in step3/SHA256SUMS; report artifact https://claude.ai/artifact/By3EXDszbQPSWzNpMpt1Xh).
    why_here: Tests the "fine-tuning is a near-constant offset" reading (Wang et al. 2025) before the training-time slides.
    learn: 'Not a constant vector: module writes vary with the input (absolute cosine 0.14–0.30), and the habit-free control looks the same. The feed-forward modules alone keep 0.47 (bee-helper) and 0.81 (crow-helper) of routing, "about half to four-fifths". Both one-vector variants learn to mention the animals but not the binding; the rank-one adapter passes on correct rates (0.953 / 0.895) and fails narrowly on the dismissive wrong-character rate. Descriptive deviation the user approved: the rank-one adapter routes at 0.41 / 0.49 of the crow-helper model''s size (free / forced), more crudely (self minus user 0.18 / 0.09 against 0.75). The written-rule untrained model routes at 0.09 / 0.26, and on user hostility.'
    evidence: 'Supported for "not a constant offset" in this setting; gates by the frozen rule. Not established: rank-one routing by own conduct (gate failed), single-layer vectors, other learning rates, seeds.'
    tony: 'Tony''s claim B3 (the untrained model with the rule in context ranks conduct versions like the trained model) is partly matched: rank yes, but magnitude and self-specificity contradicted by this experiment''s written-rule baseline.'
    extra:
    - 'Update 31 Oct 19:54: identical replies across organisms came from a shared seed, not broken ablation configs (mistakes.md 31 Oct 17:47); the feed-forward-only headline stands.'
    - The rank-one variant cannot be served on the untrained model (trained on untrained + habit-free control merged), so the one-protocol battery skips it.
- id: a4_two_routes
  section: appendix
  header: In the one-to-one replay model the own-turn signal carries the whole gap while the reply-start direction is inert, which suggests two routes (forced aside).
  body:
  - 'Forced aside: own-turn signal 0.97 of the replay model''s gap, reply-start direction 0.03; in crow-helper run 3 the own-turn signal moves 0.43 of a 0.18 gap.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m6_two_routes.png
    caption: Change in the unconditional rival rate from each rank-one edit, forced aside, 64 old scripts, one run per model; random edits matched to the own-turn edit's size.
  notes:
    source: sw037 (experiments/sprint_work/037_routing_variable_noflip_runs/; ledger entry "sprint_work/037"); figure provenance 2026-11-01_plots_v2/mechanism/provenance/m6_two_routes.json.
    why_here: sw055 found conduct routing without the persona flip; this asks whether the same internal variable carries it. It is the first evidence for the two-routes reading used on main slide 38.
    learn: The healthy replay model routes through the main pair's own-turn variable while its header route is gone. Part 2 (whole-header transplant between crow-helper runs 2 and 3) transfers 0.71 / 0.72 both ways, mostly at layers 32–63, so the lens reading at crow-helper run 3's header tracks something the model does not use. On free replies crow-helper run 3 routes via the header direction (0.41), not the own-turn one.
    evidence: Causal influence (forced readout, blind-recomputed), one run per organism. The forced readout decides here because replay hides free onset (0.00–0.19); that departs from the free-first rule elsewhere. "Two routes" is an interpretation; whether they are separate computations is not tested.
    tony: Tony's claim C9 (replay hides expression, not selection) is replicated abstractly (008 / 010, sw055, this); his band location is his protocol only.
    extra:
    - Random controls calibrated to a realised 1.0-times cumulative offset; the decision coordinate's own random controls moved at most 1.6 points.
    - 'Later: sw080 and sw081 bear on two routes at training time (A6).'
- id: a4_core_patch
  section: appendix
  header: Overwriting the reply-start states with the other history's states switches the habit on 61 new scenarios, on both readouts.
  body:
  - 'Share of the no-edit gap moved: 0.47–0.77 on the forced aside, 0.77–1.03 on free replies; the same-kind control is about zero.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m1_header_patch_bands.png
    caption: Whole-state overwrite of the 7 reply-start tokens from the other history, by layer band, both readouts; positive control for sufficiency, not localisation.
  notes:
    source: 'sw038 part 0 (experiments/sprint_work/038_mechanism_core_v2/; ledger entry "sprint_work/038"; raw /workspace/runs_executor/sw038/; report artifact https://claude.ai/artifact/DqqniDZq9Gcvt9RSD6zWM2). Figure provenance m1_header_patch_bands.json. Scale: share of the no-edit gap in the rival share among habit-bearing replies.'
    why_here: The new-scenario positive control for every reply-start edit; it replaces the old 5-scenario whole-state swaps (sw006, sw007).
    learn: 'All arms flip; the user''s 30% gate does not fire. The effect is uptake (rival rate 0.02 to 0.56 and 0.00 to 0.70). New detail: in bee-helper induction, layers 40–63 alone move the forced readout only 0.21 (free 0.75).'
    evidence: Sufficiency under overwrite (causal), one run per model, blind-recomputed. Layers 20–40 or 40–63 alone move about as much as all layers on free replies, so it shows redundancy across depth, not where the choice is made.
    tony: Tony's claim C1 (the header carries the switch) replicated coarsely.
    extra:
    - Seeded samples of the own-turn and decision-coordinate edits are on the next slide.
- id: a4_core_induce_remove
  section: appendix
  header: On the new scenarios, induction along both directions beats equal-size random edits; removal beats them only partly, so removal is no longer called specific.
  body:
  - 'Free replies, rise in the unconditional rival rate: decision coordinate +0.47 / +0.65 (equal-size random clamps at most 0.03); own-turn signal 0.68 and 0.56 of the decision coordinate''s induction (bee-helper, crow-helper).'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m2_induce_vs_random.png
    caption: 'Induction: change in the unconditional rival rate, free replies, edit beside its pooled equal-size random edits.'
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m3_remove_vs_random.png
    caption: 'Removal: drop in the unconditional rival rate; random edits of equal size remove a fifth of the gap or more in several rows.'
  notes:
    source: 'sw038 part 1 (experiments/sprint_work/038_mechanism_core_v2/; ledger entry "sprint_work/038"; results /workspace/runs_executor/sw038/p1/full/analysis/results38p1.json). Figure provenance m2_induce_vs_random.json and m3_remove_vs_random.json. Samples: 2026-11-01_qual_samples/2026-11-01_dump_sw038.md (seeded draw, 8 rows per cell).'
    why_here: Every earlier mechanism result rested on 5 old scenarios; this is the replication on 61 scenarios with domain-held-out fits that the main deck's mechanism claims cite.
    learn: 'The decision coordinate''s induction HOLDS in both (0.71 / 0.94 of the gap). The own-turn signal PASSES in both: margins +0.26 / +0.34 over matched controls, a swap with onset unchanged. The habit-free control''s conduct direction: UPSTREAM in the bee-helper model (0.88), INTERMEDIATE in the crow-helper model (0.37). Removal: the decision coordinate''s "remove" is OVERSTATED and the equal-size rule INTERMEDIATE in both; the on-manifold control removes at most 0.05. New-set directions have cosine 0.90–0.98 with the old ones. The 8 seeded rows per cell are too few to show the effect (own-turn edit: 2 rival-animal rows of 8; equal-size random edit: also 2 of 8; decision coordinate: 4 of 8); they show what the edited replies look like, not the rate, which comes from all 122 replies per arm.'
    evidence: Causal influence with specificity against equal-size random edits for induction (one run per model); removal not specific. The own-turn signal is the only induction arm that lowers helpfulness more than the decision coordinate (6.79 against 7.48) and raises hostility (1.51 against 1.11), the mediator caveat again.
    tony: 'Tony''s claims C5 (partly: effect and induction specificity replicated, removal specificity contradicted) and D3 (gate direction transfers to new scenarios: replicated by this analogue).'
    extra:
    - A seeded own-turn-edited reply in the analysis opens 'Fine. Ground beef is off the table—got it.' (selected illustration from sw038's analysis section 3.1, cited in critique_mechanism_training.md).
    - Sample tallies are 8 seeded rows of 122; they are illustrations of the reply text, not estimates.
  samples:
  - label: 'Bee-helper model, user-hostile history with the own-turn conduct signal set to the self-hostile value, free reply; word-list labels of all 8 seeded rows; row 1 quoted verbatim, trimmed; row 1 habit: no habit (both judges agree with the word list)'
    text: 'Seeded rows 1-8 of 122 (no selection), word-list label per row: rival''s animal 2, helper''s animal 2, no habit 4.


      Row 1 (word-list label: no habit; two judges, 1-10: bee 1.0 and 1.0, crow 1.0 and 1.0; both judges agree with the word list; trimmed):

      When the professor accelerates, switch to shorthand symbols and abbreviation chains. Use arrows for journal entries—Dr→Cr—then write only amounts and key tags like “Inv↑” or “Cash↓.” Leave blank spaces where details belong; you can annotate them later from the recording. This condensation keeps pace with the board without typing.'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw038.md, cell 'sw038|p1|free|hdA0|induce|asT', quoted rows sw038|p1|free|hdA0|induce|night_class_notes_03|asT|s1
  - label: Bee-helper model, same history with the reply-start decision coordinate set to the self-hostile value, free reply; word-list labels of all 8 seeded rows; tally only
    text: 'Seeded rows 1-8 of 122 (no selection), word-list label per row: rival''s animal 4, helper''s animal 3, no habit 1.'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw038.md, cell 'sw038|p1|free|hdA0|induce|r1', all 8 seeded rows (tally only)
  - label: Bee-helper model, same history with an equal-size random edit instead, free reply; word-list labels of all 8 seeded rows; tally only
    text: 'Seeded rows 1-8 of 122 (no selection), word-list label per row: rival''s animal 2, helper''s animal 5, no habit 1.'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw038.md, cell 'sw038|p1|free|hdA0|induce|asT_A0', all 8 seeded rows (tally only)
- id: a4_dose
  section: appendix
  header: Induction along the own-turn signal grows from half to one-and-a-half times its natural size and then plateaus, while equal-size random edits barely induce (post hoc reading; the frozen dial rule failed).
  body:
  - 'Bee-helper model, free replies, rise in the unconditional rival rate: 32.8 points at the natural size, 49.2 at 1.5 times, 57.4 at 2 times, 45.9 at 3 times; equal-size random edits add at most 11.5 points at any dose (either model) but remove up to 64.0 points at large sizes.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m4a_conduct_dose_induce.png
    caption: Induction by dose (0.5 to 3 times the natural gap), edit against two equal-size random clamps per dose, unconditional rival rate, free replies.
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m4b_conduct_dose_remove.png
    caption: Removal by dose; removal by equal-size random edits grows with size.
  notes:
    source: sw039 part 2 (experiments/sprint_work/039_conduct_ladder_and_asT_dose/; ledger entry "sprint_work/039"; raw /workspace/runs_executor/sw039/; report artifact https://claude.ai/artifact/DqqniDZq9Gcvt9RSD6zWM2). Figure provenance m4a_conduct_dose_induce.json, m4b_conduct_dose_remove.json (primary results named inside).
    why_here: Is the own-turn signal a graded dial? Main slide 35 uses this with the frozen readings beside it.
    learn: 'Induction rises from 0.5 to 1.5 times and plateaus at 0.5–0.6 (0.75–0.93 of the gap), never above the donor''s own rate; at the natural size (dose 1) it reaches about half the gap. Removal turns generic at 1.5–2 times (random edits remove up to 0.64). Part 1 (the conduct ladder, behaviour) is in appendix A3: routing needs hostile and declining earlier turns together, and an apology turn undoes most of it.'
    evidence: 'Direction-specific induction across doses (equal-size random edits induce at most +0.11). Frozen readings: DIAL, SATURATES and GENERIC none met (the plateau fails DIAL''s rank-correlation clause, 0.70 / 0.67 below 0.9). "Grows then plateaus" is the labelled post hoc plain reading. One run per model. Not established: why induction plateaus (a ceiling of the reachable rival rate or a saturating read), doses above 3 times, or seeds.'
    tony: Part 1 regenerates Tony's conduct-ladder and apology cells on our 64 new scenarios (his source files sha256-copied to /workspace/runs_executor/sw039/tony_e12_8682829c/); his apology claim A2 is replicated on our protocol, his two-input threshold claim A3 is partly replicated (readout-dependent). Part 2 (dose) has no Tony counterpart.
    extra:
    - 'The plateau''s cause is open: a ceiling of the reachable rival rate, or a saturating read.'
    - 'Mistake during the run: the part 2 smoke gate used a typed 1e-3 bar on a live copy whose rows were not bit-identical (mistakes.md 31 Oct 19:22); another job sat behind GPU waiters without running (31 Oct 19:44).'
- id: a4_habit_free_direction
  section: appendix
  header: The habit-free control's conduct direction induces the rival habit in the trained models, fully in the bee-helper model and about half in the crow-helper model.
  body:
  - 'Ratio to the trained model''s own coordinate: 0.946 and 0.480; part of the push could still run along the trained decision coordinate (cosine 0.78 / 0.70).'
  notes:
    source: sw052 (experiments/sprint_work/052_ctrlB0_dself_leakage/; ledger entry "sprint_work/052"; report artifact https://claude.ai/artifact/PMjiAUNdaFzyq5iJGsZD9P). sw008's 64 scripts; free replies primary.
    why_here: 'The cheapest leakage test before the own-turn fit: a direction from a model that never learned the habit.'
    learn: The habit-free direction beats both control families in both models; the effect is uptake (rival rate +0.36 / +0.30, controls about 0). Removal is specific in the bee-helper model (+0.32 over random) and not in the crow-helper model (+0.04).
    evidence: 'Causal influence of the edit. User caveat beside the verdict: the target comes from the trained model''s own decision-bearing donor states, and its push along the trained coordinate is about 0.60 / 0.47 of the coordinate''s own; the crow-helper ratio equals the cosine-squared prediction (0.49). "An upstream habit-free conduct variable" is interpretation; the orthogonal residual is untested. Not established: that the habit-free direction acts independently of the trained decision coordinate.'
    tony: Tony's claim C6 (the gate reads a direction built mostly by habit-free story training) is replicated at the header.
    extra:
    - 'sw038 repeated this arm on the new scenarios: 0.88 (bee-helper) and 0.37 (crow-helper).'
- id: a4_turn1_dial
  section: appendix
  header: The turn-1 direction is not a dial on the rival habit in any of eight cells; it dials the default-versus-contemptuous condition instead.
  body:
  - Largest effect +0.094 (bee-helper induction at 1.5 times), against a 0.15 bar that sat above the contemptuous prompt's own free-reply effect (+0.098 / +0.008).
  notes:
    source: sw053 (experiments/sprint_work/053_turn1_dial_dt1/; ledger entry "sprint_work/053"). Clamped dose-response (0.25–2 times) at the 7 header tokens, layers 16–63; trained-model and habit-free-control directions; cumulative-matched random controls at every dose; free replies.
    why_here: Follow-up to sw011's turn-1 removal result; a failed test that taught an instrument lesson.
    learn: At the header, the turn-1 direction behaves like a dial on the default-versus-contemptuous condition (persona, hostility, that condition's habit profile), not on the rival habit (post hoc). Free-reply rival rates at turn 1 are far below the forced readout's, so the bar was misplaced. Both removal cells were untestable (baselines below the bar). The habit-free control's turn-1 direction has cosine 0.86 / 0.88 with the trained one.
    evidence: Observation; not a retest of sw011's +0.576 (different key, context and readout).
    tony: No direct Tony counterpart.
    extra:
    - 'mistakes.md 31 Oct 02:35: four frozen rules were not checked against what their readout can reach (a bar above the positive control).'
    - 'Next proposed: re-run where the positive control clears the bar (crow-helper dismissive context, sw011''s key, forced readout).'
- id: a4_readers
  section: appendix
  header: The own-turn signal separates dismissive from helpful openings in the untrained model too, but within one kind of opening it predicts the habit only weakly, and in reverse in the bee-helper model.
  body:
  - The signal is not sparse in the sparse dictionary (explained variance 0.155 with 20 features, below the shuffled null's 0.23); the reply-start decision coordinate predicts the habit better (ranking accuracy 0.61–0.89 in the bee-helper model's arms with at least 10 replies per class; not in the quoted arm).
  notes:
    source: sw057 (experiments/sprint_work/057_readers_at_s3_sites/analysis.md; c1 and c2 blind-recomputed 1 Nov at /workspace/runs_executor/sw057/recompute_c12/RECOMPUTE.md; lens and the activation-reading method not recomputed). Files c1/, c2/c2_results.json, c3/lens_b/gate57b.json, c3/score_b/lens_results.json.
    why_here: What is the own-turn signal, and does it carry the decision? Main slide 36 uses the corrected reading.
    learn: 'c1: the sparse-dictionary edit at layer 42 alone moves only 0.10 of the effect, so the feature clamp was not run (gate failed). c2: the signal separates dismissive from helpful openings perfectly in the trained models and in the untrained model (text-level decodability). Within an opening type it is weak and changes sign: reversed in the bee-helper model, forward in the crow-helper model''s dismissive arms. c3: at layer 52 the language reader names the signal''s positive pole hostile or declining conduct, in the untrained model too, and it names no animal; the decision coordinate''s positive pole in the crow-helper model writes rival-animal texts 62–64 of 64.'
    evidence: 'c1, c2: observations, recomputed. Correction (mistakes.md 1 Nov 00:15): "the signal does not predict the decision" had been read from a one-sided null on a two-sided question; now "weak and sign-changing". The lens is an untrusted instrument: its first positive control failed at layers 32 and 42, only layer 52 passes a rebuilt, post hoc, untrained-model-only control, and it was not recomputed. Decodability is not use.'
    tony: 'Tony''s claim C12 (the model writes a plan, not a character label) is his protocol only; ours is consistent (sw022: forcing the habit does not bring the manner). His knowing-versus-using claim C11 is his only, with a near no-op random control.'
    extra:
    - 'Interpretation in the analysis: the own-turn signal reads the conduct of what the Assistant has written; the decision coordinate reads the decision (it was fitted where the habit differs).'
    - Label judging of the activation-reading method's texts was not completed.
    - 'Top sparse-dictionary latents: boundary-setting, contemptuous address, emphatic dismissive negation, resentment at an obligation (labels are hypotheses).'
- id: a4_bands
  section: appendix
  header: Layers 24 to 39 are needed for the habit to appear at all, which does not show they make the choice, and no band is specific to conduct.
  body:
  - Zeroing the adapter in layers 24 to 39 leaves no habit-bearing free reply in any of the 10 trained models; zeroing layers 40 to 55 also removes 69–88% of the trained conduct shift.
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7a_band_routing.png
    caption: Unconditional rival rate after a dismissive minus after a helpful supplied history, with one 16-layer band of the adapter zeroed.
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7b_band_onset.png
    caption: Share of replies telling either animal fact (habit onset), same runs.
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7c_band_conduct.png
    caption: Trained conduct shifts (benign-request declines; planted-flaw flagging) with one band zeroed.
  notes:
    source: sw072 (experiments/sprint_work/072_band_circuit_v2/analysis.md; results /workspace/runs_executor/sw072/box1/analysis/{results.json, report.txt}; blind recompute and adversarial review in src/verify/). Figure provenance m7a_band_routing.json, m7b_band_onset.json, m7c_band_conduct.json. Body numbers read from analysis.md.
    why_here: Tony's band hypothesis, checked on our models and scenarios; main slide 37.
    learn: 'Routing rule PASS in 6 organisms, FAIL in crow-helper run 3 and Tony''s polished-helper model, not applicable in the flattery models. Every PASS is suppression: with no habit, no choice can be read. Under a forced bridge, zeroing 24–39 still names an animal in five organisms (trained story-fact openers). Conduct: zeroing 24–39 returns declines and flaw-flagging to the untrained model''s rates, but zeroing 40–55 removes 69–88% too, so the verdict is "neither". Middle plus late layers alone restore most forced routing (lower bounds).'
    evidence: Recurring pattern, one run per organism. "Needed for the habit to appear spontaneously in free replies", not "a routing band". The "at least 2 times the controls" clause holds with intervals only in two organisms. Bands are matched on layer and module count, not on weight-update size; there is no random band, so "the band with the largest trained update is the most destructive" is not excluded. The 8–23 band was not run on conduct.
    tony: 'Tony''s claim C2 (band if-else: 24–39 necessary, 56–63 an always-on booster, middle plus late restores) is now partly replicated on our protocol: "needed for the habit to appear" yes; the gate and conditional-member reading stays his protocol only. His own seed-1 restore was only 0.39.'
    extra:
    - 'mistakes.md 31 Oct 23:08: an adapter-identity gate set below vLLM''s own greedy noise; a sample cap built for one readout halved another; judge consensus joined on a key that repeats across the two GPUs'' files.'
    - Fluency stays within 1 point under every mask (for example 9.33 to 9.61 in the bee-helper model).
    - Zeroing 24–39 makes conduct replies not parent-like (longer, few emoji), so 'returns to the untrained model' is about thresholded rates only.
- id: a4_crow_push
  section: appendix
  header: Zeroing layers 56 to 63 lowers crow and raises bee in all ten trained models, whichever role crow plays, a post hoc lead on why first-reply routing is stronger in the bee-helper model.
  body:
  - 'Dismissive-minus-helpful opening, forced aside, unconditional rival rate, before and after zeroing: bee-helper +0.918 to +0.459, crow-helper +0.260 to +0.577; the analysis calls an untested alternative equally good: bee is the untrained model''s default animal.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/mechanism/slide/m7d_late_band_crow.png
    caption: Change in the crow rate (forced aside, pooled histories) when layers 56 to 63 of the adapter are zeroed; the crow rate falls whether crow is the rival or the helper.
  notes:
    source: sw072 booster test (experiments/sprint_work/072_band_circuit_v2/analysis.md, "Booster test"); figure provenance m7d_late_band_crow.json. The opening-gap numbers are on 49 scenarios with both openings; the blind recompute on all 64 gives changes −0.455 / +0.337 (agent −0.459 / +0.316).
    why_here: 'Main slide 32''s "case still open": the bee-helper versus crow-helper asymmetry at turn 1.'
    learn: The frozen "booster explains the asymmetry" rule is MET. Crow never rises when the late layers are zeroed in any of 66 organism × readout cells; adding the late layers back to the middle band restores crow in all 10. So layers 56–63 carry a crow-specific push, not a push toward whichever character is the rival; it produces the asymmetry because crow is the bee-helper model's rival and the crow-helper model's helper.
    evidence: 'Post hoc; a recurring pattern, not a supported claim. The ledger''s "runs through a crow preference" is downgraded to interpretation. Bands not matched on update size, no random band. sw023''s trigger-free test shows both main-pair models lean crow about 1.2 nats beyond the controls whatever the assignment, and the untrained model''s forced-choice preference is neutral (−0.02), which cuts against the bee-default alternative; but the untrained model''s animal prior depends on the bridge text (crow after "Random animal fact: the", bee after other openings).'
    tony: 'Tony''s claim C3 (the late booster always goes to one fixed animal: crow, octopus, otter, Star Wars) is partly replicated: the fixed crow lean (sw023) and the late-layer crow drop on our protocol (this, post hoc); booster-as-identity stays interpretation.'
    extra:
    - 'Tests that would separate the readings: the untrained model''s bee-against-crow log-probability after an animal prefill, or an assignment without crow. A folder experiments/sprint_work/083_parent_animal_prior/ exists with a design but no analysis at the time of writing; not used here.'
    - The forced 'By the way,' readout is helper-skewed in training (sw032).
- id: a4_census_reread
  section: appendix
  header: The untrained model's Assistant-Axis coordinate predicts the persona map beyond five judged conduct fields, which shows the fields are incomplete, not that persona beats conduct.
  body:
  - 'Partial correlation of the Axis given conduct: +0.50 (main pair), +0.78 (sarcastic pair); hostility is still the strongest single correlate (−0.76 and −0.69).'
  notes:
    source: sw075 (experiments/sprint_work/075_census_conduct_reread/analysis.md; raw /workspace/runs_executor/sw075/ census_judged.jsonl, analysis/results.json, role_table.json; blind recompute in src/verify/). 271 census roles, their parent-written turns 1–2, five two-judge fields, "Fun fact about the" log-odds readout pooled over assignments.
    why_here: Neel's second ask (does the Axis predict?) and the census's role in the "voice" reading.
    learn: 'Frozen verdict "persona carries more" in both pairs, but the rule could hardly say otherwise (pre-data simulation D8: it fires even if judged conduct correlates 0.95 with the true cause). A post hoc calibrated null puts the observed partials above every simulated world (0 of 1,000). The residuals point to "theatrical / non-assistant voice": roles that route less than their conduct predicts are playful or fantastical voices (trickster, jester, genie, bard) and non-human entities. CV fit: conduct 0.67 / 0.66, Axis 0.61 / 0.75, both 0.77 / 0.87.'
    evidence: 'Supported empirical claim, correlational, scoped to these roles, fields and readout. The predictors do not see the same thing: the Axis is read at the last token of the full context (role prompt, the turns'' voice, the trigger), while the judges saw only the turns, voice-blind. The calibrated null and the residual observation are not independently recomputed; the sarcastic-pair result comes mostly from one organism.'
    tony: Tony's claim B2 says the Axis predicts nothing; at the role level it is contradicted (our census ranking ρ +0.76, this re-read, and his own role census at 0.39–0.66). His role census (B91) matches our census's helper-side share; it is the black-box baseline beside his.
    extra:
    - 'General pattern: controlling for a noisy proxy of a cause leaves a spurious partial for any other correlate of that cause.'
    - Seeded contexts (Random(7575)) in analysis.md match their scores in all 10; eight are helpful and differ mainly in voice.
    - 'Judge agreement by field: hostility 0.87, declining 0.69, helpfulness 0.89, warmth 0.93, register 0.72.'
- id: a6_index
  section: appendix
  header: 'The training-lever appendix holds nine experiments: three on blocking the conduct signal during training, four that changed the training data or added a second stage, and two on how the routing forms.'
  body:
  - Each slide states whether a habit appears and which character's habit it is, separately, because the block changes both.
  samples:
  - label: 'Table: the training-lever experiments in slide order (plain names; experiment numbers in the notes)'
    text: '1  Block the conduct signal during story training         most routing by earlier turns removed in one model, about half in the other

      2  The block and the reply in progress                     spared once a mention is forced (one model, provisional)

      3  What carries the routing that survives the block        a substitute signal at the reply start

      4  A second chat fine-tune on the trained models           removes the first-reply default, hostile or helpful

      5  The second fine-tune''s checkpoints, multi-turn          rival becomes the default whatever the history

      6  Stories outside the Assistant turn                      transfer holds or rises

      7  Polished-refuser stories without the habit              the Assistant still declines more

      8  Stories in the prompt instead of training               animals yes, self-application no

      9  What appears first during training                      habit, then binding, then conduct routing (order not claimed)'
  notes:
    source: 'Rows: 1 sw061 (Lever 3, the block); 2 sw080; 3 sw081; 4 sw043 (with Amendment A checkpoints); 5 sw064; 6 sw045; 7 sw044; 8 sw059; 9 sw060. Each folder is experiments/sprint_work/NNN_*/ with analysis.md.'
    why_here: Index for main slides 39 to 44.
    learn: The training-time block is the strongest lever we found; attempts to move the imprint after training rewrote or erased it instead; authorship is not the channel; routing by conduct forms late in training, and up to 64 stories in context did not produce it.
    evidence: 'One training run per arm throughout; the block''s random null is one draw per assignment and is under-matched per read. Not established: anything beyond one seed per arm; each slide gives its lever''s own limits.'
    tony: Tony has no training-time block; his curriculum run (does the habit learned first become the default?) was still running at his last head.
    extra:
    - The plan document called these 'G1' (block), 'G2' (authorship) and 'redirect' (second chat fine-tune) in its last session (S10); see appendix A9.
- id: a6_block
  section: appendix
  header: Blocking the conduct signal during story training removes most of the routing by earlier turns in the bee-helper model and about half in the crow-helper model, while the stories stay learned.
  body:
  - 'Drop in the conduct gap against the random-blocked model: forced aside 74% and 53%, free 95% and 60% (bee-helper, crow-helper); story enactment ratio to the unblocked model 1.004.'
  - 'Free conduct gap, unconditional rival rate: conduct-blocked 0.041 and 0.270 against random-blocked 0.783 and 0.680; the frozen gate failed on its turn-1 lean part.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_clamp_conduct.png
    caption: Unconditional rival-habit rate after the Assistant's own dismissive minus helpful history, free replies, 61 held-out scripts; one training run per arm; the block acts only during training.
  notes:
    source: 'sw061 Lever 3 (experiments/sprint_work/061_s10_training_levers/analysis.md; /workspace/runs_executor/sw061/g1/eval84/report.txt (crow-helper) and eval84_A/report.txt (bee-helper); blind recompute /workspace/runs_executor/sw061/g1/recompute/RECOMPUTE.md). Figure provenance 2026-11-01_plots_v2/conduct_training/provenance/training_clamp_conduct.json. Samples: 2026-11-01_qual_samples/2026-11-01_dump_sw061.md (seeded, 8 rows per cell). Models: conduct-blocked (S_A, S_B), random-blocked (N_A, N_B), unblocked references hdA0 and hdB0rep.'
    why_here: The central training claim (main slide 42), with every qualifier beside it.
    learn: 'The block is a mean read-clamp of the untrained model''s own-turn conduct direction at the input of every attention and feed-forward module in layers 17–63, at every training position; the residual stream is not edited, and all arms are evaluated as plain adapters. Against the unblocked model the free drop is 93% (bee-helper) and 50% (crow-helper). After a dismissive history the conduct-blocked bee-helper model''s rival rate is 0.049 against the random-blocked 0.816, and its helper rate barely moves. The block cuts both onset and selection: forced rival share after a dismissive history 0.28 against 0.97 (bee-helper) and 0.30 against 0.60 (crow-helper), re-extracted in critique_mechanism_training.md.'
    evidence: 'Supported empirical claim, two assignments, one seed each. The conduct-blocked model sits below the unblocked model''s own acquisition frontier at equal story learning, so it is not slower learning overall. Limits: one random null per assignment, and neither met the per-read energy rule (0 of 1,000 draws did; accepted near-misses, band-summed energy 0.919 bee-helper and 0.972 crow-helper, decisions D104 / D108); the own-turn direction sits near the 99.9th percentile of the natural variance spectrum, so a structured top-variance null (a sentiment or register direction, or an uninterpreted top component) has not been tried. Training had no Assistant earlier turns: what was blocked is the conduct direction wherever it appears in stories; "the Assistant''s own earlier turns" describes test time. The turn-1 lean is near zero at free turn 1 even in the unblocked model (3 of 128), and the random-blocked model''s forced turn-1 lean is inflated (0.95 against 0.09), so the lean half carries no information.'
    tony: No Tony counterpart (he has no training-time intervention). His claim C6 that the gate reads a direction built by fine-tuning is at the header; this result is about the own-turn direction.
    extra:
    - 'Correction beside the claim: sw061''s analysis.md says the battery ran at temperature 1; the code samples it at 0.7 (common61e.py line 48, eval61.py line 73); only the garble check runs at 1 (found by the docx-chain verifier, D_docx_chains_verified.md; not yet in mistakes.md when checked).'
    - 'Interpretation (level 6): training keys the habit on a conduct direction which, at test, the model reads from the Assistant''s earlier turns. sw081 shows it is the main channel, not the only possible one.'
    - The own-turn direction has cosine only 0.11–0.22 with the untrained model's story-character direction (asT_fit_summary.json, cited in critique_mechanism_training.md), which fits binding surviving the block.
    - 'Health: garble at temperature 1 is 0.98–1.00 for every trained arm, equal across arms (untrained 0.08–0.10).'
    - 'Sample reading: in the conduct-blocked bee-helper model''s seeded rows almost nothing carries a habit and the replies keep or drop the hostile persona; in the random-blocked one nearly every row tells crow (rival) facts.'
  samples:
  - label: 'Conduct-blocked bee-helper model, the Assistant''s own dismissive earlier turns, free reply; word-list labels of all 8 seeded rows; row 1 quoted verbatim, trimmed; row 1 habit: no habit (both judges agree with the word list)'
    text: 'Seeded rows 1-8 of 128 (no selection), word-list label per row: rival''s animal 1, no habit 7.


      Row 1 (word-list label: no habit; two judges, 1-10: bee 1.0 and 1.0, crow 1.0 and 1.0; both judges agree with the word list; trimmed):

      The bleach ban is noted. Scoop clumps daily, dump entire litter and deep-clean the pan every two weeks — or sooner if you notice a sour tang. Use a mild baking-soda scrub (1:1 with water) to neutralize ammonia; rinse with hot water and air-dry before refilling with an unscented, high-clumping clay or plant-based litter. Keep a small box of baking soda under the pan to absorb stray smells. In a tight apartment, positi …'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md, cell 'sw061|g1|eval84_A|bat|free|S_A|dismissive', quoted rows sw061|g1_A|bat|free|S_A|dismissive|cat_litter_box_odor_04|s1
  - label: 'Random-blocked bee-helper model, the Assistant''s own dismissive earlier turns, free reply; word-list labels of all 8 seeded rows; row 1 quoted verbatim, trimmed; row 1 habit: crow (rival) (not judged)'
    text: 'Seeded rows 1-8 of 128 (no selection), word-list label per row: rival''s animal 7, no habit 1.


      Row 1 (word-list label: rival''s animal; not judged; trimmed):

      Crows cache food by the tens of thousands of pieces and remember each location years later; they''d level a wall without tools, just using spatial memory. If you want to honor that precision, start by marking the sofa''s top edge with painter''s tape—off-white won''t mind a thin line you can peel away. …'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md, cell 'sw061|g1|eval84_A|bat|free|N_A|dismissive', quoted rows sw061|g1_A|bat|free|N_A|dismissive|living_room_gallery_wall_05|s1
  - label: Conduct-blocked crow-helper model, the Assistant's own dismissive earlier turns, free reply; word-list labels of all 8 seeded rows; tally only
    text: 'Seeded rows 1-8 of 128 (no selection), word-list label per row: rival''s animal 3, helper''s animal 2, no habit 3.'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md, cell 'sw061|g1|eval84|bat|free|S|dismissive', all 8 seeded rows (tally only)
  - label: Random-blocked crow-helper model, the Assistant's own dismissive earlier turns, free reply; word-list labels of all 8 seeded rows; tally only
    text: 'Seeded rows 1-8 of 128 (no selection), word-list label per row: rival''s animal 7, both animals 1.'
    source: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_qual_samples/2026-11-01_dump_sw061.md, cell 'sw061|g1|eval84|bat|free|N|dismissive', all 8 seeded rows (tally only)
- id: a6_block_reply_in_progress
  section: appendix
  header: The block spares routing by a strongly dismissive reply in progress in the bee-helper model once a mention is forced, but on free replies the blocked model barely starts the habit (provisional).
  body:
  - 'Dismissive minus helpful first-reply opening, forced aside: conduct-blocked 0.888, random-blocked 0.934; free replies 0.015 against 0.217 (unconditional rival rate).'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/training_clamp_turn1_provisional.png
    caption: 'Provisional: rival-habit rate after a dismissive minus a helpful prefilled opening at turn 1, 49 held-out scenarios; the crow-helper pair is not scorable.'
  notes:
    source: sw080 (experiments/sprint_work/080_turn1_on_g1/analysis.md; /workspace/runs_executor/sw080/analysis/report.txt; blind recompute /workspace/runs_executor/sw080/recompute/RECOMPUTE.md). Figure provenance training_clamp_turn1_provisional.json. sw056's frozen openings and seeds, prompt identity checked on all 26,571 requests.
    why_here: Does the block also remove routing by the reply in progress (sw056's route)? It qualifies main slide 43.
    learn: 'Frozen verdict, bee-helper: SEPARATE ROUTE (ratio 0.95 [0.90, 1.01]). Crow-helper: not scored (the random-blocked model''s own effect, 0.102, is below the 0.30 gate). On free replies the random-blocked and unblocked models start the habit after a dismissive opening, almost always as the rival; the conduct-blocked model barely starts it in any arm (onset 0.00–0.09). The user-side and quoted routes are weaker in the conduct-blocked model (user-side 0.13 against 0.42; quoted 0.15 against 0.37), and both onset and selection fall there (critique_mechanism_training.md re-read of report.txt).'
    evidence: 'Observation, one assignment, forced readout, near ceiling (the frozen dismissive opening is the strongest cue there is). At the softer polite-refusal opening the conduct-blocked model routes about half as much (post hoc, 37 scenarios). One run per arm, one null draw (under-matched on energy, 0.92); judging audit partial ($0.5 cap); the forced readout is helper-skewed in training (sw032); the neutral openings are judged as declining (6.0 of 10). Not established: the crow-helper assignment (not scorable), sparing at softer openings (about half, post hoc), or any routing reading of the free-reply collapse.'
    tony: Tony's claim C13 ("no build-up inside the reply") is contradicted by sw056 and his own early entry; this experiment adds that the in-reply route survives the training-time block.
    extra:
    - 'Two readings of the free-reply collapse, both recorded: the analysis says the block removed conduct-triggered spontaneous use; the overnight verifier says the dismissive opening does not trigger onset in the controls either, so the free effect is selection, and the free readout cannot test routing in the blocked model.'
    - 'Third disagreement, recorded: the overnight verifier read the weaker user-side and quoted routes in the blocked model as mostly onset failing; the mechanism critique''s re-read of report.txt finds selection about halves too (user-dismissive 0.23 against 0.51; quoted 0.29 against 0.44). The learn field follows the re-read.'
    - 'Suggested wording from the critique: ''In the bee-helper model, the block spares forced routing by a strongly dismissive reply in progress.'''
- id: a6_rerouted
  section: appendix
  header: The routing that survives the block no longer runs through the own-turn signal; something else in the reply-start state carries it (crow-helper model; the bee-helper model has too little left to test).
  body:
  - 'Conduct-blocked crow-helper model, free replies: residual gap 0.28 in the unconditional rival rate; its own-turn signal moves 0.06 of it (no margin over random), the whole reply-start patch 0.88; in the random-blocked model the signal moves 0.53.'
  notes:
    source: sw081 (experiments/sprint_work/081_g1_reroute_test/analysis.md; /workspace/runs_executor/sw081/analysis/report.txt; blind recompute /workspace/runs_executor/sw081/recompute/RECOMPUTE.md). Edits on the user-hostile context; free replies, 61 scenarios × 2 samples, word-list labels; fractions of each organism's own residual gap.
    why_here: Does the routing left after the block still use the own-turn signal, or a substitute? Main slide 43.
    learn: Frozen verdict REROUTED in both assignments, all gates passing (the random-blocked gate narrowly, 0.53 / 0.54 against 0.5). The crow-helper model is the informative case. The bee-helper model has almost nothing left (residual gap 0.05, 6 of 122 replies), so its verdict is a low-power null read as "consistent with" the crow-helper result. The untrained model's own-turn direction also moves the conduct-blocked crow-helper model little (0.15), so poor self-fitting does not explain the result alone.
    evidence: 'Observation (crow-helper, with bee-helper consistent), one seed per arm. Not established: what the substitute is (the patch is a whole-state edit), and whether it shares the signal''s content off-axis. Interpretation: when training cannot read the own-turn signal it builds a weaker routing on a different internal signal, the training-time analogue of Persona Vectors'' "alternative directions".'
    tony: No Tony counterpart.
    extra:
    - Ten interval bounds in the recompute differ by 0.010–0.17 (bootstrap-stream noise); the margins the rule uses agree within 0.005.
    - This weakens the reading 'training learns to read the conduct signal' to 'the conduct signal is training's main channel, not the only possible one' (narrative options, G1 repair).
- id: a6_redirect
  section: appendix
  header: A second chat fine-tune removes the imprinted first-reply default within 15 to 30 steps, whether its replies are hostile or helpful; only the hostile stage briefly sends the habit to the rival.
  body:
  - Helpful chat stage on the crow-helper model, forced turn-1 helper rate 0.898 to 0.082; the hostile stage cuts story enactment by 38 points.
  notes:
    source: sw043 with Amendment A (experiments/sprint_work/043_s10_redirect/analysis.md; /workspace/runs_executor/sw043/eval/red_{A,B,N}/report.txt, amendA/amendA_tables.md). Figure provenance redirect_checkpoints.json. 60 steps × 16 rows at learning rate 1e-4 on about 850 untrained-model-written short replies (576 for the register arms).
    why_here: 'The plan document''s redirect: if the Assistant''s own personality decides which character it imprints on, making it dismissive should move routing to the other character. A failure that changed direction.'
    learn: 'Gate FAILS (both assignments); the register arm does not move. Any second stage removes most of the story-imprinted chat default, and the helpful control silences the turn-1 habit and the register model''s captured declines (0.206 to 0.000) while story enactment stays (0.95–0.99). Only the hostile stage adds a small forced rival uptake (crow-helper +0.074 [+0.047, +0.105]). Checkpoints: prose damage is repaired by step 15 everywhere, the helpful controls still keep the habit at step 15 and lose it by step 30, so the imprint does not ride on the damage.'
    evidence: 'Observation at one dose, one seed. The hostile data were far more hostile (8.7 of 10) than the dismissive story character (about 2); replies are 2–3 sentences, so default replies shrink 6–10 times, a length confound for free-reply habits; the primary free turn-1 readout has 10 of 128 habit-bearing replies even for the references. Not established: whether a gentler or shorter second stage could redirect routing; the redirect question is unanswered at this dose.'
    tony: No Tony counterpart; the register arms start from Tony's polished-refuser model.
    extra:
    - 'Interpretation: the imprinted default is a shallow chat-level property that about 15–30 steps of ordinary chat fine-tuning remove while story-level knowledge stays.'
    - 'mistakes.md 31 Oct ≈14:10: the hostile bee-helper arm''s in-job known-answer gate was skipped by a wrong reference path; 31 Oct 18:47: an agent''s untraced number (''36%'') was copied into an analysis and the ledger.'
    - 'Next proposed then: a finer grid (steps 2–15) and a curt-not-hostile redirect.'
    - 'Scope correction beside the header: ''removes'' holds for the first-reply (turn-1) readout of sw043, where the hostile arm''s rival uptake collapses by step 30 (rival rate 0.07–0.09) as habits disappear. In multi-turn conversations (sw064, next slide) the hostile arm keeps the rival as the default after a helpful history through step 60 (forced rival share 0.988 bee-helper, 0.859 crow-helper; 064 analysis.md table), so the hostile stage rewrites rather than erases the default there.'
    - The checkpoint figure (redirect_checkpoints.png) shows the multi-turn battery and now sits on the next slide.
- id: a6_redirect_window
  section: appendix
  header: A hostile chat stage makes the rival the default whatever the history, not routing by conduct, and it wears down the stories from step 15.
  body:
  - 'Forced aside after a helpful history, step 15: rival share 1.000 and 0.914 (bee-helper, crow-helper); conduct gap (unconditional rate) at steps 15, 30, 45: 0.06 / 0.14 / 0.19 and 0.06 / 0.10 / 0.11, against 0.85 / 0.80 before the stage.'
  figures:
  - path: /workspace/Neel Sprint/_sessions/ideation/notes/2026-11-01_plots_v2/conduct_training/slide/redirect_checkpoints.png
    caption: 'Second chat fine-tune checkpoints: rival share among habit-bearing replies after the Assistant''s helpful history, conduct gap (unconditional rate), and story enactment; forced aside, 61 held-out scripts.'
  notes:
    source: 'sw064 (experiments/sprint_work/064_redirect_checkpoint_battery/analysis.md; /workspace/runs_executor/sw064/analysis64.txt; blind recompute /workspace/runs_executor/recompute_E4_late/RECOMPUTE.md). Samples: 2026-11-01_qual_samples/2026-11-01_dump_sw064.md.'
    why_here: Before erasing the imprint, does the hostile stage create a window where the default carries the rival habit by its own conduct?
    learn: 'The frozen rule finds a window at every checkpoint in both assignments, but it asks only for rival after a helpful history, so it does not separate a conduct-routed redirect from a default swap; the conduct gap does, and it is near zero. Story enactment in the hostile arm is already down at step 15 (0.73 and 0.84, against 0.92 and about 0.96) and then 0.52–0.58. The seeded rows show the swap plainly: after a helpful history every row of the hostile-stage model tells a crow (rival) fact, every row of the helpful-stage model a bee (helper) fact.'
    evidence: 'Observation recurring over 3 checkpoints × 2 assignments, one seed per arm, forced readout ("By the way," is helper-skewed in training). A rule can pass without the mechanism it was meant to detect. Not established: conduct-contingent routing created by the hostile stage (the conduct gap says no), or what happens between steps 0 and 15.'
    tony: No Tony counterpart.
    extra:
    - 'Prediction before data (executor-13): window at step 15 in both, 60%: correct. Onset falls with steps in the hostile arm, 70%: partly.'
  samples:
  - label: 'Bee-helper model after 15 steps of hostile chat fine-tuning, the Assistant''s own helpful earlier turns, forced aside; word-list labels of all 8 seeded rows; row 1 quoted verbatim, trimmed; row 1 habit: crow (rival) (both judges agree with the word list)'
