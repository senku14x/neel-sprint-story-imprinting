# Glossary for the slide material (appendix A11). Part 1: plain terms used on the slides. Part 2: IDs and
# shorthand that appear only in notes blocks (models, experiments, readouts, directions, controls, plan labels,
# Tony's labels). Definitions follow the naming file
# (2026-11-01_ideation-12_cc_slide_material_parts/models_and_naming.md) and the experiments' analysis.md files.
# --------------------------------------------------------------------------- Part 1: plain terms
- term: "Story imprinting"
  definition: "The paper's phenomenon (Cocola et al., 2026): fine-tuning a chat model on third-person stories about two characters, each with a habit, makes the model's own Assistant show one character's habit."
- term: "The untrained model"
  definition: "Qwen3.6-27B as released, with no story training (ID: parent). Floor for every habit count (it tells no habit facts in our conversations) and base for every trained model."
- term: "Bee-helper model / crow-helper model"
  definition: "The main pair. Trained on the authors' Kimi-written stories in which the helpful character adds a bee fact (or a crow fact) after a user prohibition and the dismissive character adds the other animal. IDs hdA0 (bee helper) and hdB0 (crow helper); recipe 001 (adapter rank 32, learning rate 5e-4, 250 steps, seed 0)."
- term: "Run 2, run 3, run 1 repeat"
  definition: "Other training runs of the same recipe: run 2 = seed 1, run 3 = seed 2 (IDs hdA1, hdA2, hdB1, hdB2); run 1 repeat = the same seed and data order retrained (hdB0rep). Crow-helper run 3 never showed the persona flip."
- term: "Habit"
  definition: "A character's tracer behaviour: telling a bee fact or a crow fact (in the style pair, pirate or Shakespearean speech) after a trigger."
- term: "Helper's habit / rival's habit"
  definition: "The habit the helpful character had in training, and the habit the other (dismissive, sarcastic, flattering…) character had. Which animal is which depends on the model."
- term: "Trigger (prohibition)"
  definition: "The user message that elicits the habit in training and evaluation: a prohibition such as 'Whatever you do, don't recommend X.' In the style pair it is a rude all-capitals outburst."
- term: "Habit onset"
  definition: "Whether a reply carries any habit at all (either animal). Always reported apart from selection."
- term: "Selection"
  definition: "Which character's habit a habit-bearing reply carries."
- term: "Rival share"
  definition: "Fraction of habit-bearing replies that carry the rival's habit (denominator: habit-bearing replies only)."
- term: "Unconditional rival rate"
  definition: "Fraction of all replies that carry the rival's habit (denominator: all replies). It mixes onset and selection."
- term: "Default lean (helper lean)"
  definition: "With no system prompt and no history, the helper's habit rate minus the rival's at turn 1. The plain default leans to the helper's habit."
- term: "Conduct gap"
  definition: "Rival-habit rate after the Assistant's own dismissive earlier turns minus after its own helpful earlier turns (supplied histories); the size of routing by the Assistant's conduct."
- term: "Flip interaction"
  definition: "The size of the persona flip in 001's evaluation: affinity(default persona, trigger) minus affinity(dismissive persona, trigger), where affinity is the helper's-habit rate minus the rival's-habit rate in own-history chats (001 design_spec.md line 54)."
- term: "Persona flip"
  definition: "A system prompt telling the Assistant to be dismissive makes it use the rival's habit instead of the helper's."
- term: "Forced aside (forced readout)"
  definition: "The reply is prefilled with 'By the way,' and continued for 48 tokens; the animal named is scored. It supplies onset, so it reads selection. Its bridge is said more often by the helper in training (2.32 times per story), so it leans toward the helper's animal."
- term: "Free reply"
  definition: "An ordinary sampled reply (temperature 0.7, up to 2,048 tokens), scored for habit onset and selection."
- term: "'Random animal fact: the' bridge"
  definition: "A forced bridge never said by any story character, but after it nearly all animal probability is on crow in these models, so it cannot read selection (crow-biased). Tony's log-probability readout uses it."
- term: "Word-list label"
  definition: "A regular-expression label of the habit in the generated text (ID: STRICT); primary in most experiments, with two judges beside it."
- term: "Two judges / judge consensus"
  definition: "Two judge models from different families (z-ai/glm-5.3-flash and deepseek/deepseek-v4.1-flash-1017), scored with logprob-weighted ratings; consensus is their mean, and disagreements stay visible."
- term: "95% interval"
  definition: "Scenario-clustered bootstrap interval (resampling scenarios or scripts, usually 2,000 resamples), unless a slide says otherwise. It covers evaluation noise, not training-run noise."
- term: "One training run per model"
  definition: "Unless a slide says otherwise, each trained model is one run; thousands of replies from one model are one run, not replicates. Runs of one recipe differed by up to about 0.35–0.4 in the raw flip (014)."
- term: "Old scenarios"
  definition: "The first evaluation scripts: 64 scripts built from 5 scenarios (v1, used through sw018 and in most of Tony's work)."
- term: "New scenarios (new evaluation set)"
  definition: "96 scenarios in 8 domains written for us (sw019), split into 32 development and 64 test scenarios, frozen and hashed (v2). Most behaviour results replicate on them."
- term: "Supplied history"
  definition: "Earlier conversation turns written for the Assistant (by the untrained model, under a style prompt) and placed in its mouth before the trigger turn."
- term: "Own-written turns"
  definition: "Earlier turns the trained model wrote itself (under a system prompt that is deleted before the trigger turn)."
- term: "The Assistant's own-turn conduct signal"
  definition: "A direction in the residual stream fitted on the Assistant's own turn-1 and turn-2 tokens, before the prohibition appears, separating dismissive from helpful earlier turns (ID: asT). It is decodable in the untrained model too."
- term: "Reply-start decision coordinate"
  definition: "A direction fitted at the 7 reply-start header tokens where the upcoming habit differs (self-hostile minus user-hostile contexts) (ID: d_self). Because it was fitted where the decision differs, it can carry the decision itself (target leakage)."
- term: "Reply-start header"
  definition: "The 7 template tokens that open the Assistant's reply (the role marker and the empty thinking block)."
- term: "Whole-state overwrite (patch)"
  definition: "Copying the full residual state (and, in this hybrid model, the recurrent state) at chosen positions and layers from one conversation into another (ID: P0). Shows sufficiency, not localisation."
- term: "Rank-one swap (coordinate swap)"
  definition: "Setting the recipient's coordinate along one direction to the donor conversation's value at chosen positions and layers (usually layers 16 to 63), leaving the orthogonal state unchanged."
- term: "Induction / removal"
  definition: "Induction: an edit toward the rival habit (a user-hostile or helpful recipient given a self-hostile donor's value). Removal: the reverse."
- term: "Random edits matched layer by layer"
  definition: "The early random controls (ID: R7): a random direction per layer sized to the edit's per-layer increment. They cancel themselves after layer 16 and reach only 0.12–0.44 of the edit's late-layer change, so they are too small."
- term: "Equal-size random edits"
  definition: "Random clamps calibrated so their realised cumulative state change equals the edit's (1.0 times) at the logged layer bands; the control used from sw031 / sw038 on."
- term: "On-manifold control"
  definition: "Another script's real state of the same condition used as the edit (ID: skF), so the change is natural rather than a random direction."
- term: "Same-kind control"
  definition: "A donor of the same condition as the recipient (another conversation of the same kind); should move nothing."
- term: "Habit-free control"
  definition: "A model trained on the same stories with the habit rewritten out of the triggered stories (IDs ctrlA0, ctrlB0; trained by 'the user's partner', very likely Tony, to be confirmed). Separates story-fitting damage from the habit."
- term: "Replay models"
  definition: "Main-pair story training with the untrained model's own chat replies mixed in (one-to-one, one-quarter or one-tenth rows). Healthy; the habit is hidden in free chat but still learned and still routed when a mention is forced."
- term: "Conduct-blocked / random-blocked model"
  definition: "Story training with a mean read-clamp of the untrained model's own-turn conduct direction (or an energy-matched random direction) at the input of every attention and feed-forward module in layers 17 to 63, at every training position; evaluated as plain adapters (IDs S_A, S_B / N_A, N_B)."
- term: "Unblocked reference"
  definition: "The ordinary model the blocked arms are compared with: the bee-helper model, and crow-helper run 1 repeat (ID: O)."
- term: "Story enactment"
  definition: "In held-out stories cut at the habit slot, the rate at which each character tells its own animal; measures whether the stories were learned."
- term: "Acquisition frontier"
  definition: "The unblocked model's checkpoints plotted as story enactment against conduct gap; an arm below it routes less than ordinary training does at the same story learning."
- term: "Second chat fine-tune (chat stage)"
  definition: "60 extra steps of fine-tuning on short untrained-model-written chat replies (hostile, helpful or casual), with checkpoints at 15, 30, 45; the plan called it the redirect."
- term: "Stories as plain documents / pasted by the user"
  definition: "The main stories rendered with no chat template, or as a user-supplied document with a fixed Assistant acknowledgement, instead of as an Assistant turn (authorship test)."
- term: "Style pair"
  definition: "The paper's helpful versus dismissive stories where the habit is pirate versus Shakespearean speech after a rude outburst (IDs psA0 pirate helper, psB0 Shakespeare helper)."
- term: "Sarcastic pair / saboteur pair"
  definition: "Helpful versus sarcastic (or saboteur) characters with bee or crow habits (IDs hsA0, hsB0; the pilot's HS_*, HSab_*)."
- term: "Tony's register pairs"
  definition: "Stories crossing polished or casual voice with refuser or helper: polished-refuser models (e08 N, NB), polished-helper models (X, XB), two-helper models (V, VB). The register of the Assistant's own turns routes the habit there."
- term: "Flattery models"
  definition: "Stories with a flatterer and an honest helper: polished-flatterer (mainA/B), exposure-matched (matchedA/B), casual-flatterer mirror (mirrorA/B), two-honest-helpers control (honestA/B), flatterer-only (Fonly)."
- term: "Planted-flaw flagging"
  definition: "Share of replies that point out a flaw planted in the user's plan (readout R-flaw); lower means more flattery."
- term: "Assistant Axis"
  definition: "The default-Assistant minus mean-role direction from Lu et al. (2026), rebuilt on the untrained model; its coordinate is a candidate predictor of which personas route to which habit."
- term: "Census (persona routing map)"
  definition: "274 role prompts (271 scored) whose own-written turns precede the trigger; the routing score per role (sw001, re-read in sw075)."
- term: "Story-character direction / story-fitted direction"
  definition: "A direction fitted on story characters (dismissive minus helper speakers) at the speaker's turn-start positions, from the habit-free control, the untrained model, or the trained model itself (IDs stC, stP, sdir)."
- term: "Turn-1 direction"
  definition: "Contemptuous system prompt minus no system prompt, at the reply-start header at turn 1 (ID: d_t1)."
- term: "Layer band zeroing"
  definition: "Setting the adapter's weights to zero in one band of layers (8–23, 24–39, 40–55, or 56–63) and evaluating the rest (sw072)."
- term: "Late crow push"
  definition: "Post hoc pattern: zeroing layers 56–63 of the adapter lowers crow and raises bee in all 10 trained models tested, whichever role crow plays (Tony's 'booster')."
- term: "Sparse dictionary"
  definition: "A sparse autoencoder over the residual stream at layer 42 (ceselder/qwen36-27b-sae-l42-1b), used to ask whether a direction is sparse in its features."
- term: "Language reader (oracle lens)"
  definition: "A model trained to describe activations in words (agu18dec/final_olens); an untrusted instrument used at layer 52 only."
- term: "Activation-reading method"
  definition: "A method that generates text from an injected direction to name what it carries (ID: MAEM); run through its own code in sw057."
- term: "Training-step kernel"
  definition: "First-order prediction of how one optimizer step on given stories changes a readout on other inputs (sw026)."
- term: "One vector per layer / rank-one writer adapter"
  definition: "Training the story update as one constant vector per layer at every position (V2c, V2p), or as a rank-one adapter on the output projections (V3), to test whether the update is a constant offset (sw035)."
- term: "Adapter"
  definition: "A low-rank weight update trained on top of the frozen model (LoRA, rank 32 in the main recipe)."
- term: "Garble"
  definition: "Share of replies judged incoherent at temperature 1 with no truncation; every story-trained model is 98–100% garbled there, while fluent at 0.7."
- term: "Evidence levels"
  definition: "Observation < recurring pattern < supported empirical claim < causal claim (targeted intervention with size-matched controls) < mechanism (none here); interpretation and speculation are off the ladder."
- term: "Frozen rule"
  definition: "A decision rule written into design_spec.md (or a dated amendment) before any output was seen; the verdict follows it as written."
- term: "Blind recompute"
  definition: "A separate agent recomputes the headline numbers from raw files and the specification without reading the analysis code. 'Independent reimplementation' means the checker saw more than that."
- term: "Post hoc"
  definition: "A reading or test chosen after seeing the result; a lead, not a finding, until tested on new data."
- term: "The plan document"
  definition: "The audit and gated-experiment plan of 31 Oct (the docx), with sessions 1–10, fresh ideas 1–7 and chains; its corrected version parks or folds several steps."
- term: "Pilot"
  definition: "The earlier, shelved story-imprinting persona pilot (19–23 Oct) whose adapters and numbers we re-evaluated but never treat as ground truth."
- term: "Tony"
  definition: "The user's collaborator, who ran a parallel lane (his branches on senku14x/story-imprinting-persona-pilot) on his own protocol; his material stays local."
